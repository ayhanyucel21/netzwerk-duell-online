<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🚦 Ticket Triage</title><style>:root{--bg:#050b17;--p:#0b1e35;--t:#f7fbff;--m:#aec2d2;--l:#ffffff1c;--c:#4bdbff;--g:#45dc96;--r:#ff6e82;--y:#ffd166;--v:#a281ff}*{box-sizing:border-box}html{font-size:14px}body{margin:0;min-height:100vh;color:var(--t);font-family:Segoe UI,Arial;background:radial-gradient(circle at 8% 7%,#ff8e4f26,transparent 26%),radial-gradient(circle at 92% 9%,#8d5fff32,transparent 28%),#050b17}.wrap{width:min(980px,calc(100% - 18px));margin:auto;padding:12px}.top a{color:#fff;text-decoration:none}.hero,.game{margin-top:10px;padding:18px;border:1px solid var(--l);border-radius:18px;background:#0b1e35e8}.hero h1{margin:7px 0;font-size:clamp(1.8rem,4vw,3rem)}.hud{display:flex;justify-content:space-between;gap:8px;margin:10px 0;color:var(--m)}.bar{height:9px;background:#ffffff10;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--v),var(--c),var(--g))}.cards,.zones,.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card,.zone,.opt,.btn{padding:12px;border:1px solid var(--l);border-radius:12px;color:#fff;background:#123250;cursor:pointer}.card.selected{border-color:var(--y);background:#3d3658}.zone{min-height:90px;border-style:dashed}.ok{background:#144b39!important;border-color:var(--g)!important}.bad{background:#57233a!important;border-color:var(--r)!important}.feedback{margin-top:10px;padding:11px;border-radius:10px;background:#071426}.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;aspect-ratio:16/8;position:relative;background:#10294a}.secret{position:absolute;inset:0;display:grid;place-items:center;font-size:5rem}.tile{z-index:2;background:#17375c;border:1px solid #ffffff0d}.tile.open{opacity:0}.steps{display:flex;flex-wrap:wrap;gap:8px}.answer{min-height:70px;margin-top:10px;padding:9px;border:2px dashed #ffffff25;border-radius:12px}@media(max-width:600px){.cards,.zones,.opts{grid-template-columns:1fr}}</style></head><body><main class="wrap"><nav class="top"><a href="/lf06/games/">← Lernspiele</a></nav><header class="hero"><h1>🚦 Ticket Triage</h1><p>Ziehe Tickets in die richtige Prozessklasse.</p></header><section class="game"><div class="hud"><b id="score">0 XP</b><span id="pos"></span></div><div id="cards" class="cards"></div><h3>Ziel auswählen</h3><div id="zones" class="zones"><button class="zone" data-t="Incident">Incident</button><button class="zone" data-t="Service Request">Service Request</button><button class="zone" data-t="Request for Change">Request for Change</button><button class="zone" data-t="Problem">Problem</button></div><div id="fb" class="feedback">Ticket auswählen und anschließend die Zielklasse wählen.</div></section></main><script>const Q=[['DATEV-PROD ist für 50 Personen ausgefallen.','Incident'],['Praktikanten-Account für nächste Woche.','Service Request'],['Cloud-Migration mit Risikoanalyse und Freigabe.','Request for Change'],['Dritter identischer Firmwarefehler in zwei Monaten.','Problem'],['Passwort ist unerwartet nicht nutzbar.','Incident'],['Standardsoftware soll bereitgestellt werden.','Service Request']];let i=0,xp=0,sel=false;const $=x=>document.getElementById(x);function show(){$('pos').textContent=(i+1)+'/'+Q.length;$('cards').innerHTML='<button class="card" id="ticket">'+Q[i][0]+'</button>';$('ticket').onclick=()=>{sel=true;$('ticket').classList.add('selected')}}document.querySelectorAll('.zone').forEach(z=>z.onclick=()=>{if(!sel)return;const ok=z.dataset.t===Q[i][1];z.classList.add(ok?'ok':'bad');if(ok)xp+=10;$('score').textContent=xp+' XP';$('fb').innerHTML='<b>'+(ok?'Richtig':'Nicht richtig')+'.</b> Richtige Einordnung: '+Q[i][1];setTimeout(()=>{z.classList.remove('ok','bad');sel=false;i++;i<Q.length?show():$('cards').innerHTML='<h2>Geschafft · '+xp+' XP</h2>'},900)});show();</script><script>window.LF06_KPI_MISSIONS=[{label:'KPI-Mission',q:'150 von 200 Tickets werden beim ersten Kontakt gelöst. Wie hoch ist die FCR?',options:['75 %','50 %','80 %','150 %'],answer:'75 %',explanation:'150 / 200 × 100 = 75 %.'},{label:'KPI-Mission',q:'Welche Kennzahl misst direkt die Bearbeitungsgeschwindigkeit?',options:['Mittlere Lösungszeit','RACI-Rollenanzahl','Gerätefarbe','Standortname'],answer:'Mittlere Lösungszeit',explanation:'Die mittlere Lösungszeit ist eine zeitbezogene Service-KPI.'}];</script></body></html>
