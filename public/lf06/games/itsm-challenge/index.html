<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⚡ ITSM Challenge</title><style>:root{--bg:#050b16;--panel:#0b2038;--text:#f5fbff;--muted:#adc1d1;--line:#ffffff1d;--cyan:#4bdbff;--violet:#a282ff;--green:#45dc96;--red:#ff6e82;--yellow:#ffd166;--orange:#ff9858}*{box-sizing:border-box}html{font-size:14px}body{margin:0;min-height:100vh;color:var(--text);font-family:"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 9% 6%,#4bdbff1f,transparent 25%),radial-gradient(circle at 92% 7%,#a282ff34,transparent 27%),linear-gradient(155deg,#050b16,#07172a 60%,#080d1b)}button{font:inherit}.wrap{width:min(980px,calc(100% - 18px));margin:auto;padding:12px}.top{display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none}.hero,.game{margin-top:10px;padding:19px;border:1px solid var(--line);border-radius:20px;background:#0b2038e8;backdrop-filter:blur(10px);box-shadow:0 20px 50px #0006}.hero h1{margin:7px 0;font-size:clamp(1.9rem,4vw,3.2rem)}.hero p{margin:0;color:var(--muted);line-height:1.5}.goal{padding:11px;border-left:4px solid var(--yellow);border-radius:10px;background:#3a3229}.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{padding:7px 10px;border-radius:99px;background:#ffffff0d}.progress{height:10px;border-radius:99px;overflow:hidden;background:#ffffff10}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan),var(--green));transition:.35s}.grid,.opts,.zones{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card,.opt,.zone,.btn{padding:13px;border:1px solid var(--line);border-radius:13px;color:#fff;background:#123451;cursor:pointer;text-align:left;transition:.18s}.card:hover:not(:disabled),.opt:hover:not(:disabled),.zone:hover:not(:disabled),.btn:hover{transform:translateY(-2px);border-color:#4bdbff88;box-shadow:0 10px 25px #0004}.selected{border-color:var(--yellow)!important;background:#403758!important}.ok{border-color:var(--green)!important;background:#154a38!important;animation:pop .42s}.bad{border-color:var(--red)!important;background:#57243a!important;animation:shake .35s}.feedback{margin-top:11px;padding:13px;border-radius:11px;background:#071426;line-height:1.55}.actions{display:flex;justify-content:space-between;gap:9px;margin-top:12px}.reset{background:#3b2945}.next{background:#154a63}.next:disabled{opacity:.4;cursor:not-allowed}.final{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:14px;background:#020713e8}.final-card{width:min(580px,100%);padding:30px;border:1px solid #ffd16655;border-radius:25px;text-align:center;background:radial-gradient(circle at 50% 0,#ffd1662d,transparent 35%),linear-gradient(145deg,#102c4e,#271d48);box-shadow:0 28px 90px #000a;animation:final .55s}.final-icon{font-size:5rem;animation:bounce .8s infinite alternate}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-18px;width:9px;height:17px;background:var(--c);animation:fall 2.2s linear forwards}.mountain{height:320px;position:relative;margin:12px 0;border-radius:17px;overflow:hidden;background:linear-gradient(#0d2948,#214a64)}.mountain:after{content:'▲';position:absolute;left:50%;bottom:-45px;transform:translateX(-50%) scaleX(5);font-size:18rem;color:#233c52}.peak,.climber{position:absolute;z-index:2;left:50%;transform:translateX(-50%)}.peak{top:15px;font-size:3rem}.climber{bottom:10px;font-size:3rem;transition:.5s}.hidden{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;aspect-ratio:16/8;position:relative;border-radius:15px;overflow:hidden;background:linear-gradient(135deg,#125b75,#704589)}.secret{position:absolute;inset:0;display:grid;place-items:center;font-size:4rem}.tile{z-index:2;background:#153657;border:1px solid #ffffff10;transition:.4s}.tile.open{opacity:0}.word{font:900 2rem/1.3 Consolas,monospace;letter-spacing:.2em;text-align:center;margin:16px 0}.kbd{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}.kbd button{width:39px;height:39px;border:1px solid var(--line);border-radius:9px;color:#fff;background:#123451}.lives{color:#ff7f8e;font-size:1.3rem}@keyframes pop{50%{transform:scale(1.025)}}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}@keyframes final{from{opacity:0;transform:scale(.75)}}@keyframes bounce{to{transform:translateY(-9px) rotate(4deg)}}@keyframes fall{to{transform:translateY(110vh) rotate(700deg)}}@media(max-width:650px){.grid,.opts,.zones{grid-template-columns:1fr}.actions{flex-direction:column}}</style></head><body><main class="wrap"><nav class="top"><a href="/lf06/games/">← Lernspiele</a><button class="btn reset" onclick="resetGame()">↻ Zurücksetzen</button></nav><header class="hero"><h1>⚡ ITSM Challenge</h1><p>Sammle XP und Combos. Nach jeder Antwort entscheidest du selbst, wann die nächste Mission beginnt.</p></header><section class="game"><div class="goal"><b>Ziel:</b> Mindestens 60 XP und zwei verbleibende Leben erreichen.</div><div class="hud"><b id="xp">0 XP</b><span id="combo" class="pill">Combo ×0</span><span id="lives" class="lives">♥♥♥</span></div><div class="progress"><i id="bar"></i></div><h2 id="q"></h2><div id="opts" class="opts"></div><div id="fb" class="feedback"></div><div class="actions"><button class="btn reset" onclick="resetGame()">↻ Challenge zurücksetzen</button><button id="next" class="btn next" disabled>Nächste Mission →</button></div></section></main><script>function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function finalScreen(success,title,text,icon){const x=document.createElement('div');x.className='final';x.innerHTML='<div class="confetti"></div><div class="final-card"><div class="final-icon">'+icon+'</div><h1>'+title+'</h1><p>'+text+'</p><button class="btn" onclick="location.reload()">Neu starten</button><br><br><a style="color:#7fe7ff" href="/lf06/games/">← Zu den Lernspielen</a></div>';document.body.appendChild(x);if(success){const c=x.querySelector('.confetti'),colors=['#4bdbff','#a282ff','#45dc96','#ffd166','#ff6e82','#ff9858'];for(let i=0;i<45;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.setProperty('--c',colors[i%colors.length]);e.style.animationDelay=Math.random()*.7+'s';c.appendChild(e)}}}function resetGame(){location.reload()}let Q=shuffle([{q:'Was bestimmt die Priorität?',o:['Impact und Urgency','Nur Lautstärke','Nur Abteilung'],a:'Impact und Urgency',e:'Priorität wird typischerweise aus Auswirkung und Zeitkritikalität abgeleitet.'},{q:'Welcher Prozess sucht die Root Cause?',o:['Problem Management','Incident Logging','Service Request'],a:'Problem Management',e:'Problem Management untersucht zugrunde liegende Ursachen.'},{q:'Welche Eskalation braucht Fachwissen?',o:['Funktionale Eskalation','Hierarchische Eskalation','Keine Eskalation'],a:'Funktionale Eskalation',e:'Funktionale Eskalation führt zu Spezialisten oder höheren Support-Leveln.'},{q:'Was ist ein Workaround?',o:['Temporäre Umgehung','Permanent Fix','ISO-Norm'],a:'Temporäre Umgehung',e:'Ein Workaround reduziert Auswirkungen, entfernt die Root Cause aber nicht zwingend.'},{q:'Was misst MTTR?',o:['Wiederherstellungsdauer','Zeit zwischen Ausfällen','Anrufverteilung'],a:'Wiederherstellungsdauer',e:'MTTR ist die durchschnittliche Zeit zur Reparatur bzw. Wiederherstellung.'},{q:'Was ist ein OLA?',o:['Interne Teamvereinbarung','Externer Lieferantenvertrag','Datenschutzvertrag'],a:'Interne Teamvereinbarung',e:'Ein OLA koordiniert interne Leistungen zur Unterstützung eines SLA.'}]);let i=0,xp=0,l=3,c=0,locked=false;const $=x=>document.getElementById(x);function show(){locked=false;const x=Q[i];$('bar').style.width=i/Q.length*100+'%';$('q').textContent=x.q;$('opts').innerHTML=shuffle(x.o).map(o=>'<button class="opt">'+o+'</button>').join('');$('fb').textContent='Wähle die fachlich beste Antwort.';$('next').disabled=true;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const ok=b.textContent===x.a;if(ok){c++;xp+=10+c*2}else{c=0;l--}b.classList.add(ok?'ok':'bad');[...document.querySelectorAll('.opt')].find(z=>z.textContent===x.a)?.classList.add('ok');document.querySelectorAll('.opt').forEach(z=>z.disabled=true);$('xp').textContent=xp+' XP';$('combo').textContent='Combo ×'+c;$('lives').textContent='♥'.repeat(l)+'♡'.repeat(3-l);$('fb').innerHTML='<b>'+(ok?'Richtig.':'Nicht richtig.')+'</b><br><b>Richtige Antwort:</b> '+x.a+'<br>'+x.e;$('next').disabled=false})}$('next').onclick=()=>{i++;if(i<Q.length&&l>0)show();else finalScreen(xp>=60&&l>=2,xp>=60&&l>=2?'Challenge gemeistert!':'Training abgeschlossen',xp+' XP · '+l+' Leben übrig. '+(xp>=60?'Starke Leistung.':'Wiederhole die Erklärungen und starte eine neue Runde.'),xp>=60?'⚡':'🌱')};show();</script></body></html>
