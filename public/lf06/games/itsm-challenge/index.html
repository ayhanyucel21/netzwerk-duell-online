<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⚡ ITSM Challenge</title><style>:root{--bg:#050b17;--p:#0b1e35;--t:#f7fbff;--m:#aec2d2;--l:#ffffff1c;--c:#4bdbff;--g:#45dc96;--r:#ff6e82;--y:#ffd166;--v:#a281ff}*{box-sizing:border-box}html{font-size:14px}body{margin:0;min-height:100vh;color:var(--t);font-family:Segoe UI,Arial;background:radial-gradient(circle at 8% 7%,#ff8e4f26,transparent 26%),radial-gradient(circle at 92% 9%,#8d5fff32,transparent 28%),#050b17}.wrap{width:min(980px,calc(100% - 18px));margin:auto;padding:12px}.top a{color:#fff;text-decoration:none}.hero,.game{margin-top:10px;padding:18px;border:1px solid var(--l);border-radius:18px;background:#0b1e35e8}.hero h1{margin:7px 0;font-size:clamp(1.8rem,4vw,3rem)}.hud{display:flex;justify-content:space-between;gap:8px;margin:10px 0;color:var(--m)}.bar{height:9px;background:#ffffff10;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--v),var(--c),var(--g))}.cards,.zones,.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card,.zone,.opt,.btn{padding:12px;border:1px solid var(--l);border-radius:12px;color:#fff;background:#123250;cursor:pointer}.card.selected{border-color:var(--y);background:#3d3658}.zone{min-height:90px;border-style:dashed}.ok{background:#144b39!important;border-color:var(--g)!important}.bad{background:#57233a!important;border-color:var(--r)!important}.feedback{margin-top:10px;padding:11px;border-radius:10px;background:#071426}.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;aspect-ratio:16/8;position:relative;background:#10294a}.secret{position:absolute;inset:0;display:grid;place-items:center;font-size:5rem}.tile{z-index:2;background:#17375c;border:1px solid #ffffff0d}.tile.open{opacity:0}.steps{display:flex;flex-wrap:wrap;gap:8px}.answer{min-height:70px;margin-top:10px;padding:9px;border:2px dashed #ffffff25;border-radius:12px}@media(max-width:600px){.cards,.zones,.opts{grid-template-columns:1fr}}</style></head><body><main class="wrap"><nav class="top"><a href="/lf06/games/">← Lernspiele</a></nav><header class="hero"><h1>⚡ ITSM Challenge</h1><p>Schnelle Missionen mit Combo und drei Leben.</p></header><section class="game"><div class="hud"><b id="xp">0 XP</b><span id="lives">♥♥♥</span><span id="pos"></span></div><div class="bar"><i id="bar"></i></div><h2 id="q"></h2><div id="opts" class="opts"></div><div id="fb" class="feedback"></div></section></main><script>const Q=[['Was bestimmt die Priorität?',['Impact und Urgency','Nur Lautstärke','Nur Abteilung'],0],['Welcher Prozess sucht die Root Cause?',['Problem Management','Incident Logging','Service Request'],0],['Welche Eskalation braucht Fachwissen?',['Funktionale Eskalation','Hierarchische Eskalation','Keine Eskalation'],0],['Was ist ein Workaround?',['Temporäre Umgehung','Endgültige Root-Cause-Lösung','ISO-Norm'],0]];let i=0,xp=0,l=3,c=0;const $=x=>document.getElementById(x);function show(){const q=Q[i];$('pos').textContent=(i+1)+'/'+Q.length;$('bar').style.width=(i/Q.length*100)+'%';$('q').textContent=q[0];$('opts').innerHTML=q[1].map((x,n)=>'<button class="opt" data-i="'+n+'">'+x+'</button>').join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===q[2];b.classList.add(ok?'ok':'bad');if(ok){c++;xp+=10+c*2}else{c=0;l--}document.querySelectorAll('.opt')[q[2]].classList.add('ok');$('xp').textContent=xp+' XP';$('lives').textContent='♥'.repeat(l)+'♡'.repeat(3-l);$('fb').textContent=ok?'Mission geschafft · Combo x'+c:'Fehler analysiert · richtige Antwort markiert';setTimeout(()=>{i++;i<Q.length&&l>0?show():$('opts').innerHTML='<h2>Challenge beendet · '+xp+' XP</h2>'},900)})}show();</script><script>window.LF06_KPI_MISSIONS=[{label:'KPI-Mission',q:'150 von 200 Tickets werden beim ersten Kontakt gelöst. Wie hoch ist die FCR?',options:['75 %','50 %','80 %','150 %'],answer:'75 %',explanation:'150 / 200 × 100 = 75 %.'},{label:'KPI-Mission',q:'Welche Kennzahl misst direkt die Bearbeitungsgeschwindigkeit?',options:['Mittlere Lösungszeit','RACI-Rollenanzahl','Gerätefarbe','Standortname'],answer:'Mittlere Lösungszeit',explanation:'Die mittlere Lösungszeit ist eine zeitbezogene Service-KPI.'}];</script></body></html>
