<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🔄 IMAC/RD Puzzle</title><style>:root{--bg:#050b17;--p:#0b1e35;--t:#f7fbff;--m:#aec2d2;--l:#ffffff1c;--c:#4bdbff;--g:#45dc96;--r:#ff6e82;--y:#ffd166;--v:#a281ff}*{box-sizing:border-box}html{font-size:14px}body{margin:0;min-height:100vh;color:var(--t);font-family:Segoe UI,Arial;background:radial-gradient(circle at 8% 7%,#ff8e4f26,transparent 26%),radial-gradient(circle at 92% 9%,#8d5fff32,transparent 28%),#050b17}.wrap{width:min(980px,calc(100% - 18px));margin:auto;padding:12px}.top a{color:#fff;text-decoration:none}.hero,.game{margin-top:10px;padding:18px;border:1px solid var(--l);border-radius:18px;background:#0b1e35e8}.hero h1{margin:7px 0;font-size:clamp(1.8rem,4vw,3rem)}.hud{display:flex;justify-content:space-between;gap:8px;margin:10px 0;color:var(--m)}.bar{height:9px;background:#ffffff10;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--v),var(--c),var(--g))}.cards,.zones,.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card,.zone,.opt,.btn{padding:12px;border:1px solid var(--l);border-radius:12px;color:#fff;background:#123250;cursor:pointer}.card.selected{border-color:var(--y);background:#3d3658}.zone{min-height:90px;border-style:dashed}.ok{background:#144b39!important;border-color:var(--g)!important}.bad{background:#57233a!important;border-color:var(--r)!important}.feedback{margin-top:10px;padding:11px;border-radius:10px;background:#071426}.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;aspect-ratio:16/8;position:relative;background:#10294a}.secret{position:absolute;inset:0;display:grid;place-items:center;font-size:5rem}.tile{z-index:2;background:#17375c;border:1px solid #ffffff0d}.tile.open{opacity:0}.steps{display:flex;flex-wrap:wrap;gap:8px}.answer{min-height:70px;margin-top:10px;padding:9px;border:2px dashed #ffffff25;border-radius:12px}@media(max-width:600px){.cards,.zones,.opts{grid-template-columns:1fr}}</style></head><body><main class="wrap"><nav class="top"><a href="/lf06/games/">← Lernspiele</a></nav><header class="hero"><h1>🔄 IMAC/RD Puzzle</h1><p>Baue den IT-Asset-Lebenszyklus in der richtigen Reihenfolge.</p></header><section class="game"><div class="hud"><b id="score">0 XP</b><span>Reihenfolge-Puzzle</span></div><div id="steps" class="steps"></div><div id="answer" class="answer"></div><button id="check" class="btn">Reihenfolge prüfen</button><div id="fb" class="feedback">Klicke die Phasen in der richtigen Reihenfolge an.</div></section></main><script>const correct=['Install','Move','Add','Change','Remove','Dispose'];let chosen=[];const S=[...correct].sort(()=>Math.random()-.5),$=x=>document.getElementById(x);$('steps').innerHTML=S.map(x=>'<button class="card" data-x="'+x+'">'+x+'</button>').join('');document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{chosen.push(b.dataset.x);b.disabled=true;$('answer').textContent=chosen.join(' → ')});$('check').onclick=()=>{const ok=JSON.stringify(chosen)===JSON.stringify(correct);$('fb').innerHTML='<b>'+(ok?'Richtig! 60 XP':'Noch nicht richtig.')+'</b><br>Lebenszyklus: '+correct.join(' → ');$('answer').classList.add(ok?'ok':'bad')};</script></body></html>
