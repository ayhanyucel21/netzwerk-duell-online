<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🔤 ITSM Begriff-Retter</title><style>:root{--bg:#050c18;--panel:#0b2038;--text:#f5fbff;--muted:#a9becf;--line:#ffffff1c;--cyan:#48d9ff;--violet:#a282ff;--green:#45dc96;--red:#ff6e82;--yellow:#ffd166;--orange:#ff9858}*{box-sizing:border-box}html{font-size:14px}body{margin:0;min-height:100vh;color:var(--text);font-family:"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 8% 7%,#ff985822,transparent 25%),radial-gradient(circle at 92% 8%,#a282ff30,transparent 28%),var(--bg)}button{font:inherit}.wrap{width:min(960px,calc(100% - 18px));margin:auto;padding:12px}.top a{color:#fff;text-decoration:none}.hero,.game{margin-top:10px;padding:18px;border:1px solid var(--line);border-radius:18px;background:#0b2038e8}.hero h1{margin:6px 0;font-size:clamp(1.8rem,4vw,3rem)}.hero p{margin:0;color:var(--muted)}.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 0}.pill{padding:6px 9px;border-radius:99px;background:#ffffff0d}.progress{height:9px;background:#ffffff10;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan),var(--green))}.opts,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.btn,.opt,.slot,.card{padding:12px;border:1px solid var(--line);border-radius:12px;color:#fff;background:#123451;cursor:pointer;text-align:left}.selected{border-color:var(--yellow)!important;background:#403758!important}.ok{border-color:var(--green)!important;background:#154a38!important}.bad{border-color:var(--red)!important;background:#57243a!important}.feedback{margin-top:10px;padding:11px;border-radius:10px;background:#071426;color:#dbeaf5}.goal{padding:10px;border-left:4px solid var(--yellow);background:#352f28;border-radius:9px}.mountain{height:310px;position:relative;margin:12px 0;border-radius:16px;overflow:hidden;background:linear-gradient(#102744,#193958)}.peak{position:absolute;left:50%;top:18px;transform:translateX(-50%);font-size:3rem}.climber{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:3rem;transition:.5s}.steps{position:absolute;inset:50px 20px 20px}.step{position:absolute;width:42%;height:20px;border-radius:99px;background:#ffffff16}.hidden{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;aspect-ratio:16/8;position:relative;background:linear-gradient(135deg,#145b75,#7a4a91);border-radius:14px;overflow:hidden}.secret{position:absolute;inset:0;display:grid;place-items:center;font-size:4rem}.tile{z-index:2;background:#153657;border:1px solid #ffffff10;transition:.4s}.tile.open{opacity:0}.word{font:900 2rem/1.3 Consolas,monospace;letter-spacing:.2em;text-align:center;margin:16px 0}.kbd{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.kbd button{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:#123451;color:#fff;cursor:pointer}.kbd button:disabled{opacity:.25}.lives{color:#ff7f8e;font-size:1.3rem}@media(max-width:620px){.opts,.grid{grid-template-columns:1fr}}/* LF06-GAMES-V3 */
body{background:radial-gradient(circle at 10% 5%,#5ce1e622,transparent 24%),radial-gradient(circle at 90% 8%,#a282ff35,transparent 26%),linear-gradient(155deg,#050a15,#07172a 55%,#070d1b)!important;background-attachment:fixed}.hero,.game{backdrop-filter:blur(10px);box-shadow:0 18px 45px #0006,inset 0 1px #ffffff10}.hero{position:relative;overflow:hidden}.hero:after{content:'';position:absolute;width:140px;height:140px;border-radius:50%;right:-45px;top:-55px;background:#4bdbff18;animation:floatGlow 4s ease-in-out infinite alternate}.btn,.opt,.card,.zone{transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.btn:hover,.opt:hover:not(:disabled),.card:hover:not(:disabled),.zone:hover{transform:translateY(-2px);border-color:#4bdbff88;box-shadow:0 9px 22px #0004}.ok{animation:correctPop .45s ease}.bad{animation:wrongShake .35s ease}.goal{box-shadow:inset 0 0 25px #ffd1660d}.celebrate{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#020712dc;animation:fadeIn .25s ease}.celebrate-card{width:min(560px,calc(100% - 24px));padding:30px;border:1px solid #ffd16666;border-radius:25px;text-align:center;background:radial-gradient(circle at 50% 0,#ffd16633,transparent 35%),linear-gradient(145deg,#132c4d,#251b46);box-shadow:0 25px 80px #0009;animation:finalPop .6s cubic-bezier(.17,.84,.44,1)}.celebrate-card .trophy{font-size:5rem;animation:trophyBounce 1s ease infinite alternate}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-20px;width:9px;height:17px;background:var(--c);animation:fall 2.2s linear forwards}@keyframes correctPop{50%{transform:scale(1.035);box-shadow:0 0 28px #45dc9655}}@keyframes wrongShake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}@keyframes floatGlow{to{transform:translate(-22px,18px) scale(1.15)}}@keyframes finalPop{0%{transform:scale(.72);opacity:0}100%{transform:scale(1);opacity:1}}@keyframes trophyBounce{to{transform:translateY(-10px) rotate(4deg)}}@keyframes fadeIn{from{opacity:0}}@keyframes fall{to{transform:translateY(110vh) rotate(680deg)}}
</style></head><body><main class="wrap"><nav class="top"><a href="/lf06/games/">← Lernspiele</a></nav><header class="hero"><h1>🔤 ITSM Begriff-Retter</h1><p>Errate zentrale LF06-Begriffe anhand fachlicher Hinweise.</p></header><section class="game"><div class="goal"><b>Ziel:</b> Rette fünf Begriffe, bevor pro Begriff sechs Fehlversuche erreicht sind.</div><div class="hud"><b id="score">0 Begriffe gerettet</b><span id="lives" class="lives"></span></div><p id="hint"></p><div id="word" class="word"></div><div id="kbd" class="kbd"></div><div id="fb" class="feedback"></div></section></main><script>
function lf06Shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function lf06ShuffleOptions(options,correctIndex){const data=lf06Shuffle(options.map((text,i)=>({text,correct:i===correctIndex})));return{options:data.map(x=>x.text),correct:data.findIndex(x=>x.correct)}}
function lf06Final(title,text,emoji='🏆'){const wrap=document.createElement('div');wrap.className='celebrate';wrap.innerHTML='<div class="confetti"></div><div class="celebrate-card"><div class="trophy">'+emoji+'</div><h1>'+title+'</h1><p>'+text+'</p><button class="btn" onclick="location.reload()">Nochmal spielen</button><br><br><a style="color:#7fe7ff" href="/lf06/games/">← Zu den Lernspielen</a></div>';document.body.appendChild(wrap);const box=wrap.querySelector('.confetti'),colors=['#48d9ff','#a282ff','#45dc96','#ffd166','#ff6e82','#ff9858'];for(let i=0;i<45;i++){const x=document.createElement('i');x.style.left=Math.random()*100+'%';x.style.setProperty('--c',colors[i%colors.length]);x.style.animationDelay=Math.random()*.8+'s';box.appendChild(x)}}
let Q=[['INCIDENT','Ungeplante Unterbrechung eines Services'],['WORKAROUND','Temporäre Umgehung einer Störung'],['GOVERNANCE','Steuerungs- und Entscheidungsrahmen'],['COMPLIANCE','Einhaltung von Regeln und Vorgaben'],['ESCALATION','Weitergabe an höhere Fach- oder Führungsebene']].map(row=>{if(Array.isArray(row[1])&&typeof row[2]==='number'){const z=lf06ShuffleOptions(row[1],row[2]);row[1]=z.options;row[2]=z.correct}return row});Q=lf06Shuffle(Q);let i=0,s=0,wrong=0,used=new Set();const $=x=>document.getElementById(x),ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZ';function show(){wrong=0;used=new Set();render();$('kbd').innerHTML=[...ABC].map(c=>'<button>'+c+'</button>').join('');document.querySelectorAll('#kbd button').forEach(b=>b.onclick=()=>{used.add(b.textContent);b.disabled=true;if(!Q[i][0].includes(b.textContent))wrong++;render();if([...Q[i][0]].every(c=>used.has(c))){s++;$('fb').textContent='Begriff gerettet!';setTimeout(next,700)}else if(wrong>=6){$('fb').textContent='Gesucht war: '+Q[i][0];setTimeout(next,900)}})}function render(){$('score').textContent=s+' Begriffe gerettet';$('lives').textContent='♥'.repeat(6-wrong)+'♡'.repeat(wrong);$('hint').innerHTML='<b>Hinweis:</b> '+Q[i][1];$('word').textContent=[...Q[i][0]].map(c=>used.has(c)?c:'_').join(' ')}function next(){i++;i<Q.length?show():lf06Final('Begriff-Retter beendet',s+'/5 Fachbegriffe gerettet.','🔤')}show();</script></body></html>
