<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📈 DMAIC Bildfreilegung</title><style>:root{--bg:#050b17;--p:#0b1e35;--t:#f7fbff;--m:#aec2d2;--l:#ffffff1c;--c:#4bdbff;--g:#45dc96;--r:#ff6e82;--y:#ffd166;--v:#a281ff}*{box-sizing:border-box}html{font-size:14px}body{margin:0;min-height:100vh;color:var(--t);font-family:Segoe UI,Arial;background:radial-gradient(circle at 8% 7%,#ff8e4f26,transparent 26%),radial-gradient(circle at 92% 9%,#8d5fff32,transparent 28%),#050b17}.wrap{width:min(980px,calc(100% - 18px));margin:auto;padding:12px}.top a{color:#fff;text-decoration:none}.hero,.game{margin-top:10px;padding:18px;border:1px solid var(--l);border-radius:18px;background:#0b1e35e8}.hero h1{margin:7px 0;font-size:clamp(1.8rem,4vw,3rem)}.hud{display:flex;justify-content:space-between;gap:8px;margin:10px 0;color:var(--m)}.bar{height:9px;background:#ffffff10;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--v),var(--c),var(--g))}.cards,.zones,.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card,.zone,.opt,.btn{padding:12px;border:1px solid var(--l);border-radius:12px;color:#fff;background:#123250;cursor:pointer}.card.selected{border-color:var(--y);background:#3d3658}.zone{min-height:90px;border-style:dashed}.ok{background:#144b39!important;border-color:var(--g)!important}.bad{background:#57233a!important;border-color:var(--r)!important}.feedback{margin-top:10px;padding:11px;border-radius:10px;background:#071426}.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;aspect-ratio:16/8;position:relative;background:#10294a}.secret{position:absolute;inset:0;display:grid;place-items:center;font-size:5rem}.tile{z-index:2;background:#17375c;border:1px solid #ffffff0d}.tile.open{opacity:0}.steps{display:flex;flex-wrap:wrap;gap:8px}.answer{min-height:70px;margin-top:10px;padding:9px;border:2px dashed #ffffff25;border-radius:12px}@media(max-width:600px){.cards,.zones,.opts{grid-template-columns:1fr}}/* LF06-GAMES-V3 */
body{background:radial-gradient(circle at 10% 5%,#5ce1e622,transparent 24%),radial-gradient(circle at 90% 8%,#a282ff35,transparent 26%),linear-gradient(155deg,#050a15,#07172a 55%,#070d1b)!important;background-attachment:fixed}.hero,.game{backdrop-filter:blur(10px);box-shadow:0 18px 45px #0006,inset 0 1px #ffffff10}.hero{position:relative;overflow:hidden}.hero:after{content:'';position:absolute;width:140px;height:140px;border-radius:50%;right:-45px;top:-55px;background:#4bdbff18;animation:floatGlow 4s ease-in-out infinite alternate}.btn,.opt,.card,.zone{transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.btn:hover,.opt:hover:not(:disabled),.card:hover:not(:disabled),.zone:hover{transform:translateY(-2px);border-color:#4bdbff88;box-shadow:0 9px 22px #0004}.ok{animation:correctPop .45s ease}.bad{animation:wrongShake .35s ease}.goal{box-shadow:inset 0 0 25px #ffd1660d}.celebrate{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#020712dc;animation:fadeIn .25s ease}.celebrate-card{width:min(560px,calc(100% - 24px));padding:30px;border:1px solid #ffd16666;border-radius:25px;text-align:center;background:radial-gradient(circle at 50% 0,#ffd16633,transparent 35%),linear-gradient(145deg,#132c4d,#251b46);box-shadow:0 25px 80px #0009;animation:finalPop .6s cubic-bezier(.17,.84,.44,1)}.celebrate-card .trophy{font-size:5rem;animation:trophyBounce 1s ease infinite alternate}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-20px;width:9px;height:17px;background:var(--c);animation:fall 2.2s linear forwards}@keyframes correctPop{50%{transform:scale(1.035);box-shadow:0 0 28px #45dc9655}}@keyframes wrongShake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}@keyframes floatGlow{to{transform:translate(-22px,18px) scale(1.15)}}@keyframes finalPop{0%{transform:scale(.72);opacity:0}100%{transform:scale(1);opacity:1}}@keyframes trophyBounce{to{transform:translateY(-10px) rotate(4deg)}}@keyframes fadeIn{from{opacity:0}}@keyframes fall{to{transform:translateY(110vh) rotate(680deg)}}
</style></head><body><main class="wrap"><nav class="top"><a href="/lf06/games/">← Lernspiele</a></nav><header class="hero"><h1>📈 DMAIC Bildfreilegung</h1><p>Jede richtige Antwort deckt einen Teil des Verbesserungszyklus auf.</p></header><section class="game"><div class="hud"><b id="score">0/5 Teile</b><span>Geheimbild</span></div><div class="tiles"><div class="secret">D M A I C</div><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i><i class="tile"></i></div><h2 id="q"></h2><div id="opts" class="opts"></div><div id="fb" class="feedback"></div></section></main><script>
function lf06Shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function lf06ShuffleOptions(options,correctIndex){const data=lf06Shuffle(options.map((text,i)=>({text,correct:i===correctIndex})));return{options:data.map(x=>x.text),correct:data.findIndex(x=>x.correct)}}
function lf06Final(title,text,emoji='🏆'){const wrap=document.createElement('div');wrap.className='celebrate';wrap.innerHTML='<div class="confetti"></div><div class="celebrate-card"><div class="trophy">'+emoji+'</div><h1>'+title+'</h1><p>'+text+'</p><button class="btn" onclick="location.reload()">Nochmal spielen</button><br><br><a style="color:#7fe7ff" href="/lf06/games/">← Zu den Lernspielen</a></div>';document.body.appendChild(wrap);const box=wrap.querySelector('.confetti'),colors=['#48d9ff','#a282ff','#45dc96','#ffd166','#ff6e82','#ff9858'];for(let i=0;i<45;i++){const x=document.createElement('i');x.style.left=Math.random()*100+'%';x.style.setProperty('--c',colors[i%colors.length]);x.style.animationDelay=Math.random()*.8+'s';box.appendChild(x)}}
let Q=[['Problem und Umfang klären?','Define'],['Messwerte erheben?','Measure'],['Hauptursachen untersuchen?','Analyse'],['Lösung entwickeln und testen?','Improve'],['Verbesserung absichern?','Control']].map(row=>{if(Array.isArray(row[1])&&typeof row[2]==='number'){const z=lf06ShuffleOptions(row[1],row[2]);row[1]=z.options;row[2]=z.correct}return row});Q=lf06Shuffle(Q);let i=0,open=0;const $=x=>document.getElementById(x),tiles=[...document.querySelectorAll('.tile')];function show(){const [q,a]=Q[i],opts=[...new Set([a,...Q.map(x=>x[1]).sort(()=>Math.random()-.5).slice(0,2)])].sort(()=>Math.random()-.5);$('q').textContent=q;$('opts').innerHTML=opts.map(x=>'<button class="opt">'+x+'</button>').join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.textContent===a;b.classList.add(ok?'ok':'bad');if(ok){for(let n=0;n<4;n++)tiles[open++].classList.add('open')}$('score').textContent=(i+1)+'/5 Fragen';$('fb').textContent=(ok?'Richtig. ':'Nicht richtig. ')+'Gesuchte Phase: '+a;setTimeout(()=>{i++;i<Q.length?show():lf06Final('DMAIC entschlüsselt!','Alle fünf Phasen wurden bearbeitet und das Bild freigelegt.','📈')},850)})}show();</script></body></html>
