<section id="lobby" class="lobby-container">

    <div class="lobby-header">
        <h1>⚔️ Netzwerk-Duell Online</h1>
        <p>
            OSI • TCP/IP • DHCP • DNS • VLAN • WLAN •
            Troubleshooting • Hardware
        </p>
    </div>

    <div class="lobby-grid">

        <div class="lobby-card">
            <h2>🚀 Neues Duell starten</h2>

            <input
                id="name"
                maxlength="20"
                placeholder="Dein Spielername">

            <button id="create">
                Raum erstellen
            </button>
        </div>

        <div class="lobby-card">
            <h2>🎯 Raum beitreten</h2>

            <input
                id="joinName"
                maxlength="20"
                placeholder="Dein Spielername">

            <input
                id="roomInput"
                maxlength="5"
                placeholder="Raumcode">

            <button id="join">
                Raum beitreten
            </button>
        </div>

    </div>

    <p id="lobbyMsg"></p>

</section>
