<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Netzwerk-Duell Online</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>⚔️ Netzwerk-Duell Online</h1><span id="connection">Verbindung wird hergestellt…</span></header><section id="lobby" class="panel"><h2>Online-Raum</h2><input id="name" maxlength="20" placeholder="Dein Name"><div class="buttons"><button id="create">Raum erstellen</button><input id="roomInput" maxlength="5" placeholder="ABCDE"><button id="join">Raum beitreten</button></div><p id="lobbyMsg"></p></section><section id="game" class="hidden"><div class="roomline">Raumcode: <b id="roomCode"></b> <button id="copy">Code kopieren</button></div><div class="players"><article id="p0"><h3>Spieler 1</h3><strong>0</strong><small></small></article><div id="turn">Warten…</div><article id="p1"><h3>Spieler 2</h3><strong>0</strong><small></small></article></div><section class="panel"><div class="round"><h2 id="roundTitle"></h2><b id="roundNo"></b></div><p id="instruction"></p><div class="board"><div id="targets"></div><aside><h3>Karten</h3><div id="cards"></div></aside></div><div id="feedback"></div><button id="restart" class="hidden">Neues Spiel</button></section></section></main><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
