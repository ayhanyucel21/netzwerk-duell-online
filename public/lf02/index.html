<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LF02 – Lernfeld 2</title>
<link rel="stylesheet" href="../../admin/admin.css">
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; background: #060c18; color: white; padding: 30px; margin: 0; }
  .container { max-width: 900px; margin: 0 auto; }
  .back { display: inline-flex; align-items: center; margin-bottom: 20px; color: #49dcff; text-decoration: none; font-weight: bold; }
  .content-box { background: #0b203a; padding: 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); margin-top: 20px; }

</style>

<body>
<div class="container">
  <a class="back" href="/">← Zur Lernplattform</a>
  <h1 id="lfTitle">LF02</h1>
  <p id="lfDescription">Lerninhalte werden geladen...</p>
  <div class="content-box" id="lessonContainer">
    <p>Inhalte werden aus dem Admin-Bereich geladen...</p>
  </div>
</div>
<script src="../../js/loader.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    FisiLoader.loadLessons({ courseId: "LF02", target: "#lessonContainer" });
  });
</script>
