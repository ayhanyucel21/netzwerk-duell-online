<title>Python-Duell – Siegerpodium</title>
<style>
:root{--bg:#040916;--text:#f8fbff;--muted:#adbed0;--line:#ffffff20;--cyan:#46dcff;--violet:#a17fff;--orange:#ff9858;--green:#45dc96;--yellow:#ffd166;--silver:#dce7ef;--bronze:#d28a55}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 50% 0,#503b7c 0,transparent 32%),radial-gradient(circle at 8% 15%,#ff87552b,transparent 26%),radial-gradient(circle at 93% 12%,#4bcbff25,transparent 27%),linear-gradient(160deg,#11172f,#06101f 58%,var(--bg));overflow-x:hidden}body:before{content:"";position:fixed;inset:0;z-index:-2;opacity:.1;background-image:linear-gradient(#75d7ff55 1px,transparent 1px),linear-gradient(90deg,#75d7ff55 1px,transparent 1px);background-size:48px 48px}.shell{width:min(1040px,calc(100% - 18px));margin:auto;padding:14px 0 30px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.status,.sound{display:inline-flex;align-items:center;min-height:42px;padding:9px 14px;border:1px solid var(--line);border-radius:13px;color:white;background:#0b2744;text-decoration:none;font-weight:850}.status.online{color:#8cffc1}.sound{cursor:pointer}.hero{text-align:center;padding:15px 10px 0}.eyebrow{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:#07162c77;font-size:.78rem;font-weight:950;letter-spacing:.1em}.hero h1{margin:13px 0 5px;font-size:clamp(2.2rem,6vw,4.9rem);line-height:1}.hero p{margin:0;color:var(--muted)}.stage{position:relative;min-height:570px;margin-top:10px;overflow:hidden;border:1px solid var(--line);border-radius:28px;background:linear-gradient(to top,#07111f 0 16%,transparent 44%),radial-gradient(ellipse at 50% 15%,rgba(255,224,101,.2),transparent 45%),rgba(7,20,39,.77);box-shadow:0 24px 65px #0008}.lights{position:absolute;inset:0;pointer-events:none;background:conic-gradient(from 210deg at 50% -15%,transparent 0 9%,rgba(255,230,130,.12) 10% 17%,transparent 18% 31%,rgba(87,218,255,.1) 32% 40%,transparent 41% 58%,rgba(179,134,255,.12) 59% 67%,transparent 68%);animation:lights 6s ease-in-out infinite alternate}.podium{position:absolute;left:50%;bottom:44px;width:min(820px,94%);height:430px;transform:translateX(-50%);display:grid;grid-template-columns:1fr 1.16fr 1fr;align-items:end;gap:14px}.slot{position:relative;display:flex;flex-direction:column;align-items:center;opacity:0}.slot.walk{animation:walkIn 1.45s cubic-bezier(.2,.75,.2,1) forwards}.slot.place2{--start:-125%;animation-delay:.1s}.slot.place3{--start:125%;animation-delay:.1s}.slot.place1{--start:0%;animation-delay:.1s}.person{position:relative;width:100%;text-align:center;padding:7px}.character{--body:#47c8ef;position:relative;width:96px;height:132px;margin:auto;filter:drop-shadow(0 12px 9px #0008)}.head{position:absolute;z-index:4;top:0;left:50%;transform:translateX(-50%);font-size:4.1rem;line-height:1}.body{position:absolute;z-index:2;left:50%;top:61px;width:44px;height:44px;transform:translateX(-50%);border:3px solid #ffffffaa;border-radius:15px;background:linear-gradient(145deg,var(--body),#175a80)}.arm,.leg{position:absolute;z-index:1;width:10px;border-radius:8px;background:var(--body);transform-origin:top}.arm{top:68px;height:43px}.arm.left{left:16px;transform:rotate(22deg)}.arm.right{right:16px;transform:rotate(-22deg)}.leg{top:98px;height:38px;background:#173f5f}.leg.left{left:31px}.leg.right{right:31px}.walk .leg.left{animation:legL .25s linear infinite alternate}.walk .leg.right{animation:legR .25s linear infinite alternate}.walk .arm.left{animation:armL .25s linear infinite alternate}.walk .arm.right{animation:armR .25s linear infinite alternate}.slot.arrived .leg,.slot.arrived .arm{animation:none}.name{margin-top:4px;font-weight:1000;font-size:1.05rem}.score{color:#aeeeff;font-weight:800;font-size:.85rem}.block{width:100%;display:grid;place-items:center;border:1px solid #ffffff35;border-radius:18px 18px 5px 5px;font-weight:1000;font-size:1.35rem;box-shadow:inset 0 2px #ffffff35,0 13px 30px #0005}.place1 .block{height:190px;color:#3a2600;background:linear-gradient(#ffe882,#c98c05)}.place2 .block{height:135px;color:#283743;background:linear-gradient(#f2f8fb,#8295a3)}.place3 .block{height:96px;color:#3c2012;background:linear-gradient(#efb083,#a65a2d)}.cup{position:absolute;z-index:8;right:-20px;top:47px;font-size:2.8rem;opacity:0;transform:translateY(-150px) rotate(-180deg) scale(.3)}.place1.cup-time .cup{animation:cupDrop 1.05s cubic-bezier(.2,.8,.2,1.2) forwards}.place1.cup-time .arm.right{animation:holdCup .75s .62s forwards}.place1.celebrate .character{animation:winnerDance .55s ease-in-out 6 alternate}.medal{position:absolute;top:-28px;font-size:2rem;opacity:0}.arrived .medal{animation:medal .55s .25s forwards}.fourth{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);min-width:min(560px,90%);padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#0d2a47;text-align:center;color:#dce8f1}.confetti{position:absolute;inset:0;z-index:10;overflow:hidden;pointer-events:none}.piece{position:absolute;top:-25px;width:9px;height:17px;animation:fall 4s linear forwards}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}.action{min-height:45px;padding:10px 16px;border:1px solid var(--line);border-radius:13px;color:white;background:#153b5d;text-decoration:none;font-weight:900;cursor:pointer}.action.primary{color:#171000;background:linear-gradient(135deg,var(--yellow),var(--orange))}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.summary div{padding:12px;border:1px solid var(--line);border-radius:14px;background:#0a243f;text-align:center}.summary b{display:block;color:var(--cyan);font-size:1.25rem}.summary span{color:var(--muted);font-size:.72rem}.loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#061326dd;font-weight:900;color:var(--cyan)}.loading.hidden{display:none}@keyframes walkIn{0%{opacity:0;transform:translateX(var(--start)) translateY(38px)}12%{opacity:1}78%{transform:translateX(0) translateY(38px)}100%{opacity:1;transform:translate(0)}}@keyframes legL{to{transform:rotate(32deg)}}@keyframes legR{to{transform:rotate(-32deg)}}@keyframes armL{to{transform:rotate(-38deg)}}@keyframes armR{to{transform:rotate(38deg)}}@keyframes cupDrop{65%{opacity:1;transform:translateY(8px) rotate(12deg) scale(1.15)}100%{opacity:1;transform:translateY(0) rotate(0) scale(1)}}@keyframes holdCup{to{transform:rotate(-78deg) translateY(-5px)}}@keyframes winnerDance{to{transform:translateY(-14px) rotate(4deg)}}@keyframes medal{to{opacity:1;transform:translateY(8px)}}@keyframes fall{to{transform:translateY(110vh) rotate(760deg)}}@keyframes lights{to{opacity:.55;transform:scaleX(1.1)}}@media(max-width:700px){.stage{min-height:500px}.podium{height:365px;gap:5px}.character{transform:scale(.8);transform-origin:bottom center}.place1 .block{height:145px}.place2 .block{height:105px}.place3 .block{height:78px}.name{font-size:.8rem}.score{font-size:.7rem}.cup{right:-4px}.summary{grid-template-columns:1fr}.top{align-items:stretch;flex-direction:column}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head>
<body><main class="shell"><nav class="top"><span id="status" class="status">● Ergebnis wird geladen</span><button id="sound" class="sound">🔊 Ton an</button></nav><header class="hero"><span class="eyebrow">🏆 PYTHON-DUELL · FINALE</span><h1>Siegerpodium</h1><p>Das Duell ist beendet. Hier ist die finale Rangliste.</p></header><section class="stage"><div class="lights"></div><div id="loading" class="loading">Finale Rangliste wird geladen …</div><div id="confetti" class="confetti"></div><div id="podium" class="podium"></div><div id="fourth" class="fourth hidden"></div></section><section id="summary" class="summary"></section><div class="actions"><a class="action" href="../games/">🎮 Lernspiele</a><a class="action" href="../">← LF05</a><button id="again" class="action primary">⚔️ Neues Duell</button></div></main><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id),AV={'python-bot':'🤖','code-fox':'🦊','linux-penguin':'🐧','logic-lion':'🦁','debug-owl':'🦉','bug-hunter':'🐼'},COL={'python-bot':'#42caed','code-fox':'#ff8a43','linux-penguin':'#6684a3','logic-lion':'#f2a83f','debug-owl':'#a17fff','bug-hunter':'#d7e1e8'};let session=null,room=null,soundOn=true,audio=null,started=false;try{session=JSON.parse(sessionStorage.getItem('pythonDuelSession')||'null')}catch{}if(!session?.roomCode||!session?.playerId)location.replace('./');const socket=io({transports:['websocket','polling']});socket.on('connect',()=>{setStatus('● Server verbunden',true);socket.emit('python-rejoin-room',session,r=>{if(!r?.ok){setStatus(r?.message||'Raum nicht gefunden');setTimeout(()=>location.replace('./'),1400)}})});socket.on('disconnect',()=>setStatus('● Server getrennt'));socket.on('room-updated',r=>{room=r;if(!started&&r?.players?.length){started=true;startCeremony()}});socket.on('scoreboard-update',players=>{if(room){room.players=players}});function character(p){return `<div class="character" style="--body:${COL[p.avatar]||'#42caed'}"><i class="arm left"></i><i class="arm right"></i><i class="leg left"></i><i class="leg right"></i><i class="body"></i><span class="head">${AV[p.avatar]||'🤖'}</span></div>`}function slot(p,place){if(!p)return '<div></div>';return `<div class="slot place${place}" data-place="${place}"><div class="person"><span class="medal">${['','🥇','🥈','🥉'][place]}</span>${character(p)}${place===1?'<span class="cup">🏆</span>':''}<div class="name">${esc(p.name)}</div><div class="score">${p.score||0} Punkte · ${p.right||0} richtig</div></div><div class="block">${place}. Platz</div></div>`}function startCeremony(){const rank=[...room.players].sort((a,b)=>b.score-a.score||b.right-a.right||a.wrong-b.wrong);$('loading').classList.add('hidden');$('podium').innerHTML=slot(rank[1],2)+slot(rank[0],1)+slot(rank[2],3);if(rank[3]){$('fourth').classList.remove('hidden');$('fourth').innerHTML=`4. Platz: ${AV[rank[3].avatar]||'🤖'} <b>${esc(rank[3].name)}</b> · ${rank[3].score||0} Punkte`}$('summary').innerHTML=`<div><b>${room.code}</b><span>Raumcode</span></div><div><b>${rank.length}</b><span>Spieler</span></div><div><b>${rank.reduce((s,p)=>s+(p.right||0),0)}</b><span>Richtige Antworten gesamt</span></div>`;const order=[document.querySelector('.place3'),document.querySelector('.place2'),document.querySelector('.place1')].filter(Boolean);if(soundOn)victoryMusic();order.forEach((el,i)=>setTimeout(()=>{el.classList.add('walk');footsteps(7,145);setTimeout(()=>el.classList.add('arrived'),1400)},300+i*1700));setTimeout(()=>{const w=document.querySelector('.place1');w?.classList.add('cup-time');cupChime();confetti();setTimeout(()=>w?.classList.add('celebrate'),1400)},500+order.length*1700)}function setStatus(t,ok=false){$('status').textContent=t;$('status').classList.toggle('online',ok)}$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Ton an':'🔇 Ton aus';if(soundOn)unlock()};$('again').onclick=()=>{socket.emit('python-leave-room',{roomCode:session.roomCode},()=>{});sessionStorage.removeItem('pythonDuelSession');location.replace('./')};function unlock(){try{const A=window.AudioContext||window.webkitAudioContext;audio=audio||new A();if(audio.state==='suspended')audio.resume()}catch{}}function tone(f,t,d,v=.07,type='triangle'){if(!soundOn)return;unlock();if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+.03)}function footsteps(n,gap){if(!soundOn)return;unlock();if(!audio)return;for(let i=0;i<n;i++){const t=audio.currentTime+i*gap/1000;tone(i%2?105:125,t,.1,.055,'sine')}}function victoryMusic(){unlock();if(!audio)return;const m=[523,659,784,659,698,784,880,784,659,523,587,698,784,880,1047,880,784,698,659,784,988,1047,1175,1047,988,784,880,1047,1319],t=audio.currentTime+.1;m.forEach((f,i)=>tone(f,t+i*.18,i%7===6?.34:.21,i>20?.1:.065,i%4===0?'square':'triangle'));[131,165,196,175,147,196,220,262].forEach((f,i)=>tone(f,t+i*.72,.55,.035,'sine'))}function cupChime(){if(!soundOn)return;unlock();if(!audio)return;const t=audio.currentTime;[1047,1319,1568,2093].forEach((f,i)=>tone(f,t+i*.12,.65,.095,'sine'))}function confetti(){const cs=['#ffd166','#46dcff','#ff6e82','#45dc96','#a17fff','#ff9858'];$('confetti').innerHTML=Array.from({length:110},(_,i)=>`<i class="piece" style="left:${Math.random()*100}%;background:${cs[i%cs.length]};animation-delay:${Math.random()*1.2}s;animation-duration:${3+Math.random()*2}s"></i>`).join('');setTimeout(()=>$('confetti').innerHTML='',6200)}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
