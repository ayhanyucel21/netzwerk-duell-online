<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08152b">
<title>Python-Duell – Live Arena</title>
<style>
:root{--bg:#050b17;--panel:#0b203a;--text:#f7fbff;--muted:#aec1d3;--line:#ffffff1c;--cyan:#49dcff;--violet:#a17fff;--orange:#ff9858;--green:#45dc96;--red:#ff6e82;--yellow:#ffd166}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 7% 8%,#ff88552a,transparent 27%),radial-gradient(circle at 93% 10%,#8c63ff30,transparent 28%),linear-gradient(145deg,#19102e,#07182d 56%,var(--bg))}body:before{content:"";position:fixed;inset:0;z-index:-1;opacity:.1;background-image:linear-gradient(#71ceff55 1px,transparent 1px),linear-gradient(90deg,#71ceff55 1px,transparent 1px);background-size:46px 46px}button{font:inherit}.hidden{display:none!important}.shell{width:min(1220px,calc(100% - 18px));margin:auto;padding:10px 0 26px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:15px;background:#0a2440dc}.brand{font-weight:1000}.room{color:var(--cyan);font:900 1rem Consolas}.connection{color:#ff9aaa}.connection.online{color:#8cffc1}.progress{height:10px;margin:12px 0;overflow:hidden;border-radius:999px;background:#ffffff12}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan),var(--green));transition:.3s}.layout{display:grid;grid-template-columns:1fr 300px;gap:14px}.arena,.ranking{border:1px solid var(--line);border-radius:22px;background:#0a1e37eb;box-shadow:0 16px 40px #0004}.arena{padding:21px}.round-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.mode{display:inline-block;padding:7px 11px;border-radius:999px;color:#07121d;background:var(--yellow);font-size:.74rem;font-weight:1000}.timer{width:57px;height:57px;display:grid;place-items:center;border:5px solid var(--cyan);border-radius:50%;font-weight:1000;font-size:1.15rem}.scenario{margin:16px 0;padding:15px;border-left:5px solid var(--orange);border-radius:13px;background:#142a48;color:#dce8f2;line-height:1.55}.question{margin:17px 0 14px;font-size:1.35rem;line-height:1.48}pre{overflow:auto;margin:0 0 15px;padding:16px;border-radius:14px;background:#051225;color:#d8f6ff;font:1rem/1.55 Consolas,monospace;white-space:pre-wrap}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{min-height:58px;padding:13px;border:1px solid #ffffff1d;border-radius:13px;color:white;background:#123454;text-align:left;cursor:pointer;font-weight:750}.option:hover:not(:disabled){border-color:var(--cyan);transform:translateY(-2px)}.option.correct{border-color:var(--green);background:#134a38}.option.wrong{border-color:var(--red);background:#54223a}.feedback{min-height:58px;margin-top:14px;padding:13px;border:1px solid var(--line);border-radius:13px;background:#091a30;color:#dce8f0;line-height:1.5}.feedback.good{border-color:#45dc9660;background:#123c31}.feedback.bad{border-color:#ff6e8260;background:#432037}.waiting{padding:12px;text-align:center;color:var(--yellow);font-weight:850}.action{display:block;margin:10px auto 0;padding:11px 18px;border:0;border-radius:12px;color:#07131f;background:linear-gradient(135deg,var(--yellow),var(--orange));font-weight:950;cursor:pointer}.action:disabled{opacity:.65;cursor:default}.ranking{padding:17px}.ranking h2{margin:0 0 13px}.player{display:grid;grid-template-columns:43px 1fr auto;gap:10px;align-items:center;margin:8px 0;padding:10px;border:1px solid #ffffff12;border-radius:13px;background:#102c4a}.player.me{border-color:var(--cyan)}.avatar{width:43px;height:43px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,#8056cf,#266496);font-size:1.55rem}.player b{display:block}.player small{color:var(--muted)}.score{color:var(--yellow);font-weight:1000}.legend{margin-top:14px;padding-top:13px;border-top:1px solid #ffffff10;color:var(--muted);font-size:.78rem;line-height:1.55}.finish{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:18px;background:#020916ec;backdrop-filter:blur(8px)}.finish-card{width:min(640px,96vw);padding:28px;border:1px solid #ffffff25;border-radius:25px;background:radial-gradient(circle at top,#4b3778,#08172b 67%);text-align:center}.finish-card h2{font-size:2rem}.trophy{font-size:4rem;animation:bounce 1s infinite alternate}.final-list{text-align:left;margin:20px 0}.final-row{display:flex;justify-content:space-between;padding:11px;border-radius:11px;background:#ffffff0c;margin:7px 0}.action{padding:12px 18px;border:0;border-radius:12px;color:#08131e;background:var(--yellow);font-weight:950;cursor:pointer}@keyframes bounce{to{transform:translateY(-12px) rotate(5deg)}}@media(max-width:850px){.layout{grid-template-columns:1fr}.ranking{order:-1}.options{grid-template-columns:1fr}}@media(max-width:520px){.top{align-items:flex-start;flex-direction:column}.arena{padding:16px}.question{font-size:1.15rem}}
</style></head>
<body><main class="shell"><header class="top"><span class="brand">⚔️ Python-Duell</span><span class="room" id="roomCode">------</span><span id="connection" class="connection">● Verbinden</span></header><div class="progress"><i id="progress"></i></div><section class="layout"><article class="arena"><div class="round-head"><div><span id="mode" class="mode">QUIZ</span><h2 id="roundTitle">Runde 1/15</h2></div><div id="timer" class="timer">0/0</div></div><div id="scenario" class="scenario"></div><h1 id="question" class="question"></h1><pre id="code" class="hidden"></pre><div id="options" class="options"></div><div id="feedback" class="feedback">Wähle eine Antwort.</div><div id="waiting" class="waiting hidden">Warte auf die Mitspieler …</div><button id="nextQuestion" class="action hidden">Nächste Frage →</button></article><aside class="ranking"><h2>🏆 Live-Rangliste</h2><div id="players"></div><div class="legend">Richtig: +100 Punkte<br>Reihenfolgebonus: 1. +50 · 2. +35 · 3. +20 · 4. +10<br>Falsch: 0 Punkte</div></aside></section></main><section id="finish" class="finish hidden"><div class="finish-card"><div class="trophy">🏆</div><h2>Duell beendet</h2><p>Finale Rangliste</p><div id="finalList" class="final-list"></div><button id="backLobby" class="action">Zurück zum Duell-Menü</button></div></section><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id);
const AV={'python-bot':'🤖','code-fox':'🦊','linux-penguin':'🐧','logic-lion':'🦁','debug-owl':'🦉','bug-hunter':'🐼'};
let session=null;try{session=JSON.parse(sessionStorage.getItem('pythonDuelSession')||'null')}catch{}
if(!session?.roomCode||!session?.playerId)location.replace('./');
let socket=io({transports:['websocket','polling']}),room=null,current=null,answered=false,resultShown=false,localFinished=false;
$('roomCode').textContent=session.roomCode;

socket.on('connect',()=>{
  $('connection').className='connection online';$('connection').textContent='● Verbunden';
  socket.emit('python-rejoin-room',session,r=>{
    if(!r?.ok){alert(r?.message||'Raum nicht gefunden');location.replace('./');return;}
    socket.emit('python-get-game-state',{roomCode:session.roomCode},state=>{
      if(state?.room){room=state.room;renderRanking()}
      if(state?.question)renderRound(state.question);
      if(state?.status==='finished')location.replace('./podium.html');
    });
  });
});
socket.on('disconnect',()=>{$('connection').className='connection';$('connection').textContent='● Getrennt'});
socket.on('room-updated',r=>{room=r;renderRanking()});
socket.on('scoreboard-update',players=>{if(room){room.players=players;renderRanking()}});
socket.on('python-round',renderRound);
socket.on('python-answer-progress',data=>{if(current&&data.round===current.round){$('timer').textContent=`${data.answered}/${data.expected}`;$('waiting').textContent=`Antworten: ${data.answered}/${data.expected} · Warte auf die Mitspieler …`}});
socket.on('python-next-progress',data=>{if(current&&data.round===current.round)$('waiting').textContent=`Bereit für die nächste Frage: ${data.ready}/${data.expected}`});
socket.on('python-round-result',showRoundResult);
socket.on('python-game-finished',data=>{
  if(localFinished)return;localFinished=true;
  sessionStorage.setItem('pythonDuelResults',JSON.stringify({roomCode:data.roomCode,finishedAt:Date.now(),ranking:data.ranking||[]}));
  $('progress').style.width='100%';$('feedback').className='feedback good';$('feedback').innerHTML='<b>Duell beendet!</b> Das Siegerpodium wird vorbereitet …';
  setTimeout(()=>location.replace('./podium.html'),1200);
});
socket.on('room-closed',()=>location.replace('./'));

function renderRound(q){
  if(localFinished)return;current=q;answered=(q.answeredPlayerIds||[]).includes(session.playerId);resultShown=Boolean(q.resultShown);
  $('progress').style.width=`${q.round/q.totalRounds*100}%`;$('mode').textContent=q.mode.toUpperCase();$('roundTitle').textContent=`Runde ${q.round+1}/${q.totalRounds}`;
  $('scenario').textContent=q.scenario;$('question').textContent=q.question;$('code').classList.toggle('hidden',!q.code);$('code').textContent=q.code;
  $('feedback').className='feedback';$('feedback').textContent=answered?'Antwort bereits abgegeben.':'Wähle eine Antwort.';$('waiting').classList.toggle('hidden',!answered);$('nextQuestion').classList.add('hidden');$('nextQuestion').disabled=false;$('nextQuestion').textContent='Nächste Frage →';
  $('options').innerHTML=q.options.map((o,i)=>`<button class="option" data-value="${esc(o)}">${String.fromCharCode(65+i)}) ${esc(o)}</button>`).join('');
  document.querySelectorAll('.option').forEach(b=>{b.disabled=answered;b.onclick=()=>submit(b.dataset.value)});$('timer').textContent=`${q.answered||0}/${q.expected||0}`;
}
function submit(value){
  if(answered||!current)return;answered=true;document.querySelectorAll('.option').forEach(b=>b.disabled=true);
  socket.emit('python-submit-answer',{roomCode:session.roomCode,round:current.round,value},result=>{
    if(!result?.ok){$('feedback').className='feedback bad';$('feedback').textContent=result?.message||'Antwort konnte nicht gesendet werden.';return;}
    $('feedback').className='feedback '+(result.correct?'good':'bad');
    $('feedback').innerHTML=result.correct
      ? `<b>Richtig beantwortet.</b> 100 Grundpunkte + ${result.speedBonus} Reihenfolgebonus = ${result.points} Punkte. Du warst die ${result.correctRank}. Person mit einer richtigen Antwort. Die ausführliche Begründung erscheint nach der Rundenauswertung.`
      : '<b>Antwort abgegeben, aber nicht korrekt.</b> Nach der Rundenauswertung werden die richtige Lösung, die fachliche Ursache und der typische Denkfehler ausführlich erklärt.';
    $('waiting').classList.remove('hidden');$('waiting').textContent='Warte auf die Mitspieler …';
  });
}
function showRoundResult(result){
  if(!current||result.round!==current.round)return;
  document.querySelectorAll('.option').forEach(b=>{b.disabled=true;b.classList.toggle('correct',b.dataset.value===result.correctAnswer)});
  resultShown=true;
  $('feedback').className='feedback good';$('feedback').innerHTML=`<b>Richtige Lösung:</b> ${esc(result.correctAnswer)}<br><br><b>Ausführliche fachliche Begründung:</b> ${esc(result.explanation)}`;
  $('waiting').classList.remove('hidden');$('waiting').textContent='Lies die Erklärung. Danach kannst du zur nächsten Frage wechseln.';
  $('nextQuestion').classList.remove('hidden');
  if(room&&result.players){room.players=result.players;renderRanking()}
}
$('nextQuestion').onclick=()=>{
  if(!current||!resultShown)return;
  $('nextQuestion').disabled=true;
  socket.emit('python-next-question',{roomCode:session.roomCode,round:current.round},response=>{
    if(!response?.ok){$('nextQuestion').disabled=false;$('waiting').textContent=response?.message||'Wechsel nicht möglich.';return;}
    $('nextQuestion').textContent='Bereit ✓';
    $('waiting').textContent=`Bereit für die nächste Frage: ${response.ready}/${response.expected}`;
  });
};
function renderRanking(){if(!room)return;const sorted=[...(room.players||[])].sort((a,b)=>(b.score||0)-(a.score||0)||(b.right||0)-(a.right||0));$('players').innerHTML=sorted.map((p,i)=>`<div class="player ${p.playerId===session.playerId?'me':''}"><span class="avatar">${AV[p.avatar]||'🤖'}</span><div><b>${i+1}. ${esc(p.name)}</b><small>${p.right||0} richtig · ${p.wrong||0} Fehler</small></div><span class="score">${p.score||0}</span></div>`).join('')}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
