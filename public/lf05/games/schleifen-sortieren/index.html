<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081424">
<title>Schleifen Sortieren – LF05</title>
<style>
:root{--bg:#06101d;--panel:#0e233d;--text:#f7fbff;--muted:#afc2d4;--line:#ffffff1c;--cyan:#48d8ff;--purple:#9d7fff;--green:#46dc97;--orange:#ff9858;--red:#ff6e82;--yellow:#ffd166}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 8% 8%,#ff89542a,transparent 27%),radial-gradient(circle at 92% 10%,#9066ff32,transparent 29%),linear-gradient(145deg,#19102d,#07182c 56%,var(--bg))}body:before{content:"";position:fixed;inset:0;z-index:-1;opacity:.1;background-image:linear-gradient(#72d1ff55 1px,transparent 1px),linear-gradient(90deg,#72d1ff55 1px,transparent 1px);background-size:46px 46px}button{font:inherit}.hidden{display:none!important}.shell{width:min(1160px,calc(100% - 22px));margin:auto;padding:14px 0 34px}.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}.top a,.sound{min-height:43px;padding:9px 14px;border:1px solid var(--line);border-radius:13px;color:white;background:#0b2947;text-decoration:none;font-weight:850}.hero{padding:29px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(135deg,#7143b8d9,#225d91dc);box-shadow:0 22px 56px #0006}.eyebrow{display:inline-block;padding:7px 12px;border-radius:999px;background:#07162c77;font-size:.78rem;font-weight:950;letter-spacing:.09em}h1{margin:13px 0 7px;font-size:clamp(2.1rem,5vw,4rem)}.hero p{max-width:800px;margin:0;color:#e0e9f3;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.stat{padding:12px;border:1px solid var(--line);border-radius:15px;background:#0c2744;text-align:center}.stat b{display:block;color:var(--cyan);font-size:1.25rem}.stat span{color:var(--muted);font-size:.75rem}.progress{height:10px;margin-bottom:16px;overflow:hidden;border-radius:999px;background:#ffffff12}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan),var(--green));transition:.3s}.game{padding:20px;border:1px solid var(--line);border-radius:22px;background:#0a1e37ed}.scenario{padding:15px;border-left:5px solid var(--orange);border-radius:13px;background:#142c4b;line-height:1.55}.scenario small{display:block;color:var(--orange);font-weight:950;letter-spacing:.08em}.scenario h2{margin:7px 0 0;font-size:1.15rem}.instruction{margin:15px 0 10px;color:var(--muted)}.pool,.placed{min-height:92px;display:flex;align-items:center;justify-content:center;align-content:center;gap:9px;flex-wrap:wrap;padding:13px;border-radius:16px;background:#0e2b4b}.card{padding:12px 14px;border:1px solid #ffffff25;border-radius:11px;color:white;background:#23547e;font:800 .92rem/1.35 Consolas,monospace;cursor:grab;user-select:none;touch-action:none}.card.selected{border-color:var(--yellow);box-shadow:0 0 0 3px #ffd16625}.card.dragging{opacity:.35}.card.used{display:none}.zones{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:13px}.zone{min-height:155px;padding:12px;border:2px dashed #ffffff24;border-radius:16px;background:#0a213b;transition:.18s}.zone.hover{border-color:var(--cyan);transform:translateY(-3px);background:#12395d}.zone.correct{border-color:var(--green);background:#123e31}.zone.wrong{border-color:var(--red);background:#492238}.zone h3{margin:0 0 8px;text-align:center;font-size:.86rem}.zone .placed{min-height:98px;padding:7px;background:transparent}.zone .card{width:100%;cursor:pointer;text-align:center;background:#683f92}.feedback{min-height:60px;margin-top:14px;padding:13px;border:1px solid var(--line);border-radius:13px;background:#081a30;line-height:1.55}.feedback.good{border-color:#46dc9760;background:#123e31}.feedback.bad{border-color:#ff6e8260;background:#462038}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:13px}.btn{min-height:43px;padding:9px 14px;border:1px solid var(--line);border-radius:12px;color:white;background:#173d60;cursor:pointer;font-weight:900}.btn.primary{color:#101000;background:var(--yellow)}.result{padding:30px;text-align:center}.score-big{font-size:3.2rem;color:var(--yellow);font-weight:1000}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.result-grid div{padding:13px;border-radius:13px;background:#ffffff0d}.result-grid b{display:block;color:var(--cyan);font-size:1.3rem}@media(max-width:900px){.zones{grid-template-columns:1fr 1fr}}@media(max-width:600px){.top{flex-direction:column}.stats{grid-template-columns:1fr 1fr}.zones{grid-template-columns:1fr}.game{padding:14px}.result-grid{grid-template-columns:1fr}}
</style></head>
<body><main class="shell"><nav class="top"><a href="../">← Lernspiele</a><button id="sound" class="sound">🔊 Ton an</button></nav><header class="hero"><span class="eyebrow">🔁 LF05 · DRAG & DROP</span><h1>Schleifen Sortieren</h1><p>Ziehe die Python-Bausteine in die fachlich richtige Kategorie. Auf Touch-Geräten: Karte antippen und danach das Zielfeld antippen.</p></header><section class="stats"><div class="stat"><b id="round">1/20</b><span>Aufgabe</span></div><div class="stat"><b id="xp">0</b><span>XP</span></div><div class="stat"><b id="correct">0</b><span>Richtig</span></div><div class="stat"><b id="lives">❤️❤️❤️</b><span>Leben</span></div></section><div class="progress"><i id="progress"></i></div><section id="game" class="game"></section></main><script>
const CATS={loop:['🔁 Schleife','for / while / range'],condition:['🚦 Bedingung','if / elif / else'],control:['🛠️ Steuerung','break / continue / Zähler'],io:['⌨️ Ein-/Ausgabe','input / print']};
const TASKS=[
{s:'Ein Konsolenmenü soll wiederholt angezeigt werden, bis „Beenden“ gewählt wird.',e:'Eine while-Schleife steuert die Wiederholung. if prüft die Auswahl. break beendet die Schleife. input() liest die Auswahl.',c:[['while auswahl != "0":','loop'],['if auswahl == "1":','condition'],['break','control'],['auswahl = input("Auswahl: ")','io']]},
{s:'Drei Anmeldeversuche sollen geprüft werden.',e:'range(3) begrenzt die Versuche. if prüft die Zugangsdaten. break beendet bei Erfolg. input() liest das Passwort.',c:[['for versuch in range(3):','loop'],['if passwort == "geheim":','condition'],['break','control'],['passwort = input("Passwort: ")','io']]},
{s:'FizzBuzz soll Zahlen von 1 bis zu einer Obergrenze verarbeiten.',e:'for und range bilden die Zählschleife. if prüft Teilbarkeit. continue kann den Rest eines Durchlaufs überspringen. print() gibt aus.',c:[['for zahl in range(1, grenze + 1):','loop'],['if zahl % 15 == 0:','condition'],['continue','control'],['print("FizzBuzz")','io']]},
{s:'Zeitslots von 08:00 bis 18:00 Uhr werden in Zweistundenschritten erzeugt.',e:'range(8, 18, 2) erzeugt die Startzeiten. if kann Grenzen prüfen. Der Zähler wird durch range geändert. print() zeigt Slots.',c:[['for start in range(8, 18, 2):','loop'],['if start + 2 <= 18:','condition'],['start += 2','control'],['print(start, start + 2)','io']]},
{s:'Eine Zahl soll heruntergezählt werden, bis 0 erreicht ist.',e:'while wiederholt abhängig vom Zähler. if prüft einen Sonderfall. -= verändert den Zähler. print() gibt den Stand aus.',c:[['while zahl >= 0:','loop'],['if zahl == 0:','condition'],['zahl -= 1','control'],['print(zahl)','io']]},
{s:'Bei Zahlen soll die Schleife an der ersten durch 10 teilbaren Zahl enden.',e:'for durchläuft Zahlen. if erkennt die Teilbarkeit. break beendet sofort. print() zeigt geprüfte Werte.',c:[['for zahl in zahlen:','loop'],['if zahl % 10 == 0:','condition'],['break','control'],['print(zahl)','io']]},
{s:'Ungültige Menüeingaben sollen übersprungen werden.',e:'while hält das Menü aktiv. if validiert. continue beginnt den nächsten Durchlauf. input() erfasst die Wahl.',c:[['while True:','loop'],['if auswahl not in ("1", "0"):','condition'],['continue','control'],['auswahl = input("Menü: ")','io']]},
{s:'Alle Zeichen eines Benutzernamens sollen geprüft werden.',e:'for durchläuft den String. if prüft ein Zeichen. continue überspringt erlaubte Sonderfälle. print() meldet Ergebnisse.',c:[['for zeichen in benutzername:','loop'],['if not zeichen.isalnum():','condition'],['continue','control'],['print("Zeichen geprüft")','io']]},
{s:'Ein Zahlenratespiel läuft, bis die richtige Zahl geraten wurde.',e:'while steuert die unbekannte Versuchszahl. if vergleicht. break endet bei Treffer. input() liest den Tipp.',c:[['while True:','loop'],['if tipp == geheimzahl:','condition'],['break','control'],['tipp = int(input("Tipp: "))','io']]},
{s:'Eine Liste von Servern wird nacheinander geprüft.',e:'for durchläuft die Serverliste. if untersucht den Status. continue überspringt offline Systeme. print() protokolliert.',c:[['for server in serverliste:','loop'],['if status == "offline":','condition'],['continue','control'],['print(server, status)','io']]},
{s:'Ein Hundejahr-Rechner verarbeitet verschiedene Altersbereiche.',e:'Eine for-Schleife kann mehrere Eingaben testen. if/elif bilden Grenzfälle ab. Der Zähler steuert Wiederholungen. input liest Werte.',c:[['for test in range(3):','loop'],['elif hundealter == 2:','condition'],['test += 1','control'],['hundealter = int(input("Alter: "))','io']]},
{s:'Eine Uhrzeit soll in Zeitabschnitte eingeordnet werden.',e:'while ermöglicht weitere Eingaben. if prüft Intervalle. break beendet das Programm. input liest die Stunde.',c:[['while True:','loop'],['if 5 <= stunde < 11:','condition'],['break','control'],['stunde = int(input("Stunde: "))','io']]},
{s:'Alle möglichen Domino-Kombinationen ohne Spiegelduplikate sollen ausgegeben werden.',e:'Zwei verschachtelte for-Schleifen erzeugen Kombinationen. if kann gültige Paare sichern. Der innere Startwert verhindert Spiegelungen. print gibt aus.',c:[['for links in range(7):','loop'],['if rechts >= links:','condition'],['rechts = links','control'],['print(links, rechts)','io']]},
{s:'Ein Frosch springt immer nur halb so weit wie zuvor.',e:'while prüft die verbleibende Strecke. if erkennt einen Abbruchfall. Die Sprungweite wird verändert. print dokumentiert.',c:[['while strecke < 2.5:','loop'],['if sprungweite < 0.001:','condition'],['sprungweite /= 2','control'],['print(spruenge, strecke)','io']]},
{s:'Eine Liste soll nur positive Werte verarbeiten.',e:'for durchläuft Werte. if erkennt ungültige Werte. continue überspringt sie. print gibt gültige Werte aus.',c:[['for wert in werte:','loop'],['if wert <= 0:','condition'],['continue','control'],['print(wert)','io']]},
{s:'Ein Kassenprogramm erfasst drei Produktmengen.',e:'for wiederholt die Eingabe dreimal. if validiert die Menge. Der Summenzähler wird erhöht. input liefert die Menge.',c:[['for produkt in range(3):','loop'],['if menge < 0:','condition'],['gesamt += menge * preis','control'],['menge = int(input("Menge: "))','io']]},
{s:'Eine Passwortprüfung endet nach drei Fehlversuchen.',e:'while nutzt einen Versuchszähler. if prüft das Passwort. versuche += 1 aktualisiert den Zustand. input() liest die Eingabe.',c:[['while versuche < 3:','loop'],['if passwort == korrekt:','condition'],['versuche += 1','control'],['passwort = input("Passwort: ")','io']]},
{s:'Eine Zahl soll auf gerade oder ungerade geprüft werden.',e:'Eine Schleife kann mehrere Zahlen testen. if nutzt Modulo. Der Zähler begrenzt die Tests. print gibt das Ergebnis aus.',c:[['for test in range(5):','loop'],['if zahl % 2 == 0:','condition'],['test += 1','control'],['print("gerade")','io']]},
{s:'Ein Programm liest Befehle, bis „exit“ eingegeben wird.',e:'while wiederholt bis zur Ausstiegsbedingung. if erkennt exit. break beendet. input() liest Befehle.',c:[['while True:','loop'],['if befehl == "exit":','condition'],['break','control'],['befehl = input("Befehl: ")','io']]},
{s:'Eine festgelegte Anzahl Spielrunden soll durchgeführt werden.',e:'for und range bilden eine bekannte Rundenzahl ab. if bewertet den Sieger. Der Punktestand wird aktualisiert. print informiert.',c:[['for runde in range(anzahl_runden):','loop'],['if spieler == computer:','condition'],['punkte += 1','control'],['print("Runde", runde + 1)','io']]}
];
let order=[],round=0,xp=0,lives=3,correct=0,selected=null,soundOn=true,locked=false;const $=id=>document.getElementById(id);function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){order=shuffle(TASKS);round=0;xp=0;lives=3;correct=0;render()}function render(){if(round>=20||lives<=0)return finish();locked=false;selected=null;const t=order[round];$('round').textContent=`${round+1}/20`;$('xp').textContent=xp;$('correct').textContent=correct;$('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);$('progress').style.width=`${round/20*100}%`;$('game').innerHTML=`<div class="scenario"><small>LZK-/IHK-TRANSFERAUFGABE</small><h2>${t.s}</h2></div><p class="instruction">Ziehe jede Karte in die passende Kategorie.</p><div id="pool" class="pool"></div><div id="zones" class="zones">${Object.entries(CATS).map(([k,v])=>`<section class="zone" data-cat="${k}"><h3>${v[0]}<br><small>${v[1]}</small></h3><div class="placed"></div></section>`).join('')}</div><div id="feedback" class="feedback">Alle vier Karten müssen zugeordnet werden.</div><div class="actions"><button id="reset" class="btn">↶ Zurücksetzen</button><button id="check" class="btn primary">Zuordnung prüfen</button></div>`;shuffle(t.c.map((x,i)=>({text:x[0],cat:x[1],id:i}))).forEach(makeCard);setupZones();$('reset').onclick=resetRound;$('check').onclick=checkRound}
function makeCard(item){const b=document.createElement('button');b.className='card';b.type='button';b.draggable=true;b.textContent=item.text;b.dataset.cat=item.cat;b.dataset.id=item.id;b.ondragstart=e=>{selected=b;b.classList.add('dragging');e.dataTransfer.setData('text/plain',item.id)};b.ondragend=()=>b.classList.remove('dragging');b.onclick=()=>{document.querySelectorAll('.card').forEach(x=>x.classList.remove('selected'));selected=b;b.classList.add('selected')};$('pool').appendChild(b)}function setupZones(){document.querySelectorAll('.zone').forEach(z=>{z.ondragover=e=>{e.preventDefault();z.classList.add('hover')};z.ondragleave=()=>z.classList.remove('hover');z.ondrop=e=>{e.preventDefault();z.classList.remove('hover');if(selected)place(selected,z)};z.onclick=e=>{if(selected&&!e.target.closest('.card'))place(selected,z)}})}function place(card,zone){zone.querySelector('.placed').appendChild(card);card.classList.remove('selected');selected=null}function resetRound(){document.querySelectorAll('.zone .card').forEach(c=>$('pool').appendChild(c));document.querySelectorAll('.zone').forEach(z=>z.classList.remove('correct','wrong'));$('feedback').className='feedback';$('feedback').textContent='Alle vier Karten müssen zugeordnet werden.'}function checkRound(){if(locked)return;const cards=[...document.querySelectorAll('.card')];if(cards.some(c=>c.parentElement.id==='pool')){$('feedback').className='feedback bad';$('feedback').textContent='Ordne zuerst alle Karten einem Zielfeld zu.';return}locked=true;let ok=true;document.querySelectorAll('.zone').forEach(z=>{const zoneOk=[...z.querySelectorAll('.card')].every(c=>c.dataset.cat===z.dataset.cat)&&z.querySelectorAll('.card').length===1;z.classList.add(zoneOk?'correct':'wrong');if(!zoneOk)ok=false});const t=order[round];if(ok){correct++;xp+=20;$('feedback').className='feedback good';$('feedback').innerHTML=`<b>Richtig zugeordnet.</b> ${t.e}`;tone(660);setTimeout(()=>{round++;render()},1800)}else{lives--;$('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);$('feedback').className='feedback bad';$('feedback').innerHTML=`<b>Noch nicht korrekt.</b> ${t.e} Prüfe besonders, ob eine Karte eine Wiederholung, Bedingung, Schleifensteuerung oder Ein-/Ausgabe beschreibt.`;tone(180);setTimeout(()=>{round++;render()},2600)}}function finish(){$('progress').style.width='100%';$('game').innerHTML=`<div class="result"><div style="font-size:4rem">🏆</div><h2>Spiel beendet</h2><div class="score-big">${xp} XP</div><div class="result-grid"><div><b>${correct}/20</b><span>richtige Aufgaben</span></div><div><b>${20-correct}</b><span>nicht gelöst</span></div><div><b>${Math.round(correct/20*100)} %</b><span>Trefferquote</span></div></div><p>${correct>=17?'Sehr sicher: Schleifen, Bedingungen und Steueranweisungen werden passend unterschieden.':correct>=12?'Gute Grundlage. Wiederhole besonders break, continue sowie for und while.':'Wiederhole die Grundlagen zu Schleifen, Bedingungen, Ein-/Ausgabe und Kontrollfluss.'}</p><button class="btn primary" onclick="start()">Nochmal spielen</button></div>`}let ac;function tone(f){if(!soundOn)return;try{const A=window.AudioContext||window.webkitAudioContext;ac=ac||new A();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.1,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.23)}catch{}}$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Ton an':'🔇 Ton aus'};start();
</script></body></html>
