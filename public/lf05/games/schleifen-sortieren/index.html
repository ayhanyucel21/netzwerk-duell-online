<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081424">
<title>Schleifen Sortieren – LF05</title>
<style>
:root{--bg:#06101d;--panel:#0e233d;--text:#f7fbff;--muted:#afc2d4;--line:#ffffff1c;--cyan:#48d8ff;--purple:#9d7fff;--green:#46dc97;--orange:#ff9858;--red:#ff6e82;--yellow:#ffd166}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 8% 8%,#ff89542a,transparent 27%),radial-gradient(circle at 92% 10%,#9066ff32,transparent 29%),linear-gradient(145deg,#19102d,#07182c 56%,var(--bg))}body:before{content:"";position:fixed;inset:0;z-index:-1;opacity:.1;background-image:linear-gradient(#72d1ff55 1px,transparent 1px),linear-gradient(90deg,#72d1ff55 1px,transparent 1px);background-size:46px 46px}button{font:inherit}.hidden{display:none!important}.shell{width:min(1160px,calc(100% - 22px));margin:auto;padding:14px 0 34px}.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}.top a,.sound{min-height:43px;padding:9px 14px;border:1px solid var(--line);border-radius:13px;color:white;background:#0b2947;text-decoration:none;font-weight:850}.hero{padding:29px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(135deg,#7143b8d9,#225d91dc);box-shadow:0 22px 56px #0006}.eyebrow{display:inline-block;padding:7px 12px;border-radius:999px;background:#07162c77;font-size:.78rem;font-weight:950;letter-spacing:.09em}h1{margin:13px 0 7px;font-size:clamp(2.1rem,5vw,4rem)}.hero p{max-width:800px;margin:0;color:#e0e9f3;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.stat{padding:12px;border:1px solid var(--line);border-radius:15px;background:#0c2744;text-align:center}.stat b{display:block;color:var(--cyan);font-size:1.25rem}.stat span{color:var(--muted);font-size:.75rem}.progress{height:10px;margin-bottom:16px;overflow:hidden;border-radius:999px;background:#ffffff12}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan),var(--green));transition:.3s}.game{padding:20px;border:1px solid var(--line);border-radius:22px;background:#0a1e37ed}.scenario{padding:15px;border-left:5px solid var(--orange);border-radius:13px;background:#142c4b;line-height:1.55}.scenario small{display:block;color:var(--orange);font-weight:950;letter-spacing:.08em}.scenario h2{margin:7px 0 0;font-size:1.15rem}.instruction{margin:15px 0 10px;color:var(--muted)}.pool,.placed{min-height:92px;display:flex;align-items:center;justify-content:center;align-content:center;gap:9px;flex-wrap:wrap;padding:13px;border-radius:16px;background:#0e2b4b}.card{padding:12px 14px;border:1px solid #ffffff25;border-radius:11px;color:white;background:#23547e;font:800 .92rem/1.35 Consolas,monospace;cursor:grab;user-select:none;touch-action:none}.card.selected{border-color:var(--yellow);box-shadow:0 0 0 3px #ffd16625}.card.dragging{opacity:.35}.zones{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:13px}.zone{min-height:155px;padding:12px;border:2px dashed #ffffff24;border-radius:16px;background:#0a213b;transition:.18s}.zone.hover{border-color:var(--cyan);transform:translateY(-3px);background:#12395d}.zone.correct{border-color:var(--green);background:#123e31}.zone.wrong{border-color:var(--red);background:#492238}.zone h3{margin:0 0 8px;text-align:center;font-size:.86rem}.zone .placed{min-height:98px;padding:7px;background:transparent}.zone .card{width:100%;text-align:center;background:#683f92}.feedback{min-height:60px;margin-top:14px;padding:13px;border:1px solid var(--line);border-radius:13px;background:#081a30;line-height:1.55}.feedback.good{border-color:#46dc9760;background:#123e31}.feedback.bad{border-color:#ff6e8260;background:#462038}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:13px}.btn{min-height:43px;padding:9px 14px;border:1px solid var(--line);border-radius:12px;color:white;background:#173d60;cursor:pointer;font-weight:900}.btn.primary{color:#101000;background:var(--yellow)}.btn:disabled{opacity:.55;cursor:default}.result{padding:30px;text-align:center}.score-big{font-size:3.2rem;color:var(--yellow);font-weight:1000}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.result-grid div{padding:13px;border-radius:13px;background:#ffffff0d}.result-grid b{display:block;color:var(--cyan);font-size:1.3rem}@media(max-width:900px){.zones{grid-template-columns:1fr 1fr}}@media(max-width:600px){.top{flex-direction:column}.stats{grid-template-columns:1fr 1fr}.zones{grid-template-columns:1fr}.game{padding:14px}.result-grid{grid-template-columns:1fr}}
</style></head>
<body><main class="shell"><nav class="top"><a href="../">← Lernspiele</a><button id="sound" class="sound">🔊 Ton an</button></nav><header class="hero"><span class="eyebrow">🔁 LF05 · DRAG & DROP</span><h1>Schleifen Sortieren</h1><p>Ziehe die Python-Bausteine in die richtige Kategorie. Nach der Auswertung entscheidest du selbst, wann die nächste Aufgabe geöffnet wird.</p></header><section class="stats"><div class="stat"><b id="round">1/20</b><span>Aufgabe</span></div><div class="stat"><b id="xp">0</b><span>XP</span></div><div class="stat"><b id="correct">0</b><span>Richtig</span></div><div class="stat"><b id="lives">❤️❤️❤️</b><span>Leben</span></div></section><div class="progress"><i id="progress"></i></div><section id="game" class="game"></section></main>
<script>
const CATS={loop:['🔁 Schleife','for / while / range'],condition:['🚦 Bedingung','if / elif / else'],control:['🛠️ Steuerung','break / continue / Zähler'],io:['⌨️ Ein-/Ausgabe','input / print']};
const TASKS=[
['Ein Konsolenmenü soll wiederholt angezeigt werden, bis „Beenden“ gewählt wird.','while steuert die Wiederholung, if prüft die Auswahl, break beendet und input liest ein.',[['while auswahl != "0":','loop'],['if auswahl == "1":','condition'],['break','control'],['auswahl = input("Auswahl: ")','io']]],
['Drei Anmeldeversuche sollen geprüft werden.','range(3) begrenzt die Versuche, if prüft, break beendet bei Erfolg und input liest das Passwort.',[['for versuch in range(3):','loop'],['if passwort == "geheim":','condition'],['break','control'],['passwort = input("Passwort: ")','io']]],
['FizzBuzz soll Zahlen bis zu einer Obergrenze verarbeiten.','for und range bilden die Zählschleife, if prüft Teilbarkeit, continue steuert und print gibt aus.',[['for zahl in range(1, grenze + 1):','loop'],['if zahl % 15 == 0:','condition'],['continue','control'],['print("FizzBuzz")','io']]],
['Zeitslots werden in Zweistundenschritten erzeugt.','range erzeugt Startzeiten, if prüft Grenzen, der Zähler wird verändert und print zeigt Slots.',[['for start in range(8, 18, 2):','loop'],['if start + 2 <= 18:','condition'],['start += 2','control'],['print(start, start + 2)','io']]],
['Eine Zahl wird bis 0 heruntergezählt.','while wiederholt abhängig vom Zähler, if prüft einen Sonderfall, -= verändert und print gibt aus.',[['while zahl >= 0:','loop'],['if zahl == 0:','condition'],['zahl -= 1','control'],['print(zahl)','io']]],
['Die Schleife endet an der ersten durch 10 teilbaren Zahl.','for durchläuft Zahlen, if erkennt Teilbarkeit, break beendet und print protokolliert.',[['for zahl in zahlen:','loop'],['if zahl % 10 == 0:','condition'],['break','control'],['print(zahl)','io']]],
['Ungültige Menüeingaben sollen übersprungen werden.','while hält das Menü aktiv, if validiert, continue startet den nächsten Durchlauf und input liest ein.',[['while True:','loop'],['if auswahl not in ("1", "0"):','condition'],['continue','control'],['auswahl = input("Menü: ")','io']]],
['Alle Zeichen eines Benutzernamens werden geprüft.','for durchläuft den String, if prüft, continue überspringt und print meldet.',[['for zeichen in benutzername:','loop'],['if not zeichen.isalnum():','condition'],['continue','control'],['print("Zeichen geprüft")','io']]],
['Ein Zahlenratespiel läuft bis zum Treffer.','while steuert unbekannte Versuche, if vergleicht, break beendet und input liest den Tipp.',[['while True:','loop'],['if tipp == geheimzahl:','condition'],['break','control'],['tipp = int(input("Tipp: "))','io']]],
['Eine Serverliste wird nacheinander geprüft.','for durchläuft Server, if prüft Status, continue überspringt und print protokolliert.',[['for server in serverliste:','loop'],['if status == "offline":','condition'],['continue','control'],['print(server, status)','io']]],
['Ein Hundejahr-Rechner verarbeitet Altersbereiche.','for kann mehrere Tests ausführen, elif bildet Grenzfälle ab, der Zähler steuert und input liest.',[['for test in range(3):','loop'],['elif hundealter == 2:','condition'],['test += 1','control'],['hundealter = int(input("Alter: "))','io']]],
['Eine Uhrzeit wird in Zeitabschnitte eingeordnet.','while erlaubt weitere Eingaben, if prüft Intervalle, break beendet und input liest die Stunde.',[['while True:','loop'],['if 5 <= stunde < 11:','condition'],['break','control'],['stunde = int(input("Stunde: "))','io']]],
['Domino-Kombinationen ohne Spiegelduplikate werden ausgegeben.','for erzeugt Kombinationen, if sichert gültige Paare, der Startwert steuert und print gibt aus.',[['for links in range(7):','loop'],['if rechts >= links:','condition'],['rechts = links','control'],['print(links, rechts)','io']]],
['Ein Frosch springt jeweils halb so weit.','while prüft die Strecke, if erkennt Abbruch, /= verändert die Sprungweite und print dokumentiert.',[['while strecke < 2.5:','loop'],['if sprungweite < 0.001:','condition'],['sprungweite /= 2','control'],['print(spruenge, strecke)','io']]],
['Eine Liste soll nur positive Werte verarbeiten.','for durchläuft Werte, if erkennt ungültige Werte, continue überspringt und print gibt gültige Werte aus.',[['for wert in werte:','loop'],['if wert <= 0:','condition'],['continue','control'],['print(wert)','io']]],
['Ein Kassenprogramm erfasst drei Produktmengen.','for wiederholt dreimal, if validiert, die Summe wird erhöht und input liefert die Menge.',[['for produkt in range(3):','loop'],['if menge < 0:','condition'],['gesamt += menge * preis','control'],['menge = int(input("Menge: "))','io']]],
['Eine Passwortprüfung endet nach drei Fehlversuchen.','while nutzt einen Zähler, if prüft, += aktualisiert und input liest das Passwort.',[['while versuche < 3:','loop'],['if passwort == korrekt:','condition'],['versuche += 1','control'],['passwort = input("Passwort: ")','io']]],
['Eine Zahl wird auf gerade oder ungerade geprüft.','for kann mehrere Zahlen testen, if nutzt Modulo, der Zähler begrenzt und print gibt aus.',[['for test in range(5):','loop'],['if zahl % 2 == 0:','condition'],['test += 1','control'],['print("gerade")','io']]],
['Befehle werden gelesen, bis „exit“ eingegeben wird.','while wiederholt, if erkennt exit, break beendet und input liest Befehle.',[['while True:','loop'],['if befehl == "exit":','condition'],['break','control'],['befehl = input("Befehl: ")','io']]],
['Eine festgelegte Anzahl Spielrunden wird durchgeführt.','for und range bilden die Rundenzahl, if bewertet, Punkte werden verändert und print informiert.',[['for runde in range(anzahl_runden):','loop'],['if spieler == computer:','condition'],['punkte += 1','control'],['print("Runde", runde + 1)','io']]]
].map(([s,e,c])=>({s,e,c}));
let order=[],round=0,xp=0,lives=3,correct=0,selected=null,soundOn=true,locked=false;const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){order=shuffle(TASKS);round=0;xp=0;lives=3;correct=0;render()}
function render(){if(round>=20||lives<=0)return finish();locked=false;selected=null;const t=order[round];$('round').textContent=`${round+1}/20`;$('xp').textContent=xp;$('correct').textContent=correct;$('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);$('progress').style.width=`${round/20*100}%`;$('game').innerHTML=`<div class="scenario"><small>LZK-/IHK-TRANSFERAUFGABE</small><h2>${t.s}</h2></div><p class="instruction">Ziehe jede Karte in die passende Kategorie.</p><div id="pool" class="pool"></div><div class="zones">${Object.entries(CATS).map(([k,v])=>`<section class="zone" data-cat="${k}"><h3>${v[0]}<br><small>${v[1]}</small></h3><div class="placed"></div></section>`).join('')}</div><div id="feedback" class="feedback">Alle vier Karten müssen zugeordnet werden.</div><div class="actions"><button id="reset" class="btn">↶ Zurücksetzen</button><button id="check" class="btn primary">Zuordnung prüfen</button><button id="next" class="btn primary hidden">Nächste Aufgabe →</button></div>`;shuffle(t.c.map((x,i)=>({text:x[0],cat:x[1],id:i}))).forEach(makeCard);setupZones();$('reset').onclick=resetRound;$('check').onclick=checkRound;$('next').onclick=nextRound}
function makeCard(item){const b=document.createElement('button');b.className='card';b.type='button';b.draggable=true;b.textContent=item.text;b.dataset.cat=item.cat;b.ondragstart=e=>{selected=b;b.classList.add('dragging');e.dataTransfer.setData('text/plain',item.id)};b.ondragend=()=>b.classList.remove('dragging');b.onclick=()=>{document.querySelectorAll('.card').forEach(x=>x.classList.remove('selected'));selected=b;b.classList.add('selected')};$('pool').appendChild(b)}
function setupZones(){document.querySelectorAll('.zone').forEach(z=>{z.ondragover=e=>{e.preventDefault();z.classList.add('hover')};z.ondragleave=()=>z.classList.remove('hover');z.ondrop=e=>{e.preventDefault();z.classList.remove('hover');if(selected)place(selected,z)};z.onclick=e=>{if(selected&&!e.target.closest('.card'))place(selected,z)}})}
function place(card,zone){zone.querySelector('.placed').appendChild(card);card.classList.remove('selected');selected=null}
function resetRound(){if(locked)return;document.querySelectorAll('.zone .card').forEach(c=>$('pool').appendChild(c));document.querySelectorAll('.zone').forEach(z=>z.classList.remove('correct','wrong'));$('feedback').className='feedback';$('feedback').textContent='Alle vier Karten müssen zugeordnet werden.'}
function checkRound(){if(locked)return;const cards=[...document.querySelectorAll('.card')];if(cards.some(c=>c.parentElement.id==='pool')){$('feedback').className='feedback bad';$('feedback').textContent='Ordne zuerst alle Karten einem Zielfeld zu.';return}locked=true;let ok=true;document.querySelectorAll('.zone').forEach(z=>{const good=[...z.querySelectorAll('.card')].every(c=>c.dataset.cat===z.dataset.cat)&&z.querySelectorAll('.card').length===1;z.classList.add(good?'correct':'wrong');if(!good)ok=false});document.querySelectorAll('.card').forEach(c=>{c.draggable=false;c.onclick=null;c.style.cursor='default'});$('reset').disabled=true;$('check').classList.add('hidden');const t=order[round];if(ok){correct++;xp+=20;$('correct').textContent=correct;$('xp').textContent=xp;$('feedback').className='feedback good';$('feedback').innerHTML=`<b>Richtig zugeordnet.</b><br><br>${t.e}<br><br><b>Prüfungshinweis:</b> Unterscheide zuerst Wiederholung, Bedingung, Steuerung und Ein-/Ausgabe.`;tone(660)}else{lives--;$('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);$('feedback').className='feedback bad';$('feedback').innerHTML=`<b>Noch nicht korrekt.</b><br><br>${t.e}<br><br><b>Typischer Denkfehler:</b> break und continue sind keine Schleifen; input und print gehören zur Ein-/Ausgabe.`;tone(180)}$('next').classList.remove('hidden');$('next').textContent=(round===19||lives<=0)?'Ergebnis anzeigen →':'Nächste Aufgabe →'}
function nextRound(){if(!locked)return;round++;render()}
function finish(){$('progress').style.width='100%';$('game').innerHTML=`<div class="result"><div style="font-size:4rem">🏆</div><h2>Spiel beendet</h2><div class="score-big">${xp} XP</div><div class="result-grid"><div><b>${correct}/20</b><span>richtige Aufgaben</span></div><div><b>${20-correct}</b><span>nicht gelöst</span></div><div><b>${Math.round(correct/20*100)} %</b><span>Trefferquote</span></div></div><p>${correct>=17?'Sehr sicher.':correct>=12?'Gute Grundlage. Wiederhole break, continue, for und while.':'Wiederhole Schleifen, Bedingungen, Steuerung sowie Ein-/Ausgabe.'}</p><button class="btn primary" onclick="start()">Nochmal spielen</button></div>`}
let ac;function tone(f){if(!soundOn)return;try{const A=window.AudioContext||window.webkitAudioContext;ac=ac||new A();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.1,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.23)}catch{}}$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Ton an':'🔇 Ton aus'};start();
</script></body></html>
