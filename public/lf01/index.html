<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071a33">

    <!-- HIER ÄNDERN -->
    <title>LF01 – Fachinformatiker Lernplattform</title>

    <style>
        :root {
            /* DIESE FARBEN KÖNNEN PRO LERNFELD GEÄNDERT WERDEN */
            --accent: #39d5ff;
            --accent-dark: #0b75c9;

            --background-dark: #050d1a;
            --background-blue: #0b2b50;
            --text: #f5fbff;
            --muted: #b8cada;
            --border: rgba(158, 220, 255, 0.20);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(
                    circle at 10% 10%,
                    color-mix(in srgb, var(--accent) 28%, transparent),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 15%,
                    rgba(120, 75, 255, 0.20),
                    transparent 28%
                ),
                linear-gradient(
                    145deg,
                    var(--background-blue),
                    #07182e 48%,
                    var(--background-dark)
                );
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.10;
            background-image:
                linear-gradient(
                    rgba(99, 212, 255, 0.50) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(99, 212, 255, 0.50) 1px,
                    transparent 1px
                );
            background-size: 46px 46px;
        }

        .page {
            position: relative;
            width: min(820px, 100%);
            overflow: hidden;
            padding: 38px;
            border: 1px solid var(--border);
            border-radius: 28px;
            background:
                linear-gradient(
                    145deg,
                    rgba(13, 48, 81, 0.96),
                    rgba(6, 23, 42, 0.96)
                );
            box-shadow: 0 26px 70px rgba(0, 0, 0, 0.42);
        }
