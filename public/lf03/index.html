  ihkTrainer.desc = "60 praxisnahe Prüfungsszenarien, einschließlich 10 neuer Aufgaben aus Tag 12 und Tag 13.";
  ihkTrainer.questions.push(...[{"type": "mc", "q": "51. Ein Arbeitsplatz mit vielen offenen Excel-Dateien reagiert sehr langsam. Der Task-Manager zeigt 96 % RAM und nur 25 % CPU. Welche Maßnahme ist fachlich am besten begründet?", "options": ["RAM-Auslastung und Paging genauer prüfen und gegebenenfalls RAM erweitern", "Sofort den DNS-Server ersetzen", "Das Standardgateway ändern", "Die GPU deaktivieren"], "answer": "RAM-Auslastung und Paging genauer prüfen und gegebenenfalls RAM erweitern", "exp": "Der Messwert zeigt RAM-Druck. Eine Empfehlung soll Ursache, Messwert und passende Maßnahme verbinden."}, {"type": "mc", "q": "52. Für 200 Callcenter-Arbeitsplätze wird nur ein zentral bereitgestelltes Web-CRM benötigt. Welche Lösung unterstützt zentrale Wartung und geringe lokale Hardwareanforderungen?", "options": ["Thin Clients mit zentraler Bereitstellung", "Leistungsstarke Fat Clients mit High-End-GPU", "Offline-PCs ohne Netzwerk", "Einzelne Gaming-PCs"], "answer": "Thin Clients mit zentraler Bereitstellung", "exp": "Das standardisierte, serverbasierte Einsatzszenario passt zu Thin Clients."}, {"type": "mc", "q": "53. Ein autonomes Fahrzeug muss unmittelbar auf ein erkanntes Hindernis reagieren. Welche Architektur ist für die erste Entscheidung am geeignetsten?", "options": ["Edge Computing direkt im Fahrzeug", "Ausschließliche Verarbeitung in einer entfernten Public Cloud", "SaaS im Browser", "Archivierung in Cold Storage"], "answer": "Edge Computing direkt im Fahrzeug", "exp": "Die Verarbeitung muss mit sehr geringer Latenz nahe an der Datenquelle erfolgen."}, {"type": "mc", "q": "54. Ein Unternehmen möchte einen virtuellen Linux-Server mieten und Betriebssystem, Updates sowie Anwendungen selbst administrieren. Welches Cloud-Modell ist passend?", "options": ["IaaS", "PaaS", "SaaS", "Community SaaS"], "answer": "IaaS", "exp": "Der Provider stellt virtuelle Infrastruktur bereit; das Unternehmen verwaltet Betriebssystem und Anwendungen."}, {"type": "mc", "q": "55. Eine Anwendung nutzt zahlreiche proprietäre Dienste eines einzigen Cloud-Providers. Welches strategische Risiko steigt?", "options": ["Vendor Lock-in", "APIPA", "Crosstalk", "Broadcast-Sturm"], "answer": "Vendor Lock-in", "exp": "Proprietäre Abhängigkeiten können Migration und Anbieterwechsel erschweren."}, {"type": "mc", "q": "56. Ein Krankenhaus betreibt einen empfindlichen Datenbankserver, der keine Umschaltunterbrechung toleriert. Welche USV-Klasse ist am besten geeignet?", "options": ["VFI / Online-USV", "VFD / Offline-USV", "Keine USV", "Eine gewöhnliche Steckdosenleiste"], "answer": "VFI / Online-USV", "exp": "Für hochkritische Lasten mit sehr hohem Schutzbedarf ist VFI geeignet."}, {"type": "mc", "q": "57. Ein Provider garantiert 99,999 % Verfügbarkeit. Welche maximale jährliche Ausfallzeit ist ungefähr zulässig?", "options": ["5,26 Minuten", "8,76 Stunden", "87,6 Stunden", "52,56 Stunden"], "answer": "5,26 Minuten", "exp": "0,001 % von 8.760 Stunden entsprechen rund 5,26 Minuten."}, {"type": "mc", "q": "58. Ein Webshop wächst. Statt einen einzelnen Server weiter aufzurüsten, werden drei zusätzliche Webserver eingesetzt. Welche Skalierung ist das?", "options": ["Horizontale Skalierung / Scale-Out", "Vertikale Skalierung / Scale-Up", "VFD-Skalierung", "SaaS-Migration"], "answer": "Horizontale Skalierung / Scale-Out", "exp": "Beim Scale-Out wird die Kapazität durch weitere Systeme erweitert."}, {"type": "mc", "q": "59. Die Anfragen eines Webdienstes dauern sehr unterschiedlich lange. Welcher Load-Balancing-Algorithmus berücksichtigt die aktuelle Zahl aktiver Verbindungen?", "options": ["Least Connections", "Round Robin", "CSMA/CD", "DORA"], "answer": "Least Connections", "exp": "Least Connections bevorzugt Systeme mit weniger laufenden Verbindungen."}, {"type": "mc", "q": "60. Ein Backend-Webserver hat einen Hardwaredefekt. Welche Funktion verhindert, dass der Load Balancer weiterhin neue Anfragen dorthin sendet?", "options": ["Regelmäßige Health Checks", "Ein längeres DHCP-Lease", "Eine höhere USV-Autonomiezeit allein", "Ein statischer DNS-Cache"], "answer": "Regelmäßige Health Checks", "exp": "Health Checks erkennen nicht verfügbare Backends und nehmen sie aus der Verteilung."}]);
}
tabellen.push({"id":6,"title":"Tabelle 6: Hardware, Client-Modelle, Cloud, USV & Load Balancing","desc":"Tag 12–14: Hardware, Client-Modelle, Cloud, USV, Verfügbarkeit, Load Balancing, RAID und Backup (60 Fragen).","questions":[{"type":"mc","q":"1. Welche Komponente führt Programmbefehle aus und übernimmt Berechnungen?","options":["CPU","RAM","SSD","Netzteil"],"answer":"CPU","exp":"Die CPU verarbeitet Befehle, führt Berechnungen aus und koordiniert zentrale Verarbeitungsschritte."},{"type":"mc","q":"2. Welche Komponente hält aktuell verwendete Programme und Daten kurzfristig bereit?","options":["RAM","HDD","GPU","BIOS"],"answer":"RAM","exp":"RAM ist schneller, flüchtiger Arbeitsspeicher. Beim Ausschalten gehen die darin gehaltenen Daten verloren."},{"type":"mc","q":"3. Welche Aussage beschreibt den Unterschied zwischen SSD und HDD korrekt?","options":["Eine SSD nutzt Flash-Speicher ohne bewegliche Teile.","Eine HDD besitzt grundsätzlich eine geringere Zugriffszeit.","Eine SSD speichert Daten nur während des Betriebs.","Eine HDD verwendet ausschließlich optische Datenträger."],"answer":"Eine SSD nutzt Flash-Speicher ohne bewegliche Teile.","exp":"SSDs verwenden Flash-Speicher und haben keine beweglichen Teile; HDDs arbeiten mit magnetischen Scheiben und Mechanik."},{"type":"mc","q":"4. Bei 95 % RAM-Auslastung reagiert ein PC sehr langsam. Welche Ursache ist am wahrscheinlichsten?","options":["Das System lagert Daten auf den deutlich langsameren Massenspeicher aus.","Der DNS-Server löscht die lokale IP-Adresse.","Der Switch reduziert automatisch die CPU-Leistung.","Die GPU übernimmt die DHCP-Kommunikation."],"answer":"Das System lagert Daten auf den deutlich langsameren Massenspeicher aus.","exp":"Bei starkem RAM-Druck kann Paging entstehen. Der Massenspeicher ist langsamer als RAM und bremst das System."},{"type":"mc","q":"5. Welches Windows-Werkzeug zeigt detailliertere prozessbezogene Ressourceninformationen als die Standardansicht des Task-Managers?","options":["Ressourcenmonitor","Windows-Editor","Datenträgerbereinigung","Geräte und Drucker"],"answer":"Ressourcenmonitor","exp":"Der Ressourcenmonitor zeigt detailliertere Zusammenhänge zu CPU, RAM, Datenträger und Netzwerk."},{"type":"mc","q":"6. Welches Linux-Werkzeug zeigt Prozesse und Systemauslastung interaktiv an?","options":["htop","nslookup","chmod","mkdir"],"answer":"htop","exp":"htop zeigt Prozesse sowie CPU- und RAM-Auslastung interaktiv auf der Kommandozeile."},{"type":"mc","q":"7. Welches Client-Modell eignet sich typischerweise für einen 4K-Videoschnittplatz?","options":["Fat Client","Thin Client","Diskless Client ohne Server","Terminal ohne lokale Rechenleistung"],"answer":"Fat Client","exp":"Videoschnitt benötigt leistungsfähige lokale CPU, RAM, GPU und Massenspeicher."},{"type":"mc","q":"8. Welches Client-Modell ist für 200 Callcenter-Arbeitsplätze mit einem Web-CRM häufig sinnvoll?","options":["Thin Client","CAD-Workstation","Gaming-PC","Offline-Fat-Client ohne Netzwerk"],"answer":"Thin Client","exp":"Bei standardisierten, serverbasierten Anwendungen können Thin Clients Wartung und zentrale Verwaltung vereinfachen."},{"type":"mc","q":"9. Wo findet beim Thin Client die wesentliche Verarbeitung typischerweise statt?","options":["Auf einem zentralen Server","Ausschließlich auf der lokalen GPU","Im lokalen BIOS","Im Patchpanel"],"answer":"Auf einem zentralen Server","exp":"Der Thin Client dient hauptsächlich als Ein- und Ausgabegerät; die Anwendung läuft überwiegend serverseitig."},{"type":"mc","q":"10. Welches Konzept verarbeitet zeitkritische Sensordaten unmittelbar am oder nahe beim Endgerät?","options":["Edge Computing","Public Cloud","SaaS","Cold Storage"],"answer":"Edge Computing","exp":"Edge Computing reduziert Latenz und Abhängigkeit von WAN-Verbindungen, weil die Verarbeitung nahe an der Datenquelle erfolgt."},{"type":"mc","q":"11. Welche Beschreibung passt zu Fog Computing?","options":["Eine Zwischenschicht zwischen Edge-Geräten und zentraler Cloud","Eine lokale Festplatte ohne Netzwerk","Ein ausschließlich öffentliches SaaS-Angebot","Eine USV-Klasse für Server"],"answer":"Eine Zwischenschicht zwischen Edge-Geräten und zentraler Cloud","exp":"Fog Computing koordiniert Verarbeitung in lokalen Gateways oder regionalen Knoten zwischen Edge und Cloud."},{"type":"mc","q":"12. Welche Cloud-Form kombiniert private und öffentliche Cloud-Anteile?","options":["Hybrid Cloud","Private Cloud","Community Cloud","Edge Cloud ohne Provider"],"answer":"Hybrid Cloud","exp":"Eine Hybrid Cloud verbindet private Ressourcen mit Diensten einer Public Cloud."},{"type":"mc","q":"13. Welches Servicemodell beschreibt eine fertige, über den Browser nutzbare Anwendung?","options":["SaaS","PaaS","IaaS","VFI"],"answer":"SaaS","exp":"Bei Software as a Service stellt der Provider die nutzbare Anwendung bereit."},{"type":"mc","q":"14. Ein Unternehmen mietet einen virtuellen Ubuntu-Server und verwaltet Betriebssystem sowie Anwendungen selbst. Welches Modell ist das?","options":["IaaS","SaaS","PaaS","Fog as a Service"],"answer":"IaaS","exp":"Bei Infrastructure as a Service stellt der Provider die Infrastruktur bereit; das Betriebssystem und die Anwendungen verwaltet der Kunde."},{"type":"mc","q":"15. Eine Entwicklungsplattform stellt Laufzeitumgebung und verwaltete Datenbank bereit. Welches Modell passt?","options":["PaaS","IaaS","SaaS","VFD"],"answer":"PaaS","exp":"Platform as a Service stellt eine verwaltete Plattform bereit, auf der Entwickler Anwendungen ausführen können."},{"type":"mc","q":"16. Was beschreibt Vendor Lock-in?","options":["Ein Anbieterwechsel wird technisch oder wirtschaftlich schwierig.","Ein Server wird gegen Stromausfall geschützt.","Ein Client erhält eine APIPA-Adresse.","Ein Load Balancer sperrt einen Webserver dauerhaft."],"answer":"Ein Anbieterwechsel wird technisch oder wirtschaftlich schwierig.","exp":"Vendor Lock-in entsteht durch starke Abhängigkeiten von proprietären Diensten, Formaten oder Schnittstellen."},{"type":"mc","q":"17. Welches Ziel verfolgt eine cloud-agnostische Architektur?","options":["Unnötige Abhängigkeiten von einem einzelnen Cloud-Anbieter reduzieren","Alle Anwendungen ausschließlich lokal betreiben","Jede Cloud-Verbindung grundsätzlich blockieren","Nur proprietäre Provider-Dienste verwenden"],"answer":"Unnötige Abhängigkeiten von einem einzelnen Cloud-Anbieter reduzieren","exp":"Cloud-agnostische Konzepte erleichtern Portabilität und reduzieren Wechselbarrieren."},{"type":"mc","q":"18. Was ist eine Hauptaufgabe einer USV im Serverbetrieb?","options":["Kurze Stromausfälle überbrücken und kontrolliertes Herunterfahren ermöglichen","Die Internetbandbreite erhöhen","DNS-Namen in IP-Adressen umwandeln","VLAN-Tags entfernen"],"answer":"Kurze Stromausfälle überbrücken und kontrolliertes Herunterfahren ermöglichen","exp":"Eine USV schützt vor Stromunterbrechungen und ermöglicht einen geordneten Betrieb oder Shutdown."},{"type":"mc","q":"19. Was beschreibt die Autonomiezeit einer USV?","options":["Die mögliche Überbrückungsdauer bei einer definierten Last","Die Zeit zum Starten des Betriebssystems","Die Lebensdauer eines Ethernet-Frames","Die Antwortzeit eines DNS-Servers"],"answer":"Die mögliche Überbrückungsdauer bei einer definierten Last","exp":"Die Autonomiezeit gibt an, wie lange die USV eine bestimmte Last mit Batterie versorgen kann."},{"type":"mc","q":"20. Warum ist ein hoher Wirkungsgrad einer USV im 24/7-Betrieb wichtig?","options":["Er reduziert Energieverluste, Kosten und Abwärme.","Er verlängert automatisch jedes Netzwerkkabel.","Er erhöht die Anzahl der VLANs.","Er ersetzt Health Checks."],"answer":"Er reduziert Energieverluste, Kosten und Abwärme.","exp":"Bei dauerhaftem Betrieb verursachen Verluste laufende Energiekosten und zusätzliche Wärme."},{"type":"mc","q":"21. Welche USV-Klasse bietet den höchsten Schutz für einen geschäftskritischen Datenbankserver?","options":["VFI / Online-USV","VFD / Offline-USV","Eine Mehrfachsteckdose","Eine VI-USV ohne Batterie"],"answer":"VFI / Online-USV","exp":"VFI versorgt die Last dauerhaft über die Leistungselektronik und eignet sich für hochkritische Systeme."},{"type":"mc","q":"22. Welche USV-Klasse ist bei regelmäßigen kleineren Spannungsschwankungen und mittlerem Schutzbedarf passend?","options":["VI / Line-Interactive-USV","VFD / Offline-USV","VFI nur ohne Batterie","Keine USV"],"answer":"VI / Line-Interactive-USV","exp":"VI-Systeme können Spannungsschwankungen ausgleichen und bieten einen mittleren Schutz."},{"type":"mc","q":"23. Wie viel maximale Ausfallzeit pro Jahr entsprechen 99,9 % Verfügbarkeit bei 8.760 Stunden?","options":["8,76 Stunden","87,6 Stunden","52,56 Minuten","5,26 Minuten"],"answer":"8,76 Stunden","exp":"Der Ausfallanteil beträgt 0,1 %. 8.760 Stunden × 0,001 = 8,76 Stunden."},{"type":"mc","q":"24. Welche Maßnahme allein erzeugt noch keine Hochverfügbarkeit?","options":["Nur eine USV installieren","Redundanz einplanen","Monitoring einsetzen","Failover regelmäßig testen"],"answer":"Nur eine USV installieren","exp":"Hohe Verfügbarkeit benötigt zusätzlich Redundanz, Monitoring, Prozesse und Tests."},{"type":"mc","q":"25. Was bedeutet vertikale Skalierung (Scale-Up)?","options":["Einen vorhandenen Server leistungsfähiger ausstatten","Weitere Server hinzufügen","Anfragen zyklisch verteilen","Defekte Backends entfernen"],"answer":"Einen vorhandenen Server leistungsfähiger ausstatten","exp":"Scale-Up erhöht Ressourcen eines bestehenden Systems, beispielsweise CPU oder RAM."},{"type":"mc","q":"26. Was bedeutet horizontale Skalierung (Scale-Out)?","options":["Weitere Server oder Instanzen hinzufügen","Nur den RAM eines Servers erhöhen","Eine größere USV anschließen","Die SLA-Verfügbarkeit reduzieren"],"answer":"Weitere Server oder Instanzen hinzufügen","exp":"Scale-Out verteilt die Verarbeitung auf mehrere Systeme."},{"type":"mc","q":"27. Welche Kernaufgabe hat ein Load Balancer?","options":["Anfragen auf mehrere Backend-Systeme verteilen","IP-Adressen per DHCP vergeben","Dateien dauerhaft speichern","USV-Batterien laden"],"answer":"Anfragen auf mehrere Backend-Systeme verteilen","exp":"Ein Load Balancer verteilt eingehende Anfragen auf mehrere Backends."},{"type":"mc","q":"28. Wie verteilt Round Robin eingehende Anfragen?","options":["Zyklisch nacheinander auf die Backends","Immer an den Server mit der größten Festplatte","Nur an den zuerst gestarteten Server","Ausschließlich nach IP-Adresse des Clients"],"answer":"Zyklisch nacheinander auf die Backends","exp":"Round Robin weist Anfragen der Reihe nach den verfügbaren Backend-Systemen zu."},{"type":"mc","q":"29. Welcher Algorithmus eignet sich häufig besser bei unterschiedlich langen Verbindungen?","options":["Least Connections","Round Robin ohne Health Checks","Broadcast","Spanning Tree"],"answer":"Least Connections","exp":"Least Connections bevorzugt das Backend mit weniger aktiven Verbindungen."},{"type":"mc","q":"30. Wozu dienen Health Checks beim Load Balancing?","options":["Defekte Backends erkennen und aus der Verteilung nehmen","Die USV-Autonomiezeit verlängern","Cloud-Anbieter automatisch wechseln","MAC-Adressen verschlüsseln"],"answer":"Defekte Backends erkennen und aus der Verteilung nehmen","exp":"Health Checks prüfen regelmäßig, ob ein Backend funktionsfähig ist."},{"type":"mc","q":"31. Ein Videoschnittsystem benötigt maximale Leistung; die Arbeitsdaten sind nur temporär und dürfen bei einem Datenträgerausfall verloren gehen. Welcher RAID-Level passt?","options":["RAID 0","RAID 1","RAID 5","RAID 6"],"answer":"RAID 0","exp":"RAID 0 verteilt Daten per Striping auf mehrere Datenträger und erhöht die Leistung, bietet aber keinerlei Redundanz."},{"type":"mc","q":"32. Ein kleiner Server soll sein Betriebssystem auf zwei Datenträgern identisch spiegeln. Welcher RAID-Level ist passend?","options":["RAID 1","RAID 0","RAID 5","RAID 6"],"answer":"RAID 1","exp":"RAID 1 nutzt Mirroring. Beide Datenträger enthalten denselben Datenbestand; dafür steht nur etwa die Hälfte der Rohkapazität zur Verfügung."},{"type":"mc","q":"33. Ein NAS soll einen guten Kompromiss aus nutzbarer Kapazität und Ausfallsicherheit bei einem defekten Datenträger bieten. Welcher RAID-Level passt?","options":["RAID 5","RAID 0","RAID 1","RAID 10"],"answer":"RAID 5","exp":"RAID 5 verteilt Nutzdaten und einfache Parität über die Datenträger und kann den Ausfall eines Datenträgers verkraften."},{"type":"mc","q":"34. Ein Speichersystem soll trotz des gleichzeitigen Ausfalls von zwei Datenträgern weiterarbeiten können. Welcher RAID-Level erfüllt diese Anforderung?","options":["RAID 6","RAID 5","RAID 1 mit zwei Datenträgern","RAID 0"],"answer":"RAID 6","exp":"RAID 6 verwendet doppelte Parität und kann deshalb den Ausfall von zwei Datenträgern tolerieren."},{"type":"mc","q":"35. Ein Datenbankserver benötigt hohe Leistung und Redundanz; zusätzliche Datenträgerkosten sind akzeptiert. Welcher RAID-Level kombiniert Striping und Spiegelung?","options":["RAID 10","RAID 0","RAID 5","RAID 6"],"answer":"RAID 10","exp":"RAID 10 kombiniert Striping mit Mirroring. Dadurch entstehen Leistung und Redundanz, allerdings werden mehr Datenträger benötigt."},{"type":"mc","q":"36. Warum hat RAID 5 im Vergleich zu RAID 0 meist eine geringere Schreibleistung?","options":["Paritätsinformationen müssen zusätzlich berechnet und geschrieben werden","Jeder Schreibvorgang wird ausschließlich über DNS bestätigt","RAID 5 verwendet nur einen einzelnen Datenträger","Die Daten werden immer über ein WAN übertragen"],"answer":"Paritätsinformationen müssen zusätzlich berechnet und geschrieben werden","exp":"Die Paritätsberechnung und zusätzlichen Schreiboperationen verursachen bei RAID 5 einen Write Penalty."},{"type":"mc","q":"37. Während des Rebuilds eines RAID 5 fällt ein weiterer Datenträger aus. Welche Folge ist zu erwarten?","options":["Das Array kann seine Daten verlieren","Das RAID wechselt automatisch zu RAID 6","Nur der DNS-Dienst fällt aus","Die Nettokapazität verdoppelt sich"],"answer":"Das Array kann seine Daten verlieren","exp":"RAID 5 toleriert nur einen Datenträgerausfall. Ein weiterer Ausfall während des Rebuilds kann zum Verlust des Arrays führen."},{"type":"mc","q":"38. Vier Datenträger mit jeweils 2 TB werden als RAID 5 betrieben. Wie groß ist die ungefähre Nettokapazität?","options":["6 TB","8 TB","4 TB","2 TB"],"answer":"6 TB","exp":"Bei RAID 5 ergibt sich die Nettokapazität vereinfacht aus (Anzahl der Datenträger minus 1) mal Kapazität: (4−1) × 2 TB = 6 TB."},{"type":"mc","q":"39. Vier Datenträger mit jeweils 2 TB werden als RAID 6 betrieben. Wie groß ist die ungefähre Nettokapazität?","options":["4 TB","8 TB","6 TB","2 TB"],"answer":"4 TB","exp":"Bei RAID 6 werden vereinfacht zwei Datenträgerkapazitäten für doppelte Parität benötigt: (4−2) × 2 TB = 4 TB."},{"type":"mc","q":"40. Vier Datenträger mit jeweils 2 TB werden als RAID 10 betrieben. Wie groß ist die ungefähre Nettokapazität?","options":["4 TB","8 TB","6 TB","2 TB"],"answer":"4 TB","exp":"Durch die Spiegelung steht bei RAID 10 ungefähr die Hälfte der gesamten Rohkapazität zur Verfügung."},{"type":"mc","q":"41. Wo werden die RAID-Berechnungen bei einem Hardware-RAID hauptsächlich ausgeführt?","options":["Auf einem eigenen RAID-Controller","Auf dem DNS-Server","Auf dem Switch","Auf jedem Client im Netzwerk"],"answer":"Auf einem eigenen RAID-Controller","exp":"Hardware-RAID verwendet einen speziellen Controller mit eigener Rechenleistung und häufig zusätzlichem Cache."},{"type":"mc","q":"42. Welche Aussage beschreibt Software-RAID korrekt?","options":["Das Betriebssystem verwaltet das RAID und nutzt die Server-CPU","Ein separater Controller übernimmt immer alle Berechnungen","Software-RAID ersetzt ein externes Backup","Software-RAID funktioniert nur mit zwei SSDs"],"answer":"Das Betriebssystem verwaltet das RAID und nutzt die Server-CPU","exp":"Software-RAID wird durch das Betriebssystem verwaltet und verwendet die Rechenleistung des Servers."},{"type":"mc","q":"43. Ein proprietärer Hardware-RAID-Controller fällt nach mehreren Jahren aus und ist nicht mehr verfügbar. Welches Problem kann entstehen?","options":["Das vorhandene Array lässt sich möglicherweise nur schwer auf einem anderen Controller wiederherstellen","Die MAC-Adressen aller Datenträger werden gelöscht","Das RAID erhält automatisch eine APIPA-Adresse","Die Datenträger wechseln selbstständig zu RAID 0"],"answer":"Das vorhandene Array lässt sich möglicherweise nur schwer auf einem anderen Controller wiederherstellen","exp":"Bei proprietären Hardware-RAID-Lösungen kann die Abhängigkeit vom Controller-Modell die Wiederherstellung oder Migration erschweren."},{"type":"mc","q":"44. Ein RAID-Controller puffert Schreibdaten in einem flüchtigen Cache. Welche Technik schützt diese Daten bei einem plötzlichen Stromausfall?","options":["BBU oder Flash-Backed Write Cache","DHCP-Relay","Port Mirroring","Spanning Tree Protocol"],"answer":"BBU oder Flash-Backed Write Cache","exp":"Eine Battery Backup Unit beziehungsweise ein Flash-Backed Write Cache sichert noch nicht geschriebene Cache-Daten bei Stromverlust."},{"type":"mc","q":"45. Welche Aussage über RAID und Backup ist richtig?","options":["RAID erhöht die Verfügbarkeit, ersetzt aber kein Backup","RAID schützt sicher vor versehentlichem Löschen","RAID verhindert jede Ransomware-Verschlüsselung","RAID macht Restore-Tests überflüssig"],"answer":"RAID erhöht die Verfügbarkeit, ersetzt aber kein Backup","exp":"RAID schützt vor bestimmten Datenträgerausfällen. Es schützt nicht zuverlässig vor Löschen, Malware, Fehlbedienung oder Standortverlust."},{"type":"mc","q":"46. Was enthält ein Vollbackup?","options":["Den vollständigen zu sichernden Datenbestand","Nur Änderungen seit der letzten beliebigen Sicherung","Nur Änderungen seit dem letzten Vollbackup","Nur die RAID-Paritätsinformationen"],"answer":"Den vollständigen zu sichernden Datenbestand","exp":"Ein Vollbackup erstellt einen vollständigen Sicherungsstand der ausgewählten Daten."},{"type":"mc","q":"47. Was sichert ein inkrementelles Backup?","options":["Änderungen seit der letzten Sicherung unabhängig von deren Art","Immer den vollständigen Datenbestand","Änderungen seit dem letzten Vollbackup","Nur Dateien, die älter als einen Monat sind"],"answer":"Änderungen seit der letzten Sicherung unabhängig von deren Art","exp":"Ein inkrementelles Backup enthält alle Änderungen seit der unmittelbar vorherigen Sicherung."},{"type":"mc","q":"48. Was sichert ein differentielles Backup?","options":["Alle Änderungen seit dem letzten Vollbackup","Nur Änderungen seit dem letzten inkrementellen Backup","Immer den vollständigen Datenbestand","Nur Systemdateien des Betriebssystems"],"answer":"Alle Änderungen seit dem letzten Vollbackup","exp":"Differentiell bedeutet: Alle Änderungen werden relativ zum letzten Vollbackup gesichert."},{"type":"mc","q":"49. Sonntag wurde ein Vollbackup erstellt, Montag bis Mittwoch wurden inkrementelle Backups durchgeführt. Was wird für den Restore am Donnerstag benötigt?","options":["Das Vollbackup und alle inkrementellen Backups von Montag bis Mittwoch","Nur das inkrementelle Backup vom Mittwoch","Das Vollbackup und nur das inkrementelle Backup vom Mittwoch","Nur das Vollbackup vom Sonntag"],"answer":"Das Vollbackup und alle inkrementellen Backups von Montag bis Mittwoch","exp":"Für eine inkrementelle Wiederherstellung werden das letzte Vollbackup und sämtliche danach erstellten inkrementellen Sicherungen benötigt."},{"type":"mc","q":"50. Sonntag wurde ein Vollbackup erstellt, Montag bis Mittwoch wurden differentielle Backups durchgeführt. Was wird für den Restore am Donnerstag benötigt?","options":["Das Vollbackup und das letzte differentielle Backup vom Mittwoch","Alle differentiellen Backups von Montag bis Mittwoch","Nur das differentielle Backup vom Mittwoch","Das Vollbackup und alle inkrementellen Backups"],"answer":"Das Vollbackup und das letzte differentielle Backup vom Mittwoch","exp":"Das letzte differentielle Backup enthält bereits alle Änderungen seit dem Vollbackup. Daher werden nur diese beiden Sicherungsstände benötigt."},{"type":"mc","q":"51. Welche Backup-Methode benötigt im Alltag meist weniger Speicher, verursacht aber beim Restore eine längere Sicherungskette?","options":["Inkrementelles Backup","Differentielles Backup","Tägliches Vollbackup","RAID 1"],"answer":"Inkrementelles Backup","exp":"Inkrementelle Backups sichern nur die Änderungen seit der letzten Sicherung, benötigen beim Restore jedoch alle Glieder der Kette."},{"type":"mc","q":"52. Welche Backup-Methode benötigt im Zeitverlauf meist mehr Speicher als inkrementelle Sicherungen, lässt sich aber schneller wiederherstellen?","options":["Differentielles Backup","Inkrementelles Backup","RAID 0","Port Mirroring"],"answer":"Differentielles Backup","exp":"Für den Restore reichen das letzte Vollbackup und das letzte differentielle Backup. Die differentiellen Sicherungen wachsen jedoch bis zum nächsten Vollbackup an."},{"type":"mc","q":"53. Was beschreibt das RPO?","options":["Den maximal akzeptablen Datenverlust gemessen als Zeitraum","Die maximal akzeptable Wiederanlaufzeit","Die Lebensdauer eines Datenträgers","Die Geschwindigkeit eines Restore-Tests"],"answer":"Den maximal akzeptablen Datenverlust gemessen als Zeitraum","exp":"Das Recovery Point Objective legt fest, wie viel Datenverlust zeitlich höchstens akzeptiert wird."},{"type":"mc","q":"54. Was beschreibt das RTO?","options":["Die maximal akzeptable Zeit bis zur Wiederaufnahme des Betriebs","Den maximal akzeptablen Datenverlust","Die Aufbewahrungsdauer eines LTO-Bands","Die Nettokapazität eines RAID-Arrays"],"answer":"Die maximal akzeptable Zeit bis zur Wiederaufnahme des Betriebs","exp":"Das Recovery Time Objective definiert, wie schnell ein Dienst nach einem Ausfall wieder verfügbar sein muss."},{"type":"mc","q":"55. Ein Backup-Job meldet regelmäßig Erfolg. Welche Maßnahme weist tatsächlich nach, dass sich die Daten wiederherstellen lassen?","options":["Ein dokumentierter Restore-Test","Eine längere DHCP-Lease","Ein zusätzlicher VLAN-Tag","Ein höheres PoE-Budget"],"answer":"Ein dokumentierter Restore-Test","exp":"Nur ein Wiederherstellungstest prüft, ob Sicherungen vollständig, lesbar und praktisch nutzbar sind."},{"type":"mc","q":"56. Was bedeutet die 3-2-1-Regel für Backups?","options":["Drei Datenkopien, zwei unterschiedliche Medientypen und eine Kopie außerhalb des Standorts","Drei RAID-Level, zwei Controller und ein Switch","Drei Vollbackups täglich auf zwei Partitionen derselben Festplatte","Drei Cloud-Konten mit zwei Passwörtern und einer öffentlichen Freigabe"],"answer":"Drei Datenkopien, zwei unterschiedliche Medientypen und eine Kopie außerhalb des Standorts","exp":"Die 3-2-1-Regel reduziert gemeinsame Ausfallursachen durch mehrere Kopien, unterschiedliche Medien und eine externe Sicherung."},{"type":"mc","q":"57. Warum bietet ein offline in einem Tresor gelagertes LTO-Band einen starken Schutz gegen Ransomware?","options":["Es besitzt einen Air-Gap zur produktiven IT-Umgebung","Es verwendet automatisch RAID 6","Es wird durch einen DNS-Server geschützt","Es kann niemals physisch beschädigt werden"],"answer":"Es besitzt einen Air-Gap zur produktiven IT-Umgebung","exp":"Durch die physische Trennung kann Schadsoftware das offline gelagerte Medium nicht direkt erreichen oder verschlüsseln."},{"type":"mc","q":"58. Ein Unternehmen benötigt besonders schnelle Sicherungen und Wiederherstellungen im lokalen Netz. Welches Medium ist dafür typischerweise geeignet?","options":["Festplatten- oder NAS-System","Offline-LTO-Band im externen Tresor","Papierausdruck","Nur ein RAID-Controller-Cache"],"answer":"Festplatten- oder NAS-System","exp":"Festplatten und NAS-Systeme bieten schnellen direkten Zugriff und eignen sich gut für zeitnahe Sicherungen und Restores."},{"type":"mc","q":"59. Eine wichtige Datei wurde vor vier Monaten gelöscht, der Fehler wird aber erst heute bemerkt. Welches Konzept erhöht die Chance auf einen passenden alten Sicherungsstand?","options":["Generationenprinzip mit täglichen, wöchentlichen und monatlichen Ständen","Nur das gestrige inkrementelle Backup","Nur RAID 1 ohne externes Backup","Ein kurzes DHCP-Lease"],"answer":"Generationenprinzip mit täglichen, wöchentlichen und monatlichen Ständen","exp":"Das Generationenprinzip bewahrt Sicherungsstände über unterschiedliche Zeiträume auf und ermöglicht den Zugriff auf ältere Versionen."},{"type":"mc","q":"60. Welche Aussage beschreibt eine fachlich vollständige Backup-Strategie am besten?","options":["Backup-Methode, Medium, Aufbewahrung, RPO, RTO und Restore-Tests werden gemeinsam geplant","Ein RAID-System wird installiert und ersetzt alle weiteren Maßnahmen","Alle Sicherungen bleiben dauerhaft online auf demselben Server","Nur die erfolgreiche Meldung des Backup-Jobs wird dokumentiert"],"answer":"Backup-Methode, Medium, Aufbewahrung, RPO, RTO und Restore-Tests werden gemeinsam geplant","exp":"Eine belastbare Datensicherung berücksichtigt Sicherungsverfahren, geeignete Medien, Aufbewahrung, Wiederherstellungsziele und regelmäßige Tests."}]});

 const key=resumeKey(); if(!key||!currentTabelle)return;
 const store=readResumeStore();
 store[key]={currentQ,score,userAnswers,savedAt:Date.now()};
 localStorage.setItem(LF03_RESUME_KEY,JSON.stringify(store));
}
function restoreCurrentProgress(key,max){
 const x=readResumeStore()[key]; if(!x)return false;
 currentQ=Math.max(0,Math.min(Number(x.currentQ)||0,max-1));score=Number(x.score)||0;userAnswers=x.userAnswers||{};return true;

function startQuiz(id) {
 currentTabelle=tabellen.find(t=>t.id===id);
 if(!restoreCurrentProgress("table_"+id,currentTabelle.questions.length)){currentQ=0;score=0;userAnswers={}}

function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function showQuestion() {
    const qList = currentTabelle.questions;
    const q = qList[currentQ];
    
    const card = document.getElementById("quiz-card");
    card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <button class="back-btn" onclick="goToMenu()" style="margin:0;">⬅ Tabellen-Auswahl</button>
            <div id="progress" class="progress" style="margin:0;">Frage ${currentQ + 1} von ${qList.length}</div>
        </div>
        <h1>${currentTabelle.title}</h1>
        <div class="question-text" style="margin-top:15px;">${q.q}</div>
        <div id="question-body"></div>
        <div id="feedback-area"></div>
        <div style="display:flex; justify-content:space-between; margin-top:20px;">
            <button class="prev-btn" id="prev-btn" onclick="prevQuestion()" ${currentQ === 0 ? 'style="display:none;"' : ''}>⬅ Vorherige Frage</button>
            <button id="next-btn" onclick="nextQuestion()">Nächste Frage ➡</button>
        </div>
    `;

    const bodyContainer = document.getElementById("question-body");

    if (q.type === "match") {
        let matchHtml = `<div class="matching-container">`;
        q.pairs.forEach((pair, idx) => {
            let shuffledOpts = userAnswers[currentQ]?.shuffledOpts || shuffleArray(q.options);
            if (!userAnswers[currentQ]) {
                if (!userAnswers.shuffledMap) userAnswers.shuffledMap = {};
                userAnswers[currentQ] = { shuffledOpts: shuffledOpts, selected: {} };
            }
            matchHtml += `
                <div class="matching-row">
                    <span><strong>${pair.item}</strong></span>
                    <select id="match-select-${idx}" onchange="selectMatch(${idx})">
                        <option value="">-- Bitte wählen --</option>
            `;
            shuffledOpts.forEach(opt => {
                let sel = userAnswers[currentQ].selected[idx] === opt ? 'selected' : '';
                matchHtml += `<option value="${opt}" ${sel}>${opt}</option>`;
            });
            matchHtml += `</select></div>`;
        });
        matchHtml += `</div><button class="submit-btn" onclick="checkMatch()">Antworten prüfen</button>`;
        bodyContainer.innerHTML = matchHtml;

        if (userAnswers[currentQ]?.answered) {
            document.querySelectorAll(".matching-row select").forEach(select => {
                select.disabled = true;
            });
            const submitButton = document.querySelector(".matching-container + .submit-btn");
            if (submitButton) submitButton.style.display = "none";
            showFeedback(
                userAnswers[currentQ].isCorrect,
                userAnswers[currentQ].feedbackText
            );
            document.getElementById("next-btn").style.display = "inline-block";
        }
    } else {
        let shuffledOpts = userAnswers[currentQ]?.shuffledOpts || shuffleArray(q.options);
        if (!userAnswers[currentQ]) {
            userAnswers[currentQ] = { shuffledOpts: shuffledOpts, answered: false };
        }
        let html = `<div id="options-container">`;
        shuffledOpts.forEach((opt, idx) => {
            let extraClass = "";
            let disabled = userAnswers[currentQ].answered ? 'disabled' : '';
            if (userAnswers[currentQ].answered) {
                if (opt === q.answer) extraClass = " correct";
                else if (userAnswers[currentQ].selectedIndex === idx) extraClass = " incorrect";
            }
            html += `<button class="option${extraClass}" ${disabled} onclick="checkMC(${idx})">${opt}</button>`;
        });
        html += `</div>`;
        bodyContainer.innerHTML = html;

        if (userAnswers[currentQ].answered) {
            showFeedback(userAnswers[currentQ].isCorrect, userAnswers[currentQ].feedbackText);
            document.getElementById("next-btn").style.display = "inline-block";
        }
    }
}

function checkMC(selectedIndex) {
    if (userAnswers[currentQ].answered) return;
    const qList = currentTabelle.questions;
    const q = qList[currentQ];
    const selectedOption = userAnswers[currentQ].shuffledOpts[selectedIndex];
    const optionsBtns = document.querySelectorAll(".option");
    
    userAnswers[currentQ].answered = true;
    userAnswers[currentQ].selectedIndex = selectedIndex;

    optionsBtns.forEach(btn => btn.disabled = true);

    let isCorrect = (selectedOption === q.answer);
    userAnswers[currentQ].isCorrect = isCorrect;

    if (isCorrect) {
        optionsBtns[selectedIndex].classList.add("correct");
        score++;
        userAnswers[currentQ].feedbackText = `Richtig!\n\n${q.exp}`;
    } else {
        optionsBtns[selectedIndex].classList.add("incorrect");
        userAnswers[currentQ].shuffledOpts.forEach((opt, idx) => {
            if (opt === q.answer) {
                optionsBtns[idx].classList.add("correct");
            }
        });
        userAnswers[currentQ].feedbackText = `Falsch! Richtige Antwort: ${q.answer}\n\n${q.exp}`;
    }
    showFeedback(isCorrect, userAnswers[currentQ].feedbackText);
    document.getElementById("next-btn").style.display = "inline-block";
}

function selectMatch(idx) {
    const sel = document.getElementById(`match-select-${idx}`);
    userAnswers[currentQ].selected[idx] = sel.value;
}

function checkMatch() {
    if (userAnswers[currentQ].answered) return;
    const qList = currentTabelle.questions;
    const q = qList[currentQ];
    
    let allCorrect = true;
    q.pairs.forEach((pair, idx) => {
        if (userAnswers[currentQ].selected[idx] !== pair.target) {
            allCorrect = false;
        }
    });

    userAnswers[currentQ].answered = true;
    userAnswers[currentQ].isCorrect = allCorrect;

    if (allCorrect) {
        score++;
        userAnswers[currentQ].feedbackText = `Perfekt! Alle Zuordnungen sind korrekt.\n\n${q.exp}`;
    } else {
        let correctText = q.pairs.map(p => `• ${p.item} ➔ ${p.target}`).join("\n");
        userAnswers[currentQ].feedbackText = `Nicht ganz richtig. Die korrekte Zuordnung lautet:\n${correctText}\n\n${q.exp}`;
    }

    document.querySelectorAll(".matching-row select").forEach(select => {
        select.disabled = true;
    });
    const submitButton = document.querySelector(".matching-container + .submit-btn");
    if (submitButton) submitButton.style.display = "none";
    showFeedback(allCorrect, userAnswers[currentQ].feedbackText);
    document.getElementById("next-btn").style.display = "inline-block";
}

function showFeedback(isCorrect, text) {
    const feedback = document.getElementById("feedback-area");
    feedback.className = `feedback ${isCorrect ? 'feedback-correct' : 'feedback-incorrect'}`;
    
    const memeArray = isCorrect ? correctMemes : incorrectMemes;
    const randomMeme = memeArray[Math.floor(Math.random() * memeArray.length)] || "";

    feedback.innerHTML = `
        <div style="white-space: pre-line;">${text}</div>
        <div class="feedback-img">
            <img src="${randomMeme}" alt="Feedback GIF">
        </div>
    `;
}

function prevQuestion(){if(currentQ>0){currentQ--;saveCurrentProgress();showQuestion()}}

function nextQuestion(){currentQ++;if(currentQ<currentTabelle.questions.length){saveCurrentProgress();showQuestion()}else{finishQuiz()}}

function finishQuiz() {
    const qList = currentTabelle.questions;
    const passed = score >= (qList.length / 2);
    const imgSrc = passed ? correctMemes[0] : incorrectMemes[0];

    const card = document.getElementById("quiz-card");
    card.innerHTML = `
        <div id="score-board">
            <h2>Auswertung: ${currentTabelle.title}</h2>
            <p style="font-size: 1.3em;">Ergebnis: <strong>${score}</strong> von <strong>${qList.length}</strong> Punkten (${Math.round(score/qList.length*100)}%)</p>
            <div class="img-container">
                <img src="${imgSrc}" alt="Auswertungs-Bild">
            </div>
            <div class="meme-text">${passed ? 'Starke Leistung! Du hast diesen Bereich bestens gemeistert! 🎉' : 'Da gibt es noch Lücken. Schau dir die Erklärungen noch einmal an! 💪'}</div>
            
            <button class="submit-btn" onclick="clearCurrentProgress('table_'+currentTabelle.id);startQuiz(currentTabelle.id)" style="margin-top:15px;">Diese Tabelle wiederholen</button>
            <button class="back-btn" onclick="showMenu()" style="margin-top:15px;">Zur Tabellen-Auswahl</button>
        </div>
    `;
}

            </div>
            <canvas id="gameCanvas" width="800" height="400"></canvas>

let canvas, ctx;
let player = {};
let items = [];
let gameScore = 0;
let gameLives = 3;
let gameRunning = false;
let keys = {};

function initGameSession() {
    canvas = document.getElementById("gameCanvas");
    ctx = canvas.getContext("2d");
    
    player = {
        x: canvas.width / 2 - 40,
        y: canvas.height - 40,
        w: 80,
        h: 25,
        speed: 8,
        dx: 0
    };

    items = [];
    gameScore = 0;
    gameLives = 3;
    gameRunning = true;
    
    document.getElementById("start-game-btn").style.display = "none";

    window.addEventListener("keydown", handleKeyDown);
    window.addEventListener("keyup", handleKeyUp);
    canvas.addEventListener("mousemove", handleMouseMove);

    if (gameAnimId) cancelAnimationFrame(gameAnimId);
    loop();
}

function stopMiniGame() {
    gameRunning = false;
    window.removeEventListener("keydown", handleKeyDown);
    window.removeEventListener("keyup", handleKeyUp);
    if (gameAnimId) cancelAnimationFrame(gameAnimId);
}

function handleKeyDown(e) {
    if (e.key === "ArrowLeft") player.dx = -player.speed;
    if (e.key === "ArrowRight") player.dx = player.speed;
}

function handleKeyUp(e) {
    if (e.key === "ArrowLeft" && player.dx < 0) player.dx = 0;
    if (e.key === "ArrowRight" && player.dx > 0) player.dx = 0;
}

function handleMouseMove(e) {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    player.x = mouseX - player.w / 2;
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;
}

const itemTypes = [
    { text: "TCP", type: "good", color: "#28a745", points: 10 },
    { text: "DNS", type: "good", color: "#17a2b8", points: 10 },
    { text: "HTTP", type: "good", color: "#ffc107", points: 15 },
    { text: "VLAN", type: "good", color: "#6f42c1", points: 15 },
    { text: "DDoS", type: "bad", color: "#dc3545" },
    { text: "AWG-Fehler", type: "bad", color: "#dc3545" },
    { text: "Crosstalk", type: "bad", color: "#dc3545" }
];

function spawnItem() {
    if (!gameRunning) return;
    const template = itemTypes[Math.floor(Math.random() * itemTypes.length)];
    items.push({
        x: Math.random() * (canvas.width - 60),
        y: -30,
        w: 65,
        h: 30,
        speed: 2.5 + Math.random() * 2.5,
        ...template
    });
}

setInterval(() => {
    if (gameRunning) spawnItem();
}, 900);

function update() {
    if (!gameRunning) return;

    player.x += player.dx;
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

    for (let i = items.length - 1; i >= 0; i--) {
        let it = items[i];
        it.y += it.speed;

        // Çarpışma kontrolü (Switch / Router kutusu ile)
        if (
            it.x < player.x + player.w &&
            it.x + it.w > player.x &&
            it.y < player.y + player.h &&
            it.y + it.h > player.y
        ) {
            if (it.type === "good") {
                gameScore += it.points;
            } else {
                gameLives--;
                if (gameLives <= 0) {
                    gameRunning = false;
                }
            }
            items.splice(i, 1);
            continue;
        }

        // Ekran dışına çıkma
        if (it.y > canvas.height) {
            if (it.type === "good") {
                gameLives--; // kaçırılan iyi paket can götürür
                if (gameLives <= 0) {
                    gameRunning = false;
                }
            }
            items.splice(i, 1);
        }
    }

    document.getElementById("game-score").innerText = `Punkte: ${gameScore}`;
    document.getElementById("game-lives").innerText = `Leben: ${'❤️'.repeat(Math.max(0, gameLives))}`;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Arka plan çizgileri (Ağ matrisi efekti)
    ctx.strokeStyle = "#222";
    ctx.lineWidth = 1;
    for (let i = 0; i < canvas.width; i += 40) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
    }

    // Oyuncu (Switch / Router) Çizimi
    ctx.fillStyle = "#0056b3";
    ctx.shadowColor = "#0056b3";
    ctx.shadowBlur = 10;
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.shadowBlur = 0; // gölgelendirmeyi kapat
    
    ctx.fillStyle = "#fff";
    ctx.font = "bold 12px Segoe UI";
    ctx.textAlign = "center";
    ctx.fillText("SWITCH / AP", player.x + player.w / 2, player.y + 17);

    // Düşen Paketler
    items.forEach(it => {
        ctx.fillStyle = it.color;
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(it.x, it.y, it.w, it.h, 5) : ctx.rect(it.x, it.y, it.w, it.h);
        ctx.fill();
        
        ctx.fillStyle = "#fff";
        ctx.font = "bold 11px Segoe UI";
        ctx.textAlign = "center";
        ctx.fillText(it.text, it.x + it.w / 2, it.y + 20);
    });

    if (!gameRunning && canvas) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#fff";
        ctx.font = "bold 28px Segoe UI";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
        
        ctx.font = "18px Segoe UI";
        ctx.fillText(`Dein Endergebnis: ${gameScore} Punkte`, canvas.width / 2, canvas.height / 2 + 20);
        
        document.getElementById("start-game-btn").style.display = "inline-block";
        document.getElementById("start-game-btn").innerText = "Erneut spielen";
    }
}

function loop() {
    update();
    draw();
    if (gameRunning) {
        gameAnimId = requestAnimationFrame(loop);
    }
}

function pickOrder(btn,val){if(questSelected.includes(val))return;questSelected.push(val);btn.disabled=true;const s=document.getElementById('orderSlots');if(questSelected.length===1)s.innerHTML='';s.insertAdjacentHTML('beforeend',`<span class="order-chip">${questSelected.length}. ${val}</span>`)}
function checkOrder(){const t=questLevels[questLevel].tasks[questTask],ok=questSelected.length===t.items.length&&questSelected.every((x,i)=>x===t.items[i]);questResult(ok,t.e,`Richtige Reihenfolge: ${t.items.join(' → ')}`)}
function questAnswer(btn,idx){document.querySelectorAll('.quest-choice').forEach(b=>b.disabled=true);const t=questLevels[questLevel].tasks[questTask],ok=idx===t.c;btn.classList.add(ok?'good':'bad');document.querySelectorAll('.quest-choice').forEach(b=>{if(b.textContent===t.a[t.c])b.classList.add('good')});questResult(ok,t.e,`Richtige Lösung: ${t.a[t.c]}`)}
function questResult(ok,explain,solution){if(ok){questScore+=100+questStreak*20;questStreak++;xp+=15}else{questLives=Math.max(0,questLives-1);questStreak=0}localStorage.setItem('lf03xp',xp);saveQuest();document.getElementById('questFeedback').innerHTML=`<div class="quest-explain"><b>${ok?'✅ Richtig!':'❌ Noch nicht richtig.'}</b><br>${explain}${ok?'':`<br><b>${solution}</b>`}<br><button class="submit-btn" onclick="nextQuestTask()">${questTask+1<questLevels[questLevel].tasks.length?'Nächste Aufgabe ➡':'Mission abschließen 🏁'}</button></div>`}
function nextQuestTask(){questTask++;saveQuest();if(questTask<questLevels[questLevel].tasks.length)showQuestTask();else finishQuestLevel()}
function finishQuestLevel(){let l=questLevels[questLevel],card=document.getElementById('quiz-card');let d=questSaved();d[questLevel]=l.tasks.length;localStorage.setItem('lf03quest',JSON.stringify(d));card.innerHTML=`<div class="hero"><h1>Mission abgeschlossen!</h1><p>${l.title}: Du hast die wichtigsten Zusammenhänge dieses Themenbereichs praktisch angewendet.</p></div><div class="quest-medal">${questLives===3?'🥇':questLives===2?'🥈':'🥉'}</div><div class="quest-summary"><div><b>${questScore}</b><span>Quest-Punkte</span></div><div><b>${questLives}</b><span>Verbleibende Leben</span></div><div><b>${questStreak}</b><span>Letzte Serie</span></div></div><div class="quest-explain"><b>Merksatz:</b> Gute Fehlersuche beginnt bei der physischen Verbindung und arbeitet sich systematisch über IP-Konfiguration, Gateway, DNS und Dienste vor.</div><div style="text-align:center"><button class="submit-btn" onclick="showQuestMap()">Zur Missionskarte</button><button class="back-btn" onclick="beginQuest(${questLevel})">Mission wiederholen</button></div>`}
function resetQuest(){localStorage.removeItem('lf03quest');showQuestMap()}


/* ==================== SIMPLE PACKET SORT ==================== */
const sortCards=[
 {name:'ARP',icon:'🔎',cat:'local',why:'ARP findet im lokalen IPv4-Netz die MAC-Adresse zu einer bekannten IP-Adresse.'},
 {name:'DHCP',icon:'📨',cat:'local',why:'DHCP verteilt im lokalen Netz automatisch IP-Adresse, Subnetzmaske, Gateway und DNS-Server.'},
 {name:'VLAN',icon:'🧩',cat:'local',why:'Ein VLAN trennt ein lokales Switch-Netz in logische Broadcast-Bereiche.'},
 {name:'Switch',icon:'🔀',cat:'local',why:'Ein Switch verbindet Geräte im lokalen Netzwerk und arbeitet mit MAC-Adressen.'},
 {name:'PoE',icon:'⚡',cat:'local',why:'PoE versorgt Netzwerkgeräte über das Ethernet-Kabel mit Strom.'},
 {name:'HTTPS',icon:'🔒',cat:'internet',why:'HTTPS überträgt Webseiten verschlüsselt, normalerweise über TCP-Port 443.'},
 {name:'DNS',icon:'🌐',cat:'internet',why:'DNS löst Namen wie www.beispiel.de in IP-Adressen auf.'},
 {name:'NAT',icon:'🚪',cat:'internet',why:'NAT übersetzt private IP-Adressen am Router in eine öffentliche Adresse.'},
 {name:'Router',icon:'📡',cat:'internet',why:'Ein Router leitet Pakete zwischen unterschiedlichen IP-Netzen weiter.'},
 {name:'VPN',icon:'🛣️',cat:'internet',why:'Ein VPN schützt Daten auf dem Weg durch ein unsicheres öffentliches Netz.'},
 {name:'Malware',icon:'🦠',cat:'security',why:'Malware ist schädliche Software und muss erkannt oder blockiert werden.'},
 {name:'DDoS',icon:'🌊',cat:'security',why:'Ein DDoS-Angriff überlastet einen Dienst mit sehr vielen Anfragen.'},
 {name:'Phishing',icon:'🎣',cat:'security',why:'Phishing versucht Zugangsdaten durch Täuschung zu erbeuten.'},
 {name:'Firewall',icon:'🛡️',cat:'security',why:'Eine Firewall kontrolliert und filtert Netzwerkverbindungen nach Regeln.'},
 {name:'WPA3',icon:'🔐',cat:'security',why:'WPA3 schützt drahtlose Netzwerke mit moderner Authentifizierung und Verschlüsselung.'}
];
let sortDeck=[],sortIndex=0,sortScore=0,sortMistakes=0,sortDragging=null;
function startPacketSort(){sortDeck=shuffleArray([...sortCards]).slice(0,10);sortIndex=0;sortScore=0;sortMistakes=0;renderPacketSort()}
function renderPacketSort(){const card=document.getElementById('quiz-card');card.innerHTML=`<div class="sort-game"><div class="sort-header"><h1 style="color:white;margin:0">🖱️ Packet Sort</h1><p style="margin:7px 0 0">Ziehe die Karte mit der Maus in die richtige Kategorie.</p></div><div class="sort-stats"><div class="sort-stat"><b id="sortProgress">${sortIndex+1}/10</b><span>Karte</span></div><div class="sort-stat"><b id="sortScore">${sortScore}</b><span>Punkte</span></div><div class="sort-stat"><b id="sortErrors">${sortMistakes}</b><span>Fehler</span></div></div><div class="packet-stage"><div id="packetHolder"></div></div><div class="drop-zones"><div class="drop-zone local" data-cat="local"><div><span class="zicon">🖥️</span><b>Lokales Netzwerk</b><small>LAN, Geräte und lokale Protokolle</small></div></div><div class="drop-zone internet" data-cat="internet"><div><span class="zicon">🌐</span><b>Internet & Routing</b><small>Web, Router und externe Netze</small></div></div><div class="drop-zone security" data-cat="security"><div><span class="zicon">🛡️</span><b>Security</b><small>Angriffe und Schutzmaßnahmen</small></div></div><div id="sortFeedback" class="sort-feedback"><b>So geht es:</b> Karte anklicken, festhalten und in eine der drei Boxen ziehen.</div></div><div class="sort-controls"><button onclick="showMenu()">⬅ Hauptmenü</button><button onclick="startPacketSort()">Neu mischen</button><button onclick="showQuestMap()">Network Quest</button></div></div>`;showSortCard();setupSortZones()}
function showSortCard(){const h=document.getElementById('packetHolder');if(sortIndex>=sortDeck.length){finishPacketSort();return}const x=sortDeck[sortIndex];h.innerHTML=`<div class="packet-card" id="sortCard" draggable="true"><span class="packet-icon">${x.icon}</span><b>${x.name}</b><small>Wohin gehört diese Karte?</small></div>`;const c=document.getElementById('sortCard');c.addEventListener('dragstart',e=>{sortDragging=x;e.dataTransfer.setData('text/plain',x.cat);setTimeout(()=>c.style.opacity=.35,0)});c.addEventListener('dragend',()=>c.style.opacity=1);c.addEventListener('pointerdown',mobileDragStart)}
function setupSortZones(){document.querySelectorAll('.drop-zone').forEach(z=>{z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});z.addEventListener('dragleave',()=>z.classList.remove('over'));z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over');checkSortDrop(z.dataset.cat)})})}
function mobileDragStart(e){if(e.pointerType==='mouse')return;const c=e.currentTarget;c.setPointerCapture(e.pointerId);const move=ev=>{c.style.position='fixed';c.style.zIndex=1000;c.style.left=(ev.clientX-c.offsetWidth/2)+'px';c.style.top=(ev.clientY-c.offsetHeight/2)+'px'};const up=ev=>{c.releasePointerCapture(e.pointerId);c.removeEventListener('pointermove',move);c.removeEventListener('pointerup',up);const el=document.elementFromPoint(ev.clientX,ev.clientY);const zone=el?.closest('.drop-zone');c.style.position='';c.style.zIndex='';c.style.left='';c.style.top='';if(zone)checkSortDrop(zone.dataset.cat)};c.addEventListener('pointermove',move);c.addEventListener('pointerup',up)}
function checkSortDrop(cat){const x=sortDeck[sortIndex],f=document.getElementById('sortFeedback');if(cat===x.cat){sortScore+=10;f.className='sort-feedback ok';f.innerHTML=`<b>✅ Richtig: ${x.name}</b><br>${x.why}`;sortIndex++;document.getElementById('sortScore').textContent=sortScore;setTimeout(()=>{if(sortIndex<sortDeck.length){document.getElementById('sortProgress').textContent=(sortIndex+1)+'/10';showSortCard()}else finishPacketSort()},900)}else{sortMistakes++;f.className='sort-feedback no';const names={local:'Lokales Netzwerk',internet:'Internet & Routing',security:'Security'};f.innerHTML=`<b>❌ Noch einmal versuchen.</b><br>${x.name} gehört zu <b>${names[x.cat]}</b>.`;document.getElementById('sortErrors').textContent=sortMistakes;const c=document.getElementById('sortCard');c.animate([{transform:'translateX(-10px)'},{transform:'translateX(10px)'},{transform:'translateX(0)'}],{duration:280})}}
function finishPacketSort(){const h=document.getElementById('packetHolder'),f=document.getElementById('sortFeedback'),pct=Math.round(sortScore/100*100);h.innerHTML=`<div class="packet-card" style="cursor:default"><span class="packet-icon">${pct>=80?'🏆':'👍'}</span><b>Spiel beendet</b><small>${sortScore} von 100 Punkten</small></div>`;f.className='sort-feedback ok';f.innerHTML=`<b>${pct>=80?'Sehr gut!':'Gut gemacht!'}</b><br>Du hast 10 Begriffe den drei Netzwerkbereichen zugeordnet. Mit „Neu mischen“ erscheinen andere Karten.`;document.getElementById('sortProgress').textContent='10/10'}

showMenu();

window.addEventListener("beforeunload", saveCurrentProgress);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveCurrentProgress(); });
</script>
