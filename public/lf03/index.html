            { type: "mc", q: "10. Welche Gefahren gehen von USV-Anlagen aus?", options: ["Hohe Ströme und gespeicherte elektrische Energie", "Ausschließlich DNS-Ausfälle im Rechenzentrum", "Nur langsame Internetverbindungen und Paketverluste", "Keine, da USV-Anlagen nur Daten verarbeiten"], answer: "Hohe Ströme und gespeicherte elektrische Energie", exp: "USV-Batterien können enorme Kurzschlussströme liefern und auch bei Netzausfall tödliche Spannungen führen." },
            { type: "mc", q: "11. Welche Topologie verwendet ein gemeinsames Übertragungsmedium (Shared Medium)?", options: ["Stern", "Bus", "Baum", "Vollvermaschung"], answer: "Bus", exp: "Beim Bus teilen sich alle Stationen exakt dieselbe physikalische Leitung." },
            { type: "mc", q: "12. Welche Topologie dominiert in modernen Büro-LANs?", options: ["Bus", "Ring", "Stern", "Vollvermaschung"], answer: "Stern", exp: "Moderne LANs nutzen strukturierte Sterntopologien mit zentralen Switches." },
            { type: "mc", q: "13. Welchen Vorteil hat eine Stern-Topologie mit Switch?", options: ["Ein Leitungsfehler bleibt meist auf einen Anschluss begrenzt.", "Ein zentrales Kopplungsgerät ist nicht erforderlich.", "Alle Endgeräte verwenden dieselbe Kollisionsdomäne.", "Die zulässige Kabellänge ist grundsätzlich unbegrenzt."], answer: "Ein Leitungsfehler bleibt meist auf einen Anschluss begrenzt.", exp: "Das Netz bleibt stabil, da Leitungsfehler isoliert am jeweiligen Port anliegen." },
            { type: "mc", q: "14. Welcher Nachteil besteht bei einer einfachen Stern-Topologie?", options: ["Der zentrale Switch kann den gesamten Stern beeinträchtigen.", "Jeder Client benötigt mehrere zusätzliche Netzwerkkarten.", "Als Übertragungsmedium ist ausschließlich Glasfaser möglich.", "In dieser Topologie können keine IP-Adressen genutzt werden."], answer: "Der zentrale Switch kann den gesamten Stern beeinträchtigen.", exp: "Fällt der Switch aus, bricht die Kommunikation des gesamten Sterns zusammen." },
            { type: "mc", q: "15. Wie viele direkte Verbindungen benötigt ein Full Mesh (Vollvermaschung) mit 10 Geräten?", options: ["10", "20", "45", "90"], answer: "45", exp: "Formel: n * (n - 1) / 2 = 10 * 9 / 2 = 45." },
            { type: "mc", q: "16. Ein Gebäude besitzt einen Core-Switch und pro Etage weitere Access-Switches. Welche Topologie liegt vor?", options: ["Bus", "Ring", "Baum", "Punkt-zu-Punkt"], answer: "Baum", exp: "Die hierarchische Vernetzung von Verteilerstrukturen bildet eine Baumstruktur." },
            { type: "mc", q: "17. Was beschreibt die physische Topologie?", options: ["Den tatsächlichen physischen Kabelverlauf", "Die logische IP-Adressvergabe im Netzwerk", "Die hierarchische DNS-Namensstruktur", "Die vergebenen Portnummern aller Dienste"], answer: "Den tatsächlichen physischen Kabelverlauf", exp: "Die physische Topologie zeigt, wie Kabel und Geräte im Raum real verkabelt sind." },
            { type: "mc", q: "18. Ein Netzwerk mit Hub ist physisch sternförmig. Wie arbeitet es logisch?", options: ["Wie ein Bus", "Wie ein Full Mesh", "Wie ein Router", "Wie ein VLAN-Trunk"], answer: "Wie ein Bus", exp: "Da ein Hub alle Signale an jeden Port weiterleitet, teilen sich alle physikalischen Stern-Arme logisch eine Kollisionsdomäne wie ein Bus." },
            { type: "match", q: "19. Zuordnung von Topologie und Eigenschaft:", pairs: [

                { item: "Baum", target: "Hierarchischer Aufbau" },
                { item: "Mesh", target: "Mehrere alternative redundante Wege" }

                "Gemeinsames Übertragungsmedium",
                "Zentrales Kopplungselement",
                "Hierarchischer Aufbau",
                "Mehrere alternative redundante Wege"

            { type: "mc", q: "20. Wofür steht die Netzwerk-Abkürzung PAN?", options: ["Personal Area Network", "Public Access Network", "Private Application Node", "Protocol Area Network"], answer: "Personal Area Network", exp: "Ein PAN ist ein persönliches Nahbereichsnetzwerk (z.B. per Bluetooth)." },
            { type: "mc", q: "21. Welches Beispiel beschreibt ein LAN?", options: ["Netzwerk innerhalb eines Bürogebäudes", "Bluetooth-Kopfhörer am Smartphone", "Weltweit verbundene Netze von Providern", "Satellitenverbindung zwischen Kontinenten"], answer: "Netzwerk innerhalb eines Bürogebäudes", exp: "Ein LAN (Local Area Network) deckt lokale Bereiche wie Büros oder Firmen ab." },
            { type: "mc", q: "22. Welche Aussage ist richtig?", options: ["Das Internet ist ein großes WAN.", "Jedes LAN ist automatisch ein WAN.", "PAN und WAN sind identisch.", "Ein WAN hat max. 10 Meter Reichweite."], answer: "Das Internet ist ein großes WAN.", exp: "Das Internet verbindet weltweite Netze und stellt das größte WAN dar." },
            { type: "match", q: "23. Zuordnung der Netzwerkgrößen:", pairs: [
                { item: "PAN", target: "Bluetooth-Verbindung im persönlichen Umfeld" },
                { item: "LAN", target: "Lokales Firmennetz im Gebäude" },
                { item: "WAN", target: "Verbindung räumlich getrennter weltweiter Standorte" }
            ], options: [
                "Bluetooth-Verbindung im persönlichen Umfeld",
                "Lokales Firmennetz im Gebäude",
                "Verbindung räumlich getrennter weltweiter Standorte"
            ], exp: "Klassifizierung nach geografischer Ausdehnung." },
            { type: "mc", q: "24. Welche Rolle fordert einen Netzwerkdienst an?", options: ["Client", "Server", "Switch", "Patchpanel"], answer: "Client", exp: "Clients initiieren Verbindungen und fordern Dienste an." },
            { type: "mc", q: "25. Welche Aussage zum Client-Server-Prinzip ist richtig?", options: ["Ein Gerät kann gleichzeitig beide Netzwerkrollen übernehmen.", "Ein Server muss grundsätzlich ein Großrechner im Rechenzentrum sein.", "Ein Client kann grundsätzlich keine eigenen Ressourcen bereitstellen.", "Die Netzwerkrolle wird allein durch die eingesetzte Hardware bestimmt."], answer: "Ein Gerät kann gleichzeitig beide Netzwerkrollen übernehmen.", exp: "In modernen Netzen agieren Rechner je nach Anwendung flexibel als Client oder Server." },
            { type: "mc", q: "26. Ein normaler Arbeitsplatz-PC stellt einen freigegebenen Ordner im Netz bereit. Welche Rolle übernimmt er primär?", options: ["Dateiserver", "DHCP-Relay", "Router", "DNS-Resolver"], answer: "Dateiserver", exp: "Durch das Bereitstellen von Ressourcen agiert der PC in diesem Moment als Server." },
            { type: "mc", q: "27. Was ist ein Netzwerkprotokoll?", options: ["Ein standardisiertes Kommunikationsregelwerk", "Ein spezieller Kabeltyp für Glasfasernetze", "Eine physische MAC-Adresse der Netzwerkkarte", "Eine grafische Benutzeroberfläche für Router"], answer: "Ein standardisiertes Kommunikationsregelwerk", exp: "Protokolle definieren Syntax, Semantik und Ablauf der Datenübertragung." },
            { type: "mc", q: "28. Wie viele Schichten besitzt das ISO/OSI-Referenzmodell?", options: ["4", "5", "7", "8"], answer: "7", exp: "Das OSI-Modell ist starr in 7 logische Schichten unterteilt." },
            { type: "mc", q: "29. Auf welcher OSI-Schicht arbeitet ein klassischer Hub?", options: ["Schicht 1", "Schicht 2", "Schicht 3", "Schicht 7"], answer: "Schicht 1", exp: "Ein Hub arbeitet rein auf Schicht 1 (Bitübertragungsschicht)." },
            { type: "mc", q: "30. Auf welcher OSI-Schicht arbeitet ein klassischer Ethernet-Switch?", options: ["Schicht 1", "Schicht 2", "Schicht 3", "Schicht 7"], answer: "Schicht 2", exp: "Switches werten MAC-Adressen auf Schicht 2 aus." },
            { type: "mc", q: "31. Welche Hauptaufgabe hat die OSI-Schicht 3?", options: ["Logische Adressierung und Routing", "Physische MAC-Adressierung im LAN", "Datendarstellung und Kompression", "Physische Bitübertragung über Leitungen"], answer: "Logische Adressierung und Routing", exp: "Schicht 3 ist für IP-Adressen und das Weiterleiten über Netzwerkkrenzen zuständig." },
            { type: "mc", q: "32. Auf welcher OSI-Schicht befinden sich TCP und UDP?", options: ["Anwendungsschicht", "Transportschicht", "Sicherungsschicht", "Bitübertragungsschicht"], answer: "Transportschicht", exp: "TCP und UDP regeln als Transportschicht-Protokolle die Datenabsicherung und Ports." },
            { type: "match", q: "33. Zuordnung von Geräten/Konzepten und OSI-Schichten:", pairs: [

            { type: "mc", q: "34. Wie wird das Hinzufügen von Headern beim Durchlaufen der Schichten nach unten genannt?", options: ["Kapselung", "Fragmentierung", "Authentifizierung", "Crosstalk"], answer: "Kapselung", exp: "Jede Schicht fügt ihre Protokollinformationen hinzu (Kapselung)." },
            { type: "mc", q: "35. Ein Client hat IP, aber Port 443 ist gesperrt. Auf welcher OSI-Schicht liegt das Problem?", options: ["Schicht 4", "Schicht 1", "Schicht 2", "Schicht 5"], answer: "Schicht 4", exp: "Ports gehören zur Transportschicht (Schicht 4)." },
            { type: "mc", q: "36. In welcher Reihenfolge erfolgt eine systematische Fehlersuche typischerweise?", options: ["Von unten nach oben", "Von oben nach unten", "In zufälliger Reihenfolge", "Nur auf Schicht 7"], answer: "Von unten nach oben", exp: "Man prüft zuerst die physische Verbindung (Kabel/Link), bevor man komplexe Dienste untersucht." },
            { type: "mc", q: "37. Wie viele Schichten besitzt das TCP/IP-Modell in der Praxis?", options: ["3", "4", "5", "7"], answer: "4", exp: "Das TCP/IP-Modell ist kompakter aufgebaut und umfasst 4 Schichten." },
            { type: "match", q: "38. Zuordnung der TCP/IP-Schichten zu Protokollen:", pairs: [

                "Ethernet und WLAN"
            ], exp: "Genaue Einordnung der Protokolle in das TCP/IP-Referenzmodell." },
            { type: "mc", q: "39. Welche OSI-Schichten werden im TCP/IP-Modell zur Anwendungsschicht zusammengefasst?", options: ["OSI 5, 6 und 7", "OSI 1, 2 und 3", "OSI 2, 3 und 4", "OSI 3, 4, 5 und 6"], answer: "OSI 5, 6 und 7", exp: "Die obersten drei OSI-Schichten bilden gemeinsam die TCP/IP-Anwendungsschicht." },
            { type: "mc", q: "40. Welche Aussage beschreibt den Unterschied zwischen OSI und TCP/IP richtig?", options: ["OSI ist ein Referenzmodell, TCP/IP wird praktisch eingesetzt.", "TCP/IP besitzt mehr logische Schichten als das OSI-Modell.", "Das OSI-Modell wird ausschließlich in drahtlosen Netzen verwendet.", "Das TCP/IP-Modell besitzt keine eigenständige Transportschicht."], answer: "OSI ist ein Referenzmodell, TCP/IP wird praktisch eingesetzt.", exp: "OSI dient als theoretischer Standard, während TCP/IP das reale Internet-Protokollfundament darstellt." },
            { type: "mc", q: "41. Welche Adresse arbeitet hauptsächlich auf Schicht 2?", options: ["MAC-Adresse", "IPv4-Adresse", "TCP-Port", "FQDN"], answer: "MAC-Adresse", exp: "Die MAC-Adresse ist die eindeutige Schicht-2-Hardwareadresse." },
            { type: "mc", q: "42. Wie lang ist eine klassische MAC-Adresse?", options: ["48 Bit", "32 Bit", "16 Bit", "128 Bit"], answer: "48 Bit", exp: "MAC-Adressen sind 48 Bit lang (6 Bytes)." },
            { type: "mc", q: "43. Welcher Teil einer MAC-Adresse kennzeichnet die OUI (Herstellerkennung)?", options: ["Die ersten 3 Bytes", "Die letzten 3 Bytes", "Die gesamte Adresse", "Der EtherType"], answer: "Die ersten 3 Bytes", exp: "Die IEEE vergibt die ersten drei Bytes als eindeutige Hersteller-OUI." },
            { type: "mc", q: "44. Mit welchem Befehl wird unter Windows die MAC-Adresse angezeigt?", options: ["ipconfig /all", "tracert www.test.de", "route delete 0.0.0.0", "ping -a 127.0.0.1"], answer: "ipconfig /all", exp: "'ipconfig /all' listet die physikalische Adresse (MAC) samt Netzwerkinformationen auf." },
            { type: "mc", q: "45. Was ist ein Ethernet-Frame?", options: ["Die Dateneinheit der Sicherungsschicht", "Eine Zone der DNS-Namensauflösung", "Eine Tabelle der Routing-Einträge im Router", "Ein Spannungswert auf dem Kabel"], answer: "Die Dateneinheit der Sicherungsschicht", exp: "Daten werden auf Schicht 2 in Frames gekapselt." },
            { type: "match", q: "46. Zuordnung der Ethernet-Frame-Komponenten:", pairs: [

                "Prüfsumme zur Fehlererkennung"

            { type: "mc", q: "47. Wie groß ist die Standard-MTU bei Ethernet?", options: ["1500 Byte", "512 Byte", "9000 Byte", "64 Byte"], answer: "1500 Byte", exp: "Die Standard-Nutzlast (MTU) eines Ethernet-Frames beträgt 1500 Bytes." },
            { type: "mc", q: "48. Welches Feld im Ethernet-Frame verwendet CRC-32 zur Fehlererkennung?", options: ["FCS", "Payload", "Präambel", "EtherType"], answer: "FCS", exp: "Die Frame Check Sequence sichert das Frame gegen Übertragungsfehler ab." },
            { type: "mc", q: "49. Welche Aufgabe hat die Präambel am Anfang des Ethernet-Frames?", options: ["Synchronisation des Empfängertakts", "Automatische IP-Vergabe an Clients", "Verschlüsselung der Nutzdaten im Frame", "VLAN-Zuordnung des Frames"], answer: "Synchronisation des Empfängertakts", exp: "Die Präambel synchronisiert die Takte von Sender und Empfänger." },
            { type: "mc", q: "50. Welcher EtherType kennzeichnet IPv4?", options: ["0x0800", "0x0806", "0x8100", "0x86DD"], answer: "0x0800", exp: "Der Hexadezimalwert 0x0800 steht für IPv4-Datenverkehr." }
        ]

        questions: [

            { type: "mc", q: "2. Welches Alltagsbeispiel entspricht Halbduplex?", options: ["Walkie-Talkie", "Telefonat", "Radio", "Glasfaser-Vollduplex"], answer: "Walkie-Talkie", exp: "Bei Halbduplex können zwar beide Stationen senden, aber nicht gleichzeitig auf derselben Frequenz/Leitung." },
            { type: "mc", q: "3. Warum wird CSMA/CD in modernen geswitchten Vollduplex-Netzen nicht benötigt?", options: ["Jeder Switch-Port bildet eine eigene Kollisionsdomäne.", "Es gibt in Switch-Netzen keine MAC-Adressen mehr.", "Switches arbeiten ausschließlich mit drahtlosen Verbindungen.", "Frames besitzen im Vollduplex keine Prüfsumme."], answer: "Jeder Switch-Port bildet eine eigene Kollisionsdomäne.", exp: "Durch getrennte Sende- und Empfangsleitungen im Vollduplex entstehen keine Kollisionen." },

            { type: "mc", q: "5. Wie arbeitet ein klassischer Hub?", options: ["Er wiederholt elektrische Signale an alle Ports.", "Er leitet Frames gezielt anhand der MAC-Adresse weiter.", "Er routet Pakete zwischen verschiedenen IP-Netzen.", "Er vergibt DHCP-Leases an alle Clients."], answer: "Er wiederholt elektrische Signale an alle Ports.", exp: "Ein Hub ist ein rein passiver Repeater auf Schicht 1." },
            { type: "mc", q: "6. Wie lernt ein Switch seine MAC-Adresstabelle?", options: ["Aus der Quell-MAC eingehender Frames", "Durch Abfrage beim zentralen DNS-Server", "Aus der Ziel-IP-Adresse der Pakete", "Nur manuell per Konsole des Admins"], answer: "Aus der Quell-MAC eingehender Frames", exp: "Ein Switch speichert die Absender-MAC und den Port, auf dem sie empfangen wurde." },
            { type: "mc", q: "7. Ein Switch kennt die Ziel-MAC eines Frames nicht. Was tut er?", options: ["Er flutet das Frame an alle Ports im selben VLAN.", "Er verwirft es grundsätzlich ohne Weiterleitung.", "Er schickt es zur Klärung an den Internetprovider.", "Er ändert die Ziel-IP-Adresse des Pakets."], answer: "Er flutet das Frame an alle Ports im selben VLAN.", exp: "Unbekannte Unicast-Frames werden als Notlösung an alle Ports des VLANs geflutet." },
            { type: "mc", q: "8. Welche MAC-Adresse kennzeichnet einen Ethernet-Broadcast?", options: ["FF:FF:FF:FF:FF:FF", "00:00:00:00:00:00", "127:00:00:00:00:01", "192.168.1.255"], answer: "FF:FF:FF:FF:FF:FF", exp: "Die FF:FF:FF:FF:FF:FF ist die universelle Broadcast-Zieladresse auf Schicht 2." },
            { type: "mc", q: "9. Welche Switching-Methode prüft das vollständige Frame inklusive FCS auf Fehler?", options: ["Store-and-Forward", "Cut-Through-Switching", "Simplex-Verfahren", "Fragment-Free-Switching"], answer: "Store-and-Forward", exp: "Store-and-Forward liest das gesamte Frame ein und prüft die CRC-Prüfsumme." },

            { type: "mc", q: "11. Wofür wird STP (Spanning Tree Protocol) verwendet?", options: ["Verhinderung von Netzwerkschleifen", "Auflösung von DNS-Namen in IP-Adressen", "Beschleunigung der IP-Vergabe", "Komprimierung von Ethernet-Frames"], answer: "Verhinderung von Netzwerkschleifen", exp: "STP blockiert redundante Switch-Pfade logisch, um Broadcast-Stürme zu verhindern." },
            { type: "mc", q: "12. Zwei Switch-Ports wurden versehentlich als Schleife verbunden. Was entsteht ohne STP?", options: ["Ein verheerender Broadcast-Sturm", "Eine abgelaufene DHCP-Lease am Switch", "Ein überfüllter DNS-Cache im Switch", "Der automatische APIPA-Modus"], answer: "Ein verheerender Broadcast-Sturm", exp: "Broadcasts kreisen endlos im Kreis und überlasten Switches und Leitungen vollständig." },
            { type: "mc", q: "13. Was bewirkt Link Aggregation (z.B. LACP)?", options: ["Mehrere Switchports bilden gemeinsam eine logische Verbindung.", "Ein physischer Port wird in mehrere IP-Schnittstellen aufgeteilt.", "Alle vorhandenen VLAN-Zuordnungen werden automatisch entfernt.", "Der lokale DNS-Zwischenspeicher wird dauerhaft vergrößert."], answer: "Mehrere Switchports bilden gemeinsam eine logische Verbindung.", exp: "Link Aggregation erhöht Bandbreite und Ausfallsicherheit zwischen Switches." },
            { type: "mc", q: "14. Wozu dient Port Mirroring?", options: ["Zum Spiegeln von Datenverkehr für Analyse- und Diagnosezwecke", "Zur Stromversorgung von Access Points, Kameras und IP-Telefonen", "Zur automatischen Vergabe von IP-Konfigurationen", "Zur Verschlüsselung des WLAN-Datenverkehrs"], answer: "Zum Spiegeln von Datenverkehr für Analyse- und Diagnosezwecke", exp: "Port Mirroring leitet den Verkehr eines Ports zu einem Analyse-Port (z.B. für Wireshark) um." },
            { type: "mc", q: "15. Aus wie vielen Adern besteht ein typisches Ethernet-Twisted-Pair-Kabel?", options: ["8 Adern", "2 Adern", "4 Adern", "16 Adern"], answer: "8 Adern", exp: "Standard-Ethernetkabel (RJ45) besitzen 4 verdrillte Adernpaare (8 Adern)." },
            { type: "mc", q: "16. Warum werden Adernpaare in Netzwerkkabeln verdrillt?", options: ["Um Störungen und elektromagnetisches Crosstalk zu reduzieren", "Um IP-Adressen direkt im Kabel zu speichern", "Um die Stromversorgung über PoE auf diesen Adernpaaren zu blockieren", "Um automatisch VLAN-Tags auf den Adern zu erzeugen"], answer: "Um Störungen und elektromagnetisches Crosstalk zu reduzieren", exp: "Das Verdrillen sorgt dafür, dass äußere Störfelder auf beide Adern gleich wirken und sich auslöschen." },

            { type: "mc", q: "19. Wie groß ist der typische Kerndurchmesser einer Singlemode-Glasfaser (OS2)?", options: ["9 µm", "50 µm", "62,5 mm", "125 mm"], answer: "9 µm", exp: "Singlemode hat einen sehr dünnen Kern (9 Mikrometer) für weite Distanzen per Laser." },
            { type: "mc", q: "20. Warum erreicht Singlemode größere Entfernungen als Multimode?", options: ["Es besitzt wesentlich weniger modale Dispersion", "Es verwendet dickere Kupferadern als Multimode", "Es sendet alle Daten ausschließlich per Broadcast", "Es benötigt grundsätzlich keine aktive Lichtquelle"], answer: "Es besitzt wesentlich weniger modale Dispersion", exp: "Da nur ein Lichtpfad (Mode) existiert, gibt es keine Laufzeitunterschiede durch Lichtreflexionen im Kern." },

            { type: "mc", q: "22. Was bedeutet Dämpfung in der Übertragungstechnik?", options: ["Die Abnahme der Signalstärke über die Streckenlänge", "Die Zunahme der Signalstärke über die Streckenlänge", "Die Auflösung von Namen in Adressen", "Die Änderung der MAC-Adresse im Frame"], answer: "Die Abnahme der Signalstärke über die Streckenlänge", exp: "Dämpfung beschreibt den Signalverlust in Dezibel (dB) auf dem Übertragungsmedium." },
            { type: "mc", q: "23. Was bedeutet ein hoher SNR-Wert (Signal-to-Noise Ratio)?", options: ["Das Verhältnis von Nutzsignal zu Rauschen ist günstig", "Das Störsignal ist stärker als das Nutzsignal", "Die gesamte Leitung ist physisch unterbrochen", "Es ist keine IP-Adresse vorhanden"], answer: "Das Verhältnis von Nutzsignal zu Rauschen ist günstig", exp: "Ein hoher SNR bedeutet sauberes Signal bei geringem Hintergrundrauschen." },
            { type: "mc", q: "24. Ein Kabel verläuft lange parallel neben einer 230V-Starkstromleitung. Welcher Effekt droht?", options: ["EMI", "NAT-Überlastung", "DNS-Ausfall", "APIPA"], answer: "EMI", exp: "Starkstromfelder induzieren Störspannungen in parallel laufende Datenkabel." },
            { type: "match", q: "25. Zuordnung von Gegenmaßnahmen gegen Störungen:", pairs: [

            { type: "mc", q: "26. Was ist Crosstalk (Nebensprechen)?", options: ["Gegenseitige elektromagnetische Beeinflussung benachbarter Aderpaare", "Kommunikation zwischen zwei Routern über eine Weitverkehrsstrecke hinweg", "Verschlüsselung der Daten im WLAN durch Schlüssel", "Routing zwischen mehreren VLANs auf einem Layer-3-Switch"], answer: "Gegenseitige elektromagnetische Beeinflussung benachbarter Aderpaare", exp: "Signale eines Aderpaares strahlen in benachbarte Paare ein (Crosstalk)." },
            { type: "mc", q: "27. Ein Verlegekabel wurde extrem stark geknickt. Welche Folge tritt auf?", options: ["Impedanzsprung und Signalreflexionen", "Ein automatisch vergrößerter DHCP-Pool", "Bessere Schirmung durch die Biegung", "Automatische VLAN-Trennung am Switch"], answer: "Impedanzsprung und Signalreflexionen", exp: "Knicken zerstört die geometrische Adernstruktur, was zu Dämpfung und Reflexionen führt." },
            { type: "mc", q: "28. Wie funktioniert differentielle Signalübertragung bei Twisted-Pair?", options: ["Zwei Leitungen übertragen Signale mit entgegengesetzter Polarität", "Es wird nur eine einzelne Leitung gegen Erde genutzt", "Jedes Paket wird zur Sicherheit doppelt über zwei Router geroutet", "Es wird ausschließlich ohne elektrische Spannung gearbeitet"], answer: "Zwei Leitungen übertragen Signale mit entgegengesetzter Polarität", exp: "Das Signal wird invertiert auf zwei Adern gesendet, um Störungen herauszufiltern." },
            { type: "mc", q: "29. Welche Größe wertet der Empfänger bei differentieller Übertragung aus?", options: ["Die Spannungsdifferenz zwischen den beiden Adern", "Die Summe beider IP-Adressen am Empfänger", "Die absolute Spannung einer einzelnen Ader gegen Erde", "Die VLAN-ID im Frame-Header"], answer: "Die Spannungsdifferenz zwischen den beiden Adern", exp: "Störungen wirken auf beide Adern gleich; die Differenzbildung blendet diese Gleichtaktstörungen aus." },
            { type: "mc", q: "30. Leitung A führt +6 V, Leitung B führt -6 V. Wie groß ist die Spannungsdifferenz?", options: ["12 V", "0 V", "6 V", "-12 V"], answer: "12 V", exp: "Differenz: (+6 V) - (-6 V) = 12 V." },
            { type: "mc", q: "31. Was ist eine Gleichtaktstörung (Common-Mode Noise)?", options: ["Eine Störung, die gleichartig auf beide Adern einer Leitung wirkt", "Eine falsche IP-Konfiguration auf dem Client", "Eine Störung, die ausschließlich durch defekte Stecker entsteht", "Eine Routing-Schleife zwischen zwei Routern"], answer: "Eine Störung, die gleichartig auf beide Adern einer Leitung wirkt", exp: "Äußere Felder induzieren in beide Adern dieselbe Störspannung." },
            { type: "mc", q: "32. Welche maximale Kanallänge gilt standardmäßig für Ethernet über Twisted-Pair (Channel Link)?", options: ["100 Meter", "10 Meter", "500 Meter", "1 Kilometer"], answer: "100 Meter", exp: "Die Maximallänge nach ISO/IEC 11801 beträgt 100 m (90m Verlegekabel + 10m Patchkabel)." },
            { type: "mc", q: "33. Was ist strukturierte Verkabelung?", options: ["Ein normiertes, anwendungsneutrales Konzept für Gebäudeverkabelung", "Ein herstellerspezifisches Kennwort für drahtlose Netzwerke", "Eine hierarchische Struktur zur Auflösung von Rechnernamen", "Eine Tabelle zur Übersetzung privater und öffentlicher Adressen"], answer: "Ein normiertes, anwendungsneutrales Konzept für Gebäudeverkabelung", exp: "Strukturierte Verkabelung schafft eine langlebige, herstellerunabhängige Infrastruktur nach EN 50173." },

            { type: "mc", q: "35. Welche Topologie wird in der strukturierten Verkabelung zwingend verwendet?", options: ["Hierarchische Stern- bzw. Baumtopologie", "Ein einfacher Bus mit gemeinsamem Kabel", "Ein unstrukturierter Ring ohne Hierarchie", "Vollvermaschung aller Verteiler untereinander"], answer: "Hierarchische Stern- bzw. Baumtopologie", exp: "Die Norm fordert strikt eine hierarchische Sterntopologie vom Verteiler zum Endgerät." },
            { type: "mc", q: "36. Was ist ein Patchpanel?", options: ["Eine passive Anschluss- und Rangierkomponente", "Ein aktiver Router mit eigener IP-Adresse", "Ein DHCP-Server zur Adressvergabe im LAN", "Ein aktiver WLAN-Access Point mit Funkantennen"], answer: "Eine passive Anschluss- und Rangierkomponente", exp: "Patchpanels sind passive Verteilerfelder, auf denen Verlegekabel aufgelegt werden." },
            { type: "mc", q: "37. Ein 24-Port-Patchpanel ist voll belegt, aber nicht mit einem Switch verbunden. Geht Datenverkehr?", options: ["Nein, das Patchpanel ist passiv und schaltet keine Daten aktiv", "Ja, das Patchpanel routet die Daten selbstständig zwischen den Ports", "Ja, die Daten laufen über den DNS-Dienst", "Nur wenn die Clients APIPA-Adressen besitzen"], answer: "Nein, das Patchpanel ist passiv und schaltet keine Daten aktiv", exp: "Da Patchpanels passiv sind, müssen sie zwingend mit aktiven Switch-Ports verbunden werden." },

            { type: "mc", q: "40. Was beschreibt der praktische Durchsatz (Throughput)?", options: ["Die praktisch erreichte Übertragungsrate unter realen Bedingungen", "Die theoretisch mögliche maximale Datenrate einer Verbindung", "Den verwendeten Leiterquerschnitt innerhalb eines Datenkabels", "Die elektrische Spannung auf den beteiligten Aderpaaren"], answer: "Die praktisch erreichte Übertragungsrate unter realen Bedingungen", exp: "Der Durchsatz liegt wegen Protokoll-Overhead und Last immer unter der Bandbreite." },
            { type: "mc", q: "41. Wie viele Bit entsprechen genau einem Byte?", options: ["8 Bit", "2 Bit", "4 Bit", "16 Bit"], answer: "8 Bit", exp: "1 Byte = 8 Bit." },
            { type: "mc", q: "42. Wie lange dauert die Übertragung von 1 Gigabyte (GB) bei 1 Gbit/s theoretisch (dezimal)?", options: ["8 Sekunden", "1 Sekunde", "80 Sekunden", "800 Sekunden"], answer: "8 Sekunden", exp: "1 GB = 8 Gbit. 8 Gbit / 1 Gbit/s = 8 Sekunden." },
            { type: "mc", q: "43. Welcher Standard ermöglicht 10 Gbit/s über Twisted-Pair-Kupfer bis 100 m?", options: ["10GBASE-T", "1000BASE-T", "10GBASE-SR", "IEEE 802.3af"], answer: "10GBASE-T", exp: "10GBASE-T überträgt 10 Gigabit über hochwertige Kupferkabel." },
            { type: "mc", q: "44. Welcher Standard nutzt Singlemode-Glasfaser für 10 Gbit/s über große Distanzen?", options: ["10GBASE-LR", "10GBASE-T", "1000BASE-T", "802.11n"], answer: "10GBASE-LR", exp: "10GBASE-LR (Long Range) ist für Singlemode-Glasfaser optimiert." },
            { type: "mc", q: "45. Wofür steht PoE (Power over Ethernet)?", options: ["Stromversorgung von Geräten direkt über das Netzwerkkabel", "Verschlüsselungsprotokoll für Netzwerkkabel", "Optimierung der Portgeschwindigkeit am Switch", "Überprüfung aller Datenpakete auf Übertragungsfehler im Netz"], answer: "Stromversorgung von Geräten direkt über das Netzwerkkabel", exp: "PoE transportiert Gleichstrom über freie oder genutzte Adernpaare des LAN-Kabels." },
            { type: "match", q: "46. Zuordnung der PoE-Standards und Leistungen:", pairs: [

            { type: "mc", q: "47. Was ist das PSE (Power Sourcing Equipment)?", options: ["Das Gerät, das PoE-Leistung bereitstellt", "Das über das Kabel mit Strom versorgte Endgerät", "Der DNS-Server für die Namensauflösung", "Die Netzwerkkarte im angeschlossenen Gerät"], answer: "Das Gerät, das PoE-Leistung bereitstellt", exp: "PSE speist den Strom ein, während das PD (Powered Device) ihn empfängt." },
            { type: "mc", q: "48. Was bedeutet PoE-Budget bei einem Switch?", options: ["Die gesamte verfügbare Leistung für alle PoE-Ports des Switches", "Die maximal konfigurierbare Anzahl logischer VLAN-Bereiche", "Die gesamten Anschaffungs- und Betriebskosten des PoE-Switches", "Die höchstens zulässige Länge aller angeschlossenen Netzwerkkabel"], answer: "Die gesamte verfügbare Leistung für alle PoE-Ports des Switches", exp: "Das PoE-Budget limitiert die Summe der Leistung aller angeschlossenen PoE-Geräte." },
            { type: "mc", q: "49. Ein PoE-Switch hat 150 W Budget. 6 Kameras benötigen je 20 W. Wie hoch ist die Reserve?", options: ["30 W", "10 W", "20 W", "50 W"], answer: "30 W", exp: "6 * 20 W = 120 W Verbrauch. 150 W - 120 W = 30 W Reserve." },
            { type: "mc", q: "50. Welcher Standard wird für eine Kamera benötigt, die am Endgerät 25 W verbraucht?", options: ["IEEE 802.3at", "IEEE 802.3af", "IEEE 802.1Q", "IEEE 802.3i"], answer: "IEEE 802.3at", exp: "Da 802.3af nur ca. 13W liefert, wird für 25W zwingend PoE+ (802.3at) benötigt." }

            { type: "mc", q: "6. Was macht NAT (Network Address Translation) am Router bei ausgehendem Verkehr?", options: ["Es übersetzt private Quelladressen in eine öffentliche Routeradresse", "Es übersetzt lokale Hardwareadressen direkt in vollständige DNS-Namen", "Es setzt für jedes IP-Paket automatisch einen passenden VLAN-Tag", "Es überprüft die Frame-Prüfsumme vor jeder Weiterleitung ins Internet"], answer: "Es übersetzt private Quelladressen in eine öffentliche Routeradresse", exp: "NAT ermöglicht die gemeinsame Internetnutzung privater IPs über eine öffentliche IP." },

            { type: "mc", q: "9. Welches Verfahren nutzt ein DHCP-Client ohne IP-Adresse zu Beginn seiner Suche?", options: ["Broadcast", "Unicast", "Anycast", "Nur Multicast"], answer: "Broadcast", exp: "Da der Client den Server noch nicht kennt, sendet er DHCP Discover als Broadcast." },
            { type: "mc", q: "10. Welche Aufgabe hat das Address Resolution Protocol (ARP)?", options: ["Ermittlung einer MAC-Adresse zu einer bekannten lokalen IP-Adresse", "Zuordnung von Portnummern zu Anwendungen auf dem Zielsystem im Netzwerk", "Verschlüsselung der Daten im drahtlosen Netzwerk", "Berechnung der Lebensdauer von IP-Paketen im Netz"], answer: "Ermittlung einer MAC-Adresse zu einer bekannten lokalen IP-Adresse", exp: "ARP schlägt die Brücke von Schicht 3 (IP) zu Schicht 2 (MAC)." },
            { type: "mc", q: "11. Das Ziel liegt im lokalen Netz. Wohin schickt der Client das Frame?", options: ["Direkt an die Ziel-MAC", "Immer an das Standardgateway", "An den DNS-Server im Netz", "An den Port des Dienstes"], answer: "Direkt an die Ziel-MAC", exp: "Im lokalen Netz wird direkt ohne Router kommuniziert." },
            { type: "mc", q: "12. Was ist ein Router-Hop?", options: ["Ein passierter Router auf dem Weg zum Ziel", "Ein Füllbyte im Padding-Feld des Frames", "Eine abgelaufene DHCP-Lease eines Clients", "Ein Schlüssel für den Zugang zum WLAN-Netzwerk"], answer: "Ein passierter Router auf dem Weg zum Ziel", exp: "Jeder Router auf dem Pfad stellt einen Hop dar." },

            { type: "mc", q: "14. Ein Paket erreicht TTL 0 an einem Router. Was passiert?", options: ["Der Router verwirft das Paket und sendet ICMP Time Exceeded", "Der Router erhöht die TTL auf 255 und leitet das Paket trotzdem weiter", "Der Router vergibt dem Absender eine APIPA-Adresse", "Das Paket wird als Broadcast an alle Hosts gesendet"], answer: "Der Router verwirft das Paket und sendet ICMP Time Exceeded", exp: "Abgelaufene Pakete werden verworfen und dem Absender gemeldet." },
            { type: "mc", q: "15. Welchen typischen TTL-Startwert verwendet Windows standardmäßig?", options: ["128", "64", "32", "255"], answer: "128", exp: "Windows startet standardmäßig mit TTL 128." },
            { type: "mc", q: "16. Welches Protokoll nutzt der Befehl 'ping'?", options: ["ICMP", "FTP", "SMTP", "ARP"], answer: "ICMP", exp: "Ping basiert auf ICMP Echo Request/Reply." },

            { type: "mc", q: "18. Was prüft 'ping 127.0.0.1' (Loopback) primär?", options: ["Den funktionierenden lokalen IP-Protokollstack", "Die Erreichbarkeit des Standardgateways", "Die Erreichbarkeit des Internet-DNS-Servers", "Die Verbindung zum angeschlossenen Switchport im LAN"], answer: "Den funktionierenden lokalen IP-Protokollstack", exp: "Loopback testet die netzwerkinternen Treiber des Betriebssystems." },
