            { type: "mc", q: "20. Wie macht tracert die einzelnen Hops sichtbar?", options: ["Durch schrittweise Erhöhung des TTL-Wertes", "Durch schrittweise Änderung der MAC-Adresse", "Durch Verschlüsselung der Pakete per WPA3", "Durch das Setzen unterschiedlicher VLAN-Tags"], answer: "Durch schrittweise Erhöhung des TTL-Wertes", exp: "Tracert sendet Pakete mit TTL 1, 2, 3 usw., um Router-Antworten zu triggern." },
            { type: "mc", q: "21. In einer Tracert-Ausgabe erscheint bei einem Hop '* * *', aber spätere Hops antworten. Was bedeutet das?", options: ["Dieser Router beantwortet die Diagnoseanfrage möglicherweise nicht", "Der gesamte weitere Netzwerkpfad zum Ziel ist dauerhaft unterbrochen", "Der sendende Client besitzt keine gültige IP-Konfiguration im Netz", "Die Adressübersetzung am lokalen Internetrouter ist vollständig deaktiviert"], answer: "Dieser Router beantwortet die Diagnoseanfrage möglicherweise nicht", exp: "Manche Router verwerfen Diagnisepakete aus Sicherheitsgründen, leiten den Verkehr aber normal weiter." },
            { type: "mc", q: "22. Welcher Hop ist im lokalen Netz normalerweise der erste?", options: ["Das Standardgateway", "Der Root-DNS-Server im Netz", "Der Zielserver im Internet", "Der DHCP-Server im LAN"], answer: "Das Standardgateway", exp: "Das Gateway ist der erste Router-Hop für den ausgehenden Verkehr." },
            { type: "mc", q: "23. Welcher Befehl zeigt unter Windows die grundlegende IP-Konfiguration?", options: ["ipconfig", "ifconfig", "route print", "vlan show"], answer: "ipconfig", exp: "'ipconfig' zeigt IP, Subnetzmaske und Standardgateway." },
            { type: "mc", q: "24. Welcher Befehl zeigt zusätzlich MAC-Adresse, DHCP-Status und DNS-Server?", options: ["ipconfig /all", "ping /all", "tracert /dns", "hostname /full"], answer: "ipconfig /all", exp: "Mit dem Parameter /all werden alle Detailinformationen angezeigt." },
            { type: "mc", q: "25. Welcher Befehl gibt die aktuelle DHCP-Lease unter Windows frei?", options: ["ipconfig /release", "ipconfig /flushdns", "ipconfig /displaydns", "route print -4"], answer: "ipconfig /release", exp: "Mit /release wird die IP-Adresse freigegeben." },
            { type: "mc", q: "26. Welcher Befehl fordert eine neue DHCP-Konfiguration an?", options: ["ipconfig /renew", "ipconfig /release", "netstat -a", "hostname"], answer: "ipconfig /renew", exp: "Mit /renew wird ein neuer DHCP-Abruf gestartet." },
            { type: "match", q: "27. Zuordnung von CLI-Diagnosebefehlen:", pairs: [
                { item: "nslookup", target: "DNS-Namensauflösung prüfen" },
                { item: "arp -a", target: "Lokale IP-MAC-Tabelle anzeigen" },
                { item: "route print", target: "Routing-Tabelle des PCs anzeigen" },
                { item: "netstat", target: "Aktive Netzwerkverbindungen und Ports anzeigen" }
            ], options: [
                "DNS-Namensauflösung prüfen",
                "Lokale IP-MAC-Tabelle anzeigen",
                "Routing-Tabelle des PCs anzeigen",
                "Aktive Netzwerkverbindungen und Ports anzeigen"
            ], exp: "Wichtige Werkzeuge für Administratoren in der Windows-Eingabeaufforderung." },
            { type: "mc", q: "28. Was beschreibt Vertraulichkeit?", options: ["Informationen sind ausschließlich für berechtigte Personen zugänglich", "Informationen sind bei Bedarf jederzeit vollständig und zuverlässig verfügbar", "Informationen bleiben während Speicherung und Übertragung vollständig unverändert", "Informationen stammen nachweisbar von einer authentischen und geprüften Quelle"], answer: "Informationen sind ausschließlich für berechtigte Personen zugänglich", exp: "Vertraulichkeit schützt Informationen vor unbefugter Einsicht und Nutzung. Typische Maßnahmen sind Zugriffsrechte, starke Authentifizierung und Verschlüsselung." },
            { type: "mc", q: "29. Welches Schutzziel wird durch heimlich geänderte Noten primär verletzt?", options: ["Integrität der gespeicherten Informationen", "Verfügbarkeit des eingesetzten Systems", "Vertraulichkeit der Benutzerkonten", "Authentizität des Netzwerkgeräts"], answer: "Integrität der gespeicherten Informationen", exp: "Die Noten wurden unbefugt verändert und sind deshalb nicht mehr korrekt und unverfälscht. Genau diese Eigenschaft beschreibt die Integrität." },
            { type: "mc", q: "30. Welches Schutzziel verletzt ein DDoS-bedingter Webshop-Ausfall primär?", options: ["Verfügbarkeit des angebotenen Dienstes", "Integrität der gespeicherten Kundendaten", "Authentizität des verwendeten Servers", "Verbindlichkeit der ausgeführten Aktion"], answer: "Verfügbarkeit des angebotenen Dienstes", exp: "Bei einem DDoS-Angriff steht die Nichterreichbarkeit im Mittelpunkt. Der Webshop kann von berechtigten Kunden nicht genutzt werden, deshalb ist primär die Verfügbarkeit betroffen." },
            { type: "mc", q: "31. Welches Schutzziel betrifft ein verlorener unverschlüsselter USB-Stick mit Gehaltsdaten?", options: ["Vertraulichkeit der gespeicherten Daten", "Verfügbarkeit der zentralen Anwendung", "Integrität der Netzwerkverbindung", "Verbindlichkeit einer Transaktion"], answer: "Vertraulichkeit der gespeicherten Daten", exp: "Unbefugte könnten die sensiblen Gehaltsdaten lesen. Verschlüsselung des Datenträgers hätte die Vertraulichkeit auch bei Verlust geschützt." },
            { type: "mc", q: "32. Was bedeutet Authentizität in der Informationssicherheit?", options: ["Identität oder Herkunft ist echt und überprüfbar", "Ein Dienst steht dauerhaft ohne Ausfall bereit", "Daten können nicht unbemerkt verändert werden", "Eine Aktion wird automatisch rückgängig gemacht"], answer: "Identität oder Herkunft ist echt und überprüfbar", exp: "Authentizität beantwortet die Frage, ob eine Person, ein Gerät, ein Server oder eine Nachricht wirklich die angegebene Identität beziehungsweise Herkunft besitzt." },
            { type: "mc", q: "33. Was beschreibt Verbindlichkeit beziehungsweise Nichtabstreitbarkeit?", options: ["Handlungen sind eindeutig zuordenbar und nachweisbar", "Dienste sind bei Bedarf durchgehend verfügbar", "Informationen sind nur verschlüsselt gespeichert", "Netzwerkgeräte besitzen eindeutige MAC-Adressen"], answer: "Handlungen sind eindeutig zuordenbar und nachweisbar", exp: "Verbindlichkeit sorgt dafür, dass Nachrichten, Transaktionen oder Aktionen einer Identität zugeordnet und später beweisbar nachvollzogen werden können." },
            { type: "mc", q: "34. Welche Maßnahme unterstützt besonders die Authentizität eines Webservers?", options: ["Prüfung eines vertrauenswürdigen TLS-Zertifikats", "Speicherung täglicher Sicherungskopien", "Erweiterung des verfügbaren DHCP-Pools", "Bündelung mehrerer physischer Switchports"], answer: "Prüfung eines vertrauenswürdigen TLS-Zertifikats", exp: "Ein gültiges TLS-Zertifikat hilft dem Client zu prüfen, ob er tatsächlich mit dem erwarteten Server kommuniziert. Es unterstützt damit die Authentizität." },
            { type: "mc", q: "35. Welche Maßnahme unterstützt besonders die Verbindlichkeit?", options: ["Digitale Signatur mit nachvollziehbarem Zeitstempel", "Redundanter Server mit automatischem Failover", "Verschlüsselter Datenträger ohne Protokollierung", "Kurze DHCP-Lease für wechselnde Endgeräte"], answer: "Digitale Signatur mit nachvollziehbarem Zeitstempel", exp: "Digitale Signaturen unterstützen den Nachweis von Urheber und unverändertem Inhalt. Ein vertrauenswürdiger Zeitstempel ergänzt den Nachweis um den Zeitpunkt." },
            { type: "mc", q: "36. Was unterscheidet Safety grundsätzlich von Security?", options: ["Safety betrachtet unbeabsichtigte Fehler und Unfälle", "Safety betrachtet ausschließlich gezielte Cyberangriffe", "Safety schützt nur vertrauliche Unternehmensdaten", "Safety beschreibt ausschließlich verschlüsselte Netze"], answer: "Safety betrachtet unbeabsichtigte Fehler und Unfälle", exp: "Safety richtet sich auf sichere Funktionen und unbeabsichtigte Fehler. Security befasst sich dagegen mit absichtlichen Angriffen, Manipulation, Sabotage und Datendiebstahl." },
            { type: "mc", q: "37. Ein fehlerhaftes Update legt ein Beatmungsgerät lahm. Wie wird der Vorfall eingeordnet?", options: ["Primär als Safety-Problem durch eine Fehlfunktion", "Primär als Security-Angriff durch einen Hacker", "Primär als DNS-Problem durch Namensauflösung", "Primär als VLAN-Problem durch falsches Tagging"], answer: "Primär als Safety-Problem durch eine Fehlfunktion", exp: "Im Szenario wird kein Angreifer beschrieben. Eine unbeabsichtigte technische Fehlfunktion gefährdet die sichere Funktion des Geräts und damit einen Menschen." },
            { type: "mc", q: "38. Ein Angreifer stiehlt gezielt Patientenakten aus einem Kliniknetz. Wie wird der Vorfall eingeordnet?", options: ["Primär als Security-Vorfall durch Datendiebstahl", "Primär als Safety-Vorfall durch Materialverschleiß", "Primär als DHCP-Fehler durch einen leeren Pool", "Primär als Verkabelungsfehler durch starke Dämpfung"], answer: "Primär als Security-Vorfall durch Datendiebstahl", exp: "Der externe Akteur handelt absichtlich und nutzt eine Schwachstelle. Der gezielte Zugriff verletzt insbesondere den Schutz und die Vertraulichkeit der Patientendaten." },
            { type: "mc", q: "39. Was bedeutet TOM im Datenschutz und in der IT-Sicherheit?", options: ["Technische und organisatorische Maßnahmen", "Temporäre und operative Netzwerkmethoden", "Transportorientierte und mobile Protokolle", "Teilautomatische und optionale Mechanismen"], answer: "Technische und organisatorische Maßnahmen", exp: "TOM verbindet technische Schutzmechanismen mit Regeln, Zuständigkeiten und Prozessen. Technik allein reicht nicht, wenn organisatorische Umsetzung und Kontrolle fehlen." },
            { type: "mc", q: "40. Was ist ein Standardgateway in einem IP-Netzwerk?", options: ["Die IP-Adresse des Routers für den Weg in fremde Netze", "Ein DNS-Server zur Auflösung von Hostnamen", "Die MAC-Adresse des lokalen Switches im LAN", "Ein Switchport, an dem der Client mit dem Netz verbunden ist"], answer: "Die IP-Adresse des Routers für den Weg in fremde Netze", exp: "Das Gateway ist die Router-Schnittstelle im lokalen LAN." },
            { type: "mc", q: "41. Ein Client erreicht lokale Rechner, aber kein Internet. Was prüfen Sie zuerst?", options: ["Ob das Standardgateway korrekt konfiguriert ist", "Die Farbe des Gehäuses am Switch im Serverraum", "Die Marke des verwendeten Patchkabels", "Ob der Monitor des Clients eingeschaltet ist"], answer: "Ob das Standardgateway korrekt konfiguriert ist", exp: "Fehlt das Gateway oder ist es falsch, ist keine Kommunikation außerhalb des LANs möglich." },
            { type: "mc", q: "42. Was ist NAT (Network Address Translation)?", options: ["Die Übersetzung von privaten IP-Adressen auf öffentliche IP-Adressen", "Ein Verschlüsselungsstandard für drahtlose Netzwerke", "Ein Dienst zur Auflösung von Namen in IP-Adressen", "Ein Verfahren zur Übersetzung von MAC-Adressen in öffentliche IP-Adressen"], answer: "Die Übersetzung von privaten IP-Adressen auf öffentliche IP-Adressen", exp: "NAT ermöglicht die weltweite Internetanbindung von Geräten mit privaten IP-Adressen." },
            { type: "mc", q: "43. Warum werden private IP-Adressen im Internet nicht geroutet?", options: ["Weil sie weltweit mehrfach in verschiedenen lokalen Netzen vergeben werden", "Weil sie zu viele Stellen für Router besitzen", "Weil sie ausschließlich für Glasfaserverbindungen in privaten Netzen gelten", "Weil Router sie laut Standard grundsätzlich blockieren müssen"], answer: "Weil sie weltweit mehrfach in verschiedenen lokalen Netzen vergeben werden", exp: "Öffentliche Router verwerfen private IPs, da diese nicht weltweit eindeutig sind." },
            { type: "mc", q: "44. Welches Protokoll löst MAC-Adressen zu bekannten IPv4-Adressen auf?", options: ["ARP", "DNS", "DHCP", "ICMP"], answer: "ARP", exp: "Das Address Resolution Protocol ermittelt die MAC zur IP im lokalen Netz." },
            { type: "mc", q: "45. Wie fragt ein Client nach einer MAC-Adresse per ARP?", options: ["Per Broadcast", "Per Unicast an den Router", "Per DNS-Abfrage", "Per DHCP-Request"], answer: "Per Broadcast", exp: "Der ARP Request wird als Broadcast an alle Hosts im LAN gesendet." },
            { type: "mc", q: "46. Wie antwortet das gesuchte Gerät auf einen ARP Request?", options: ["Per Unicast mit seiner MAC-Adresse", "Per Broadcast an alle Hosts im lokalen Netz", "Gar nicht, da ARP keine Antworten kennt", "Per Unicast über das Standardgateway"], answer: "Per Unicast mit seiner MAC-Adresse", exp: "Da der Fragende bekannt ist, antwortet das Ziel direkt per Unicast." },
            { type: "mc", q: "47. Was ist der ARP-Cache?",options: ["Ein temporärer Zwischenspeicher für IP-zu-MAC-Zuordnungen im Betriebssystem", "Eine Firewall-Regel zum Blockieren von Verbindungen", "Ein lokaler DNS-Server zur Auflösung von Hostnamen", "Ein dauerhaft gespeicherter Konfigurationsabschnitt für Switch-Ports im Netzwerk"], answer: "Ein temporärer Zwischenspeicher für IP-zu-MAC-Zuordnungen im Betriebssystem", exp: "Der ARP-Cache beschleunigt die Kommunikation, da MAC-Adressen nicht ständig neu erfragt werden müssen." },
            { type: "mc", q: "48. Was ist ARP-Spoofing?", options: ["Ein Angriff, bei dem ein Angreifer gefälschte ARP-Antworten sendet", "Ein Fehler bei der DHCP-Vergabe von IP-Adressen", "Eine Kabelstörung durch benachbarte Stromleitungen", "Ein Verfahren zum Setzen von VLAN-Tags auf Trunk-Ports im gesamten Netz"], answer: "Ein Angriff, bei dem ein Angreifer gefälschte ARP-Antworten sendet", exp: "Beim ARP-Spoofing täuscht ein Angreifer eine gefälschte MAC-Adresse vor, um Datenverkehr umzuleiten (Man-in-the-Middle)." },
            { type: "mc", q: "49. Welche OSI-Schicht verarbeitet IP-Pakete und Router?", options: ["Schicht 3", "Schicht 2", "Schicht 1", "Schicht 4"], answer: "Schicht 3", exp: "IP, Routing und ICMP arbeiten auf Schicht 3." },
            { type: "mc", q: "50. Ein Client hat eine statische IP, aber Subnetzmaske und Gateway passen nicht zusammen. Was passiert?", options: ["Kommunikation ins Internet und teilweise ins LAN schlägt fehl", "Alles funktioniert trotzdem ohne jede Einschränkung", "Die MAC-Adresse der Netzwerkkarte ändert sich automatisch", "Der Switch blockiert automatisch alle Ports des gesamten Netzes"], answer: "Kommunikation ins Internet und teilweise ins LAN schlägt fehl", exp: "Falsche Subnetzmasken führen dazu, dass der Client das lokale Netz falsch interpretiert und das Gateway nicht erreicht." }
        ]
    },
    {
        id: 4,
        title: "Tabelle 4: VLAN, PoE, DHCP, DNS, CLI & Protokolle",
        desc: "VLAN, 802.1Q, DHCP (DORA), DNS, TCP/UDP, Ports und CLI-Diagnosebefehle (50 Fragen).",
        questions: [
            { type: "mc", q: "1. Was ist ein VLAN (Virtual Local Area Network)?", options: ["Eine logische Aufteilung eines Switch-Netzes in getrennte Broadcast-Bereiche", "Eine physische Lichtwellenleiterverbindung zwischen mehreren Switch-Systemen", "Ein statischer Namenseintrag zur Auflösung eines vollständigen Hostnamens", "Ein Ethernet-Standard zur elektrischen Versorgung angeschlossener Endgeräte"], answer: "Eine logische Aufteilung eines Switch-Netzes in getrennte Broadcast-Bereiche", exp: "VLANs teilen Switches logisch auf, ohne dass neue Hardware nötig ist." },
            { type: "mc", q: "2. Welcher Standard definiert VLAN-Tags im Ethernet-Frame?", options: ["IEEE 802.1Q", "IEEE 802.3af", "IEEE 802.11ax", "RFC 1918"], answer: "IEEE 802.1Q", exp: "802.1Q fügt den 4-Byte VLAN-Tag hinzu." },
            { type: "mc", q: "3. Wie groß ist ein 802.1Q-VLAN-Tag?", options: ["4 Byte", "2 Byte", "6 Byte", "8 Byte"], answer: "4 Byte", exp: "Der Tag hat exakt 4 Bytes (TPID + TCI)." },
            { type: "mc", q: "4. Wie viele VLANs sind über die 12-Bit-VID praktisch nutzbar?", options: ["4094", "256", "1024", "65535"], answer: "4094", exp: "2^12 = 4096 abzüglich 0 und 4095 = 4094 nutzbare VLANs." },
            { type: "match", q: "5. Zuordnung von Switch-Port-Typen:", pairs: [
                { item: "Access Port", target: "Verbindung zu Endgeräten" },
                { item: "Trunk Port", target: "Verbindung zwischen Switches" }
            ], options: [
                "Verbindung zu Endgeräten",
                "Verbindung zwischen Switches"
            ], exp: "Access Ports bedienen Endclients, Trunk Ports leiten VLAN-übergreifende Daten weiter." },
            { type: "mc", q: "6. Was bedeutet PoE (Power over Ethernet)?", options: ["Stromversorgung von Netzwerkgeräten über das Datenkabel", "Optimierung der Portgeschwindigkeit am Switch", "Verschlüsselung der Daten auf dem Netzwerkkabel", "Überprüfung der Datenpakete auf Übertragungsfehler im LAN"], answer: "Stromversorgung von Netzwerkgeräten über das Datenkabel", exp: "PoE transportiert Strom und Daten über dieselben Adern." },
            { type: "match", q: "7. Zuordnung von PoE-Standards:", pairs: [
                { item: "IEEE 802.3af", target: "Bis zu 15,4 W" },
                { item: "IEEE 802.3at (PoE+)", target: "Bis zu 30 W" },
                { item: "IEEE 802.3bt (4PPoE)", target: "Bis zu 90 W über 4 Aderpaare" }
            ], options: [
                "Bis zu 15,4 W",
                "Bis zu 30 W",
                "Bis zu 90 W über 4 Aderpaare"
            ], exp: "Steigende Leistungsklassen im PoE-Bereich." },
            { type: "mc", q: "8. Was ist ein PSE (Power Sourcing Equipment)?", options: ["Das Gerät, das PoE-Strom bereitstellt", "Das angeschlossene Endgerät im Netz", "Der DNS-Server für die Namensauflösung", "Der Router zum Verbinden von IP-Netzen"], answer: "Das Gerät, das PoE-Strom bereitstellt", exp: "PSE speist ein, PD empfängt." },
            { type: "mc", q: "9. Wofür steht DHCP?", options: ["Dynamic Host Configuration Protocol", "Domain Host Configuration Protocol", "Dynamic Handling and Control Protocol", "Digital Host Connection Process"], answer: "Dynamic Host Configuration Protocol", exp: "DHCP verteilt automatisiert IP-Konfigurationen." },
            { type: "match", q: "10. Zuordnung der DORA-Schritte:", pairs: [
                { item: "Discover", target: "Client sucht im Netz nach einem DHCP-Server" },
                { item: "Offer", target: "Server bietet dem Client eine IP-Konfiguration an" },
                { item: "Request", target: "Client fordert die angebotene IP verbindlich an" },
                { item: "Acknowledge", target: "Server bestätigt die Zuweisung endgültig" }
            ], options: [
                "Client sucht im Netz nach einem DHCP-Server",
                "Server bietet dem Client eine IP-Konfiguration an",
                "Client fordert die angebotene IP verbindlich an",
                "Server bestätigt die Zuweisung endgültig"
            ], exp: "Vierphasiger DHCP-Vergabe-Prozess." },
            { type: "mc", q: "11. Welche Parameter kann DHCP an einen Client übermitteln?", options: ["IP-Adresse, Subnetzmaske, Gatewayadresse und zuständiger DNS-Server", "Nur die Hardwareadresse der verwendeten Netzwerkschnittstelle des Clients", "Nur die Portnummer des gewünschten Dienstes auf dem Zielsystem", "Nur den lokalen Rechnernamen ohne weitere Netzwerkkonfiguration"], answer: "IP-Adresse, Subnetzmaske, Gatewayadresse und zuständiger DNS-Server", exp: "DHCP liefert alle für die Netzwerkteilnahme notwendigen Parameter." },
            { type: "mc", q: "12. Welche UDP-Ports verwendet DHCP?", options: ["67 und 68", "20 und 21", "53 und 54", "80 und 443"], answer: "67 und 68", exp: "DHCP Server lauscht auf Port 67, Client auf Port 68." },
            { type: "mc", q: "13. Was ist eine DHCP-Lease?", options: ["Eine zeitlich befristete Ausleihe einer IP-Adresse", "Eine fest vergebene MAC-Adresse der Netzwerkkarte", "Ein VLAN-Trunk zwischen zwei Switches im Netz", "Ein dauerhaft gespeicherter WLAN-Schlüssel im Client"], answer: "Eine zeitlich befristete Ausleihe einer IP-Adresse", exp: "IP-Adressen werden via Lease für eine bestimmte Zeit an Clients vergeben." },
            { type: "mc", q: "14. Ein Client zeigt 169.254.x.x an. Was bedeutet das?", options: ["DHCP fehlgeschlagen, APIPA-Adresse aktiv", "Eine öffentliche IP-Adresse vom Provider", "Der DNS-Server läuft ohne Probleme", "VLAN 254 ist auf dem Switchport aktiv"], answer: "DHCP fehlgeschlagen, APIPA-Adresse aktiv", exp: "Ohne DHCP konfiguriert sich Windows selbst eine Link-Local-IP (APIPA)." },
            { type: "mc", q: "15. Warum ist mit APIPA normalerweise kein Internetzugriff möglich?", options: ["Weil APIPA nur lokal arbeitet und kein nutzbares Gateway bereitstellt", "Weil APIPA den gesamten TCP-Verkehr des Clients grundsätzlich blockiert", "Weil die physische Hardwareadresse der Netzwerkkarte automatisch gelöscht wird", "Weil alle Transportports des Betriebssystems automatisch geschlossen werden"], answer: "Weil APIPA nur lokal arbeitet und kein nutzbares Gateway bereitstellt", exp: "APIPA-Adressen werden von Routern nicht geroutet." },
            { type: "mc", q: "16. Wofür steht DNS?", options: ["Domain Name System", "Dynamic Network Switch", "Data Naming Service", "Digital Node Security"], answer: "Domain Name System", exp: "DNS löst Namen in IP-Adressen auf." },
            { type: "mc", q: "17. Was ist ein FQDN (Fully Qualified Domain Name)?", options: ["Der vollständige Name eines Hosts in der DNS-Hierarchie", "Nur der kurze Name des PCs ohne Domänenanteil", "Eine eindeutige MAC-Adresse der Netzwerkkarte", "Eine Portnummer, die einen bestimmten Dienst im Netz kennzeichnet"], answer: "Der vollständige Name eines Hosts in der DNS-Hierarchie", exp: "Beispiel: `client01.abteilung.firma.de` ist ein FQDN." },
            { type: "mc", q: "18. Ping 8.8.8.8 klappt, aber Webseiten-Aufruf per Name scheitert. Was ist die Ursache?", options: ["Ein DNS-Problem", "Ein kaputter TCP-Stack", "Ein defektes Kabel", "Falsche MAC"], answer: "Ein DNS-Problem", exp: "Da IP-Ping klappt, ist das Netz ok; es scheitert nur die Namensauflösung (DNS)." },
            { type: "mc", q: "19. Wo liegt die lokale hosts-Datei unter Windows?", options: ["C:\\Windows\\System32\\drivers\\etc\\hosts", "C:\\Windows\\System32\\dns\\server.txt", "C:\\Windows\\System32\\config\\hosts.ini", "C:\\Windows\\System32\\drivers\\hosts.dat"], answer: "C:\\Windows\\System32\\drivers\\etc\\hosts", exp: "Die hosts-Datei dient der statischen, lokalen Namensauflösung vor dem DNS-Abruf." },
            { type: "mc", q: "20. Welche Aussage zu TCP ist richtig?", options: ["TCP arbeitet verbindungsorientiert mit Bestätigung und Neuübertragung", "TCP überträgt Nutzdaten ohne vorherigen Aufbau einer Verbindung", "TCP sendet für empfangene Daten grundsätzlich keine Bestätigungen zurück", "TCP verwendet grundsätzlich keine Portnummern zur Dienstzuordnung"], answer: "TCP arbeitet verbindungsorientiert mit Bestätigung und Neuübertragung", exp: "TCP arbeitet zuverlässig mit Handshake, Sequenznummern und Bestätigungen." },
            { type: "mc", q: "21. Welche Aussage zu UDP ist richtig?", options: ["UDP arbeitet verbindungslos und sendet ohne Empfangsbestätigung", "UDP bestätigt jedes empfangene Paket mit einer Rückmeldung an den Sender", "UDP stellt die richtige Reihenfolge aller versendeten Pakete sicher", "UDP verwendet ausschließlich die bereits geöffneten Portnummern von TCP"], answer: "UDP arbeitet verbindungslos und sendet ohne Empfangsbestätigung", exp: "UDP verzichtet auf Overhead und eignet sich für Echtzeitdaten." },
            { type: "match", q: "22. Zuordnung des TCP 3-Way-Handshakes:", pairs: [
                { item: "1. Schritt", target: "SYN" },
                { item: "2. Schritt", target: "SYN-ACK" },
                { item: "3. Schritt", target: "ACK" }
            ], options: [
                "SYN",
                "SYN-ACK",
                "ACK"
            ], exp: "Logischer Ablauf des Verbindungsaufbaus bei TCP." },
            { type: "match", q: "23. Zuordnung von Diensten und Standard-Ports:", pairs: [
                { item: "HTTP", target: "Port 80" },
                { item: "HTTPS", target: "Port 443" },
                { item: "SSH", target: "Port 22" },
                { item: "DNS", target: "Port 53" },
                { item: "RDP", target: "Port 3389" }
            ], options: [
                "Port 80",
                "Port 443",
                "Port 22",
                "Port 53",
                "Port 3389"
            ], exp: "Bekannte Standardports (Well-Known Ports) für gängige Protokolle." },
            { type: "mc", q: "24. Welcher Portbereich wird als Well-Known Ports bezeichnet?", options: ["0 bis 1023", "1024 bis 49151", "49152 bis 65535", "65536+"], answer: "0 bis 1023", exp: "Die ersten 1024 Ports sind international für Standarddienste reserviert." },
            { type: "mc", q: "25. Welchen Zweck haben Ephemeral Ports (flüchtige Ports)?", options: ["Sie werden von Clients temporär für ausgehende Verbindungen genutzt", "Sie sind ausschließlich für den Dienst HTTP reserviert", "Sie speichern die MAC-Adressen aller Nachbargeräte", "Sie werden dauerhaft von Servern für eingehende Verbindungen genutzt"], answer: "Sie werden von Clients temporär für ausgehende Verbindungen genutzt", exp: "Clients nutzen hohe Portnummern (1024+) als temporäre Quellports." },
            { type: "mc", q: "26. Was bedeutet GUI?", options: ["Graphical User Interface", "General User Internet", "Gateway Update Interface", "Global Unicast Identifier"], answer: "Graphical User Interface", exp: "Grafische Benutzeroberfläche mit Fenstern und Mausbedienung." },
            { type: "mc", q: "27. Was beschreibt eine TUI?", options: ["Eine textbasierte, meist menügeführte Benutzeroberfläche", "Eine grafische Oberfläche mit Fenstern und Maus", "Eine Netzwerktopologie mit zentralem Verteiler", "Ein Transportprotokoll zur textbasierten Fernwartung von Servern"], answer: "Eine textbasierte, meist menügeführte Benutzeroberfläche", exp: "Text User Interface (z.B. Konsolenmenüs mit Rahmen)." },
            { type: "mc", q: "28. Warum bevorzugen Administratoren für die Netzwerkdiagnose oft die CLI?", options: ["Befehle und Ergebnisse lassen sich dokumentieren und automatisieren", "Die Oberfläche stellt Diagnoseergebnisse hauptsächlich als farbige Bilder dar", "Die Bedienung erfolgt grundsätzlich ohne Tastatur oder eingegebene Befehle", "Die langsamere Arbeitsweise verhindert mögliche Fehler bei der Administration"], answer: "Befehle und Ergebnisse lassen sich dokumentieren und automatisieren", exp: "Die CLI bietet exakte, skriptfähige und ressourcenschonende Diagnosemöglichkeiten." },
            { type: "mc", q: "29. Mit welchem Befehl wird die IP-Konfiguration unter Windows angezeigt?", options: ["ipconfig", "ifconfig", "ping", "route"], answer: "ipconfig", exp: "ipconfig ist der klassische Windows-Befehl für IP-Einstellungen." },
            { type: "mc", q: "30. Welcher Befehl zeigt die IP-Konfiguration unter Linux?", options: ["ip a oder ifconfig", "ipconfig oder winipcfg", "route print oder netsh", "ping oder tracert"], answer: "ip a oder ifconfig", exp: "Linux nutzt ip (iproute2) oder ifconfig." },
            { type: "mc", q: "31. Was ist ein Managed Switch?", options: ["Ein über Software konfigurierbarer Switch", "Ein Switch ohne eigene Stromversorgung", "Ein Hub mit mehreren Ports", "Ein passives Patchpanel mit RJ45-Anschlüssen"], answer: "Ein über Software konfigurierbarer Switch", exp: "Managed Switches erlauben VLANs, STP, Port-Security und Monitoring." },
            { type: "mc", q: "32. Was ist ein Unmanaged Switch?", options: ["Ein reiner Plug-and-Play Switch ohne Konfigurationsmöglichkeiten", "Ein Router mit mehreren Schnittstellen", "Ein Server mit eigener Netzwerkverwaltung", "Ein spezielles Kabel mit besonders hoher Schirmung für Switch-Verbindungen"], answer: "Ein reiner Plug-and-Play Switch ohne Konfigurationsmöglichkeiten", exp: "Unmanaged Switches arbeiten vollautomatisch ohne Management-Interface." },
            { type: "match", q: "33. Zuordnung der Switch-Typen und Einsatzbereiche:", pairs: [
                { item: "Unmanaged Switch", target: "Kleine Heimnetzwerke ohne Sicherheitsanforderungen" },
                { item: "Managed Switch", target: "Unternehmensnetze mit VLANs, Redundanz und Monitoring" }
            ], options: [
                "Kleine Heimnetzwerke ohne Sicherheitsanforderungen",
                "Unternehmensnetze mit VLANs, Redundanz und Monitoring"
            ], exp: "Unterscheidung nach Administrierbarkeit und Komplexität." },
            { type: "mc", q: "34. Welche Authentifizierung nutzt WPA2/3-Enterprise?", options: ["Individuelle Identitäten über 802.1X und RADIUS", "Gemeinsames Kennwort über einen einfachen PSK", "Automatische Adressen über DHCP und APIPA", "Lokale Namen über DNS und die hosts-Datei"], answer: "Individuelle Identitäten über 802.1X und RADIUS", exp: "Enterprise-WLAN verwendet IEEE 802.1X. Der Access Point arbeitet als Authenticator und leitet die Anmeldung an einen RADIUS-Server zur Prüfung weiter." },
            { type: "mc", q: "35. Was ist ein wesentlicher Nachteil von WPA2/3-Personal im Unternehmen?", options: ["Alle Nutzer teilen sich dasselbe WLAN-Kennwort", "Jedes Gerät benötigt ein eigenes Zertifikat", "Der Access Point kann keine Frames übertragen", "Der DHCP-Server vergibt keine IP-Adressen"], answer: "Alle Nutzer teilen sich dasselbe WLAN-Kennwort", exp: "Bei Personal teilen alle Beteiligten denselben PSK. Wird er bekannt oder soll einer Person der Zugang entzogen werden, muss das gemeinsame Kennwort für alle geändert werden." },
            { type: "mc", q: "36. Welche Rolle übernimmt der Access Point bei 802.1X?", options: ["Authenticator zwischen Client und RADIUS-Server", "Supplicant mit persönlicher Benutzeridentität", "DHCP-Server für die automatische Adressierung", "DNS-Resolver für die lokale Namensauflösung"], answer: "Authenticator zwischen Client und RADIUS-Server", exp: "Der Client ist der Supplicant, der Access Point der Authenticator und der RADIUS-Server der Authentication Server. Der Access Point vermittelt die Anmeldedaten." },
            { type: "mc", q: "37. Welche Verbesserung bietet WPA3-Personal gegenüber WPA2-Personal?", options: ["SAE erschwert aufgezeichnete Offline-Angriffe", "WEP ersetzt die bisherige AES-Verschlüsselung", "DHCP wird direkt in den Access Point integriert", "VLAN-Tags werden grundsätzlich nicht mehr benötigt"], answer: "SAE erschwert aufgezeichnete Offline-Angriffe", exp: "WPA3-Personal verwendet SAE statt des klassischen PSK-Verfahrens. Dadurch lässt sich ein aufgezeichneter Handshake nicht wie bei schwachen WPA2-Passwörtern einfach offline testen." },
            { type: "mc", q: "38. Warum sind Protected Management Frames bei WPA3 wichtig?", options: ["Sie erschweren gefälschte Deauthentifizierungsangriffe", "Sie erhöhen automatisch das gesamte PoE-Budget", "Sie ersetzen die Anmeldung über RADIUS vollständig", "Sie verteilen DNS-Server an alle WLAN-Clients"], answer: "Sie erschweren gefälschte Deauthentifizierungsangriffe", exp: "Management-Frames steuern unter anderem Verbindungsaufbau und Trennung. Ihr Schutz erschwert Angriffe, die Clients mit gefälschten Deauthentication-Frames aus dem WLAN werfen." },
            { type: "mc", q: "39. Was ist ein Asset in der IT-Sicherheit?", options: ["Ein schützenswerter Wert wie Daten oder Systeme", "Eine bekannte technische oder organisatorische Lücke", "Ein konkretes Werkzeug zur Ausnutzung einer Lücke", "Die Kombination aus Wahrscheinlichkeit und Schaden"], answer: "Ein schützenswerter Wert wie Daten oder Systeme", exp: "Assets sind alle Werte, die für eine Organisation wichtig sind. Dazu zählen nicht nur Geräte, sondern auch Daten, Geschäftsprozesse und Reputation." },
            { type: "mc", q: "40. Was ist eine Vulnerability?", options: ["Eine ausnutzbare technische oder organisatorische Schwachstelle", "Ein schützenswerter Wert innerhalb einer Organisation", "Ein Angreifer oder Ereignis mit möglichem Schadenspotenzial", "Die endgültige Bewertung aus Schaden und Wahrscheinlichkeit"], answer: "Eine ausnutzbare technische oder organisatorische Schwachstelle", exp: "Eine Vulnerability ist eine Lücke, ein Fehler oder eine unzureichende Schutzmaßnahme. Sie schafft den Ansatzpunkt für eine mögliche Ausnutzung." },
            { type: "mc", q: "41. Was beschreibt eine Threat?", options: ["Eine mögliche Gefahr oder einen schädigenden Akteur", "Eine ausschließlich materielle Unternehmensressource", "Ein Programm zur konkreten Ausnutzung einer Lücke", "Eine mathematisch berechnete DHCP-Lease-Dauer"], answer: "Eine mögliche Gefahr oder einen schädigenden Akteur", exp: "Eine Threat ist die mögliche Gefahr. Das kann ein krimineller Angreifer, Schadsoftware, Feuer oder ein anderes Ereignis sein, das ein Asset schädigen könnte." },
            { type: "mc", q: "42. Was ist ein Exploit?", options: ["Ein konkretes Mittel zur Ausnutzung einer Schwachstelle", "Ein Wert, der von einem Unternehmen geschützt wird", "Eine allgemeine Gefahr ohne konkretes Vorgehen", "Eine Bewertung aus Eintrittswahrscheinlichkeit und Schaden"], answer: "Ein konkretes Mittel zur Ausnutzung einer Schwachstelle", exp: "Ein Exploit ist beispielsweise Schadcode, ein Skript oder eine konkrete Vorgehensweise, die eine vorhandene Schwachstelle tatsächlich ausnutzt." },
            { type: "mc", q: "43. Was beschreibt ein Risiko?", options: ["Eintrittswahrscheinlichkeit zusammen mit möglichem Schaden", "Nur das eingesetzte Werkzeug eines Angreifers", "Nur die vorhandene Schwachstelle eines Systems", "Nur den materiellen Wert eines Netzwerkgeräts"], answer: "Eintrittswahrscheinlichkeit zusammen mit möglichem Schaden", exp: "Ein Risiko besteht nicht nur aus dem Schaden. Es berücksichtigt zusätzlich, wie wahrscheinlich das schädigende Ereignis unter den gegebenen Bedingungen eintritt." },
            { type: "mc", q: "44. Welche technische Maßnahme schützt Patientendaten auf dem Transportweg?", options: ["Verschlüsselte Übertragung mit TLS und Zertifikatsprüfung", "Längere DHCP-Leases für dauerhaft verbundene Clients", "Größere Broadcast-Domänen ohne Netzsegmentierung", "Ungeschirmte Leitungen direkt neben Stromleitungen"], answer: "Verschlüsselte Übertragung mit TLS und Zertifikatsprüfung", exp: "TLS schützt die Vertraulichkeit während der Übertragung. Die Zertifikatsprüfung unterstützt zusätzlich die Authentizität des angesprochenen Servers." },
            { type: "mc", q: "45. Welche Maßnahme unterstützt die Integrität medizinischer Befunde?", options: ["Manipulationsgeschützte Protokollierung jeder Änderung", "Kurze Lease-Zeiten für alle medizinischen Server", "Ein unverwalteter Switch ohne Überwachungsfunktion", "Gemeinsame Benutzerkonten für alle Beschäftigten"], answer: "Manipulationsgeschützte Protokollierung jeder Änderung", exp: "Audit-Logs erfassen Benutzerkonto, Zeitpunkt und Änderung. Zusammen mit Rollenrechten und regelmäßiger Kontrolle werden unberechtigte Veränderungen erkennbar." },
            { type: "mc", q: "46. Welche Maßnahme erhöht die Verfügbarkeit einer Datenbank?", options: ["Redundanter Server mit Replikation und Failover", "Ein einzelner Server ohne getestete Sicherung", "Gemeinsamer WLAN-Schlüssel für alle Beschäftigten", "Deaktivierte Überwachung zur Verringerung der Netzlast"], answer: "Redundanter Server mit Replikation und Failover", exp: "Redundanz verhindert, dass ein einzelner Hardwaredefekt den gesamten Dienst stoppt. Replikation, Failover, Monitoring und getestete Backups ergänzen den Schutz." },
            { type: "mc", q: "47. Welche Maßnahme ist organisatorisch?", options: ["Verbindlicher Notfallplan mit klaren Zuständigkeiten", "Verschlüsselung einer Verbindung mit TLS", "Redundanter Datenbankserver mit Replikation", "Firewall mit technisch definierten Filterregeln"], answer: "Verbindlicher Notfallplan mit klaren Zuständigkeiten", exp: "Organisatorische Maßnahmen regeln Menschen, Verantwortlichkeiten und Abläufe. Ein Notfallplan legt fest, wer bei einer Störung welche Schritte ausführt." },
            { type: "mc", q: "48. Warum müssen TOM regelmäßig überprüft werden?", options: ["Damit ihre Wirksamkeit bewertet und angepasst wird", "Damit alle Schutzmaßnahmen dauerhaft unverändert bleiben", "Damit technische Maßnahmen organisatorische Regeln ersetzen", "Damit auf Dokumentation vollständig verzichtet werden kann"], answer: "Damit ihre Wirksamkeit bewertet und angepasst wird", exp: "Schutzmaßnahmen müssen zur tatsächlichen Risikolage passen. Regelmäßige Kontrollen zeigen, ob sie funktionieren oder aufgrund neuer Risiken und Systeme angepasst werden müssen." },
            { type: "mc", q: "49. Welche Diagnose ist bei einer APIPA-Adresse zuerst sinnvoll?", options: ["Physische Verbindung und Erreichbarkeit von DHCP prüfen", "Sofort alle DNS-Einträge des Unternehmens löschen", "Den Client dauerhaft in ein zufälliges VLAN verschieben", "Die Netzwerkkarte ohne Dokumentation ersetzen"], answer: "Physische Verbindung und Erreichbarkeit von DHCP prüfen", exp: "APIPA ist ein Diagnosehinweis auf fehlende DHCP-Kommunikation. Deshalb werden zuerst Kabel, WLAN, Switch-Port, DHCP-Dienst, Pool, VLAN, Relay und Filter geprüft." },
            { type: "mc", q: "50. Was kennzeichnet eine fachgerechte Client-Integration?", options: ["Anbindung, gültige Konfiguration, Funktionstests und Dokumentation", "Nur die physische Verbindung ohne anschließende Funktionsprüfung", "Nur eine feste IP-Adresse ohne passende weitere Netzwerkparameter", "Nur ein erfolgreicher lokaler Test über die Loopback-Adresse"], answer: "Anbindung, gültige Konfiguration, Funktionstests und Dokumentation", exp: "Eine vollständige Integration umfasst die physische Anbindung, passende IP-Parameter, erfolgreiche Tests von Gateway, DNS und Diensten sowie eine nachvollziehbare Dokumentation." }
        ]
    },
    {
        id: 5,
        title: "Tabelle 5: Netzwerksicherheit, Firewalls, DMZ, VPN & BYOD",
        desc: "Erweitertes Sicherheitswissen mit 20 ausgewogenen Fragen zu Tag 11.",
        questions: [
            { type: "mc", q: "1. Wie setzt sich das Gesamtrisiko in der IT-Sicherheit zusammen?", options: ["Asset × Schwachstelle × Bedrohung","Nur durch die Anzahl aller dauerhaft geöffneten Netzwerkports","Bandbreite dividiert durch die gemessene Latenz einer Verbindung","Anzahl sämtlicher Clients im lokalen Unternehmensnetzwerk"], answer: "Asset × Schwachstelle × Bedrohung", exp: "Das Risiko ergibt sich aus dem Produkt von Wert des Assets, vorhandener Schwachstelle und Bedrohung." },
            { type: "mc", q: "2. Welches Schutzziel wird durch die Verwendung eines VPN-Tunnels primär angesprochen?", options: ["Vertraulichkeit","Ausfallsicherheit aller Server und Netzwerkkomponenten","Stromversorgung angeschlossener Geräte über Ethernet","Leistungssteigerung durch zusätzliche physische Leitungen"], answer: "Vertraulichkeit", exp: "Ein VPN schützt die Datenübertragung in unsicheren Netzen primär vor unbefugtem Mitlesen." },
            { type: "mc", q: "3. Was ist ein entscheidender Unterschied zwischen Full Tunnel und Split Tunnel?", options: ["Beim Full Tunnel läuft der gesamte Traffic durch den Tunnel.","Split Tunnel verschlüsselt grundsätzlich überhaupt keine übertragenen Daten.","Full Tunnel benötigt weder Anmeldung noch eine sichere Authentifizierung.","Zwischen beiden Verfahren gibt es technisch keinen messbaren Unterschied."], answer: "Beim Full Tunnel läuft der gesamte Traffic durch den Tunnel.", exp: "Full Tunnel leitet den gesamten Internetverkehr über das Firmennetz, während Split Tunnel den restlichen Traffic direkt ins Web leitet." },
            { type: "mc", q: "4. Welchen Zweck erfüllt eine DMZ (Demilitarisierte Zone) in einem Unternehmensnetz?", options: ["Sie trennt das öffentliche Internet vom sensiblen internen Netz durch Pufferung.","Sie ersetzt einen ausgefallenen zentralen Switch im Gebäudekeller vollständig.","Sie beschleunigt ausschließlich die lokale Namensauflösung des DNS-Servers.","Sie verteilt automatisch IP-Adressen an sämtliche mobilen Endgeräte im Unternehmen."], answer: "Sie trennt das öffentliche Internet vom sensiblen internen Netz durch Pufferung.", exp: "Öffentlich erreichbare Server stehen in der DMZ, um das interne Netz im Ernstfall zu schützen." },
            { type: "mc", q: "5. Warum sollten Webserver und sensible Datenbanken nicht ungeschützt im selben Netzwerksegment stehen?", options: ["Damit ein Angreifer nach einem Webserver-Einbruch nicht sofort Zugriff auf die Datenbank hat","Weil relationale Datenbanken grundsätzlich übermäßig viel elektrische Energie verbrauchen","Weil der Webserver andernfalls vom DHCP-Dienst keine gültige IP-Konfiguration erhält","Weil Datenbanksysteme ausschließlich über drahtlose WLAN-Verbindungen betrieben werden können"], answer: "Damit ein Angreifer nach einem Webserver-Einbruch nicht sofort Zugriff auf die Datenbank hat", exp: "Die Segmentierung erzwingt eine zweite Firewall-Barriere zwischen Webserver und Datenbank." },
            { type: "mc", q: "6. Wie unterscheidet sich eine Stateful Firewall von einem einfachen Paketfilter?", options: ["Sie speichert den Verbindungszustand und prüft den Kontext.","Sie arbeitet ohne Ausnahme ausschließlich auf der Anwendungsschicht des OSI-Modells.","Sie kann Filterentscheidungen vollständig ohne Quell- und Ziel-IP-Adressen treffen.","Sie entfernt nach jeder Prüfung automatisch sämtliche vorhandenen Protokolldateien."], answer: "Sie speichert den Verbindungszustand und prüft den Kontext.", exp: "Stateful Firewalls erkennen, ob ein Paket zu einer bestehenden, vom Client initiierten Verbindung gehört." },
            { type: "mc", q: "7. Was bedeutet das Konzept BYOD in modernen Firmenstrukturen?", options: ["Mitarbeiter nutzen private Geräte für geschäftliche Zwecke.","Unternehmen beschaffen ausschließlich bereits gebrauchte Hardware für ihre Beschäftigten.","Sämtliche klassischen Büroarbeitsplätze werden vollständig und dauerhaft abgeschafft.","Drucker und andere Peripheriegeräte werden ausschließlich über Bluetooth verbunden."], answer: "Mitarbeiter nutzen private Geräte für geschäftliche Zwecke.", exp: "Bring Your Own Device bringt Flexibilität, aber auch erhöhte Sicherheits- und Datenschutzrisiken mit sich." },
            { type: "mc", q: "8. Welches Werkzeug hilft Administratoren bei der Verwaltung und Absicherung von BYOD-Geräten?", options: ["MDM (Mobile Device Management)","Ein klassischer analoger Kabeltester zur Prüfung physischer Netzwerkleitungen","Ein herkömmlicher Hub ohne zentrale Verwaltungs- und Sicherheitsfunktionen","Ein passives 24-Port-Patchpanel für die strukturierte Gebäudeverkabelung"], answer: "MDM (Mobile Device Management)", exp: "MDM erlaubt die zentrale Richtlinienverwaltung, Apps-Kontrolle und Remote-Löschung von Firmendaten." },
            { type: "match", q: "9. Zuordnung von Sicherheitsbegriffen:", pairs: [
                { item: "Asset", target: "Schützenswertes Gut im Unternehmen" },
                { item: "Vulnerability", target: "Technische oder organisatorische Schwachstelle" },
                { item: "Threat", target: "Mögliche schädigende Bedrohung" },
                { item: "Exploit", target: "Konkretes Werkzeug zum Ausnutzen einer Lücke" }
            ], options: [
                "Schützenswertes Gut im Unternehmen",
                "Technische oder organisatorische Schwachstelle",
                "Mögliche schädigende Bedrohung",
                "Konkretes Werkzeug zum Ausnutzen einer Lücke"
            ], exp: "Grundbegriffe der IT-Sicherheitsanalyse." },
            { type: "mc", q: "10. Was versteht man unter Containerisierung auf mobilen Endgeräten?", options: ["Die strikte Trennung von privaten und dienstlichen Daten in geschützten Bereichen","Das physische Einschmelzen und Wiederverwerten beschädigter geschäftlicher Smartphones","Das gemeinsame Verpacken mehrerer Netzwerkkabel in geschlossenen Kabelkanälen","Die automatische Komprimierung sämtlicher Dateianhänge in geschäftlichen E-Mails"], answer: "Die strikte Trennung von privaten und dienstlichen Daten in geschützten Bereichen", exp: "Containerisierung verhindert das Abfließen geschäftlicher Daten in private Apps auf demselben Gerät." },
            { type: "mc", q: "11. Welche Maßnahme gehört zu den organisatorischen Schutzmaßnahmen (TOM)?", options: ["Erstellung verbindlicher Notfallpläne und Richtlinien","Vollständige Verschlüsselung einer lokalen Festplatte mithilfe von BitLocker","Technische Konfiguration einer Stateful Firewall mit mehreren Filterregeln","Installation eines zentral verwalteten Antivirenprogramms auf allen Endgeräten"], answer: "Erstellung verbindlicher Notfallpläne und Richtlinien", exp: "Organisatorische Maßnahmen regeln menschliches Verhalten, Prozesse und Verantwortlichkeiten." },
            { type: "mc", q: "12. Welcher Angriff nutzt gefälschte Absenderadressen in E-Mails aus?", options: ["Phishing","Elektromagnetisches Crosstalk zwischen benachbarten Kupfer-Adernpaaren","Automatische APIPA-Adressierung nach einer fehlgeschlagenen DHCP-Anfrage","Spanning Tree zur Vermeidung redundanter Schleifen in geswitchten Netzwerken"], answer: "Phishing", exp: "Phishing-Mails versuchen durch Täuschung an vertrauliche Zugangsdaten zu gelangen." },
            { type: "mc", q: "13. Was ist der Unterschied zwischen Safety und Security?", options: ["Safety schützt vor Unfällen/Fehlern, Security vor gezielten Angriffen.","Safety gilt ausschließlich für zentrale Server und Security ausschließlich für Netzwerkkabel.","Zwischen Safety und Security besteht inhaltlich grundsätzlich keinerlei fachlicher Unterschied.","Security behandelt ausschließlich ungeplante Unterbrechungen der elektrischen Stromversorgung."], answer: "Safety schützt vor Unfällen/Fehlern, Security vor gezielten Angriffen.", exp: "Safety = Betriebssicherheit/Fehlertoleranz; Security = Informationssicherheit/Angwehr." },
            { type: "mc", q: "14. Warum ist ein unverschlüsselter USB-Stick ein hohes Sicherheitsrisiko?", options: ["Bei Verlust sind sensible Daten sofort für Dritte einsehbar.","Der Datenträger verursacht beim Anschließen automatisch einen vollständigen Router-Absturz.","Er blockiert im lokalen Netzwerk dauerhaft sämtliche eingehenden DHCP-Anfragen.","Er wandelt eine moderne Ethernet-Infrastruktur selbstständig in ein Token-Ring-Netz um."], answer: "Bei Verlust sind sensible Daten sofort für Dritte einsehbar.", exp: "Fehlende Verschlüsselung verletzt direkt das Schutzziel der Vertraulichkeit." },
            { type: "mc", q: "15. Was bewirkt eine Drei-Port-Firewall in einer DMZ-Architektur?", options: ["Sie verbindet Internet, DMZ und internes Netz über drei getrennte Schnittstellen.","Sie aktiviert gleichzeitig drei voneinander unabhängige Funkkanäle für alle WLAN-Clients.","Sie verdreifacht automatisch die vertraglich bereitgestellte Geschwindigkeit des Internetproviders.","Sie koppelt drei verschiedene Etagenverteiler ohne weitere Geräte direkt per Glasfaser."], answer: "Sie verbindet Internet, DMZ und internes Netz über drei getrennte Schnittstellen.", exp: "Eine Firewall mit drei Interfaces reicht aus, um Zonen logisch und physisch zu trennen." },
            { type: "mc", q: "16. Was ist ein Site-to-Site-VPN?", options: ["Die dauerhafte Kopplung zweier ganzer Firmenstandorte","Die temporäre Einwahl eines einzelnen Beschäftigten aus dem Homeoffice in das Firmennetz","Eine direkte Kabelverbindung zwischen zwei Arbeitsplatz-PCs innerhalb desselben Büroraums","Ein öffentlich erreichbarer WLAN-Gastzugang für Besucherinnen und Besucher im Firmenfoyer"], answer: "Die dauerhafte Kopplung zweier ganzer Firmenstandorte", exp: "Site-to-Site verbindet Netzwerke, Client-to-Site verbindet einzelne Remote-Geräte." },
            { type: "mc", q: "17. Welcher Port wird von HTTPS standardmäßig für gesicherte Webaufrufe genutzt?", options: ["443","80 für grundsätzlich unverschlüsselte Aufrufe klassischer Webseiten","53 für die Auflösung von Domainnamen durch einen DNS-Dienst","22 für verschlüsselte Fernadministration mithilfe des SSH-Protokolls"], answer: "443", exp: "Port 443 ist der Standard für verschlüsselten HTTP-Verkehr (TLS)." },
            { type: "mc", q: "18. Was bedeutet Integrität in der IT-Sicherheit?", options: ["Daten sind unversehrt, korrekt und nachträglich nicht unbemerkt veränderbar.","Alle IT-Systeme und Dienste stehen rund um die Uhr ohne jede Unterbrechung zur Verfügung.","Sämtliche gespeicherten Informationen sind ausschließlich für ausdrücklich befugte Personen lesbar.","Jede ausgeführte Aktion lässt sich immer zweifelsfrei einer bestimmten Person zuordnen."], answer: "Daten sind unversehrt, korrekt und nachträglich nicht unbemerkt veränderbar.", exp: "Integrität schützt vor unbefugter oder versehentlicher Datenmanipulation." },
            { type: "mc", q: "19. Welches Protokoll wird auf Layer 3 für Fehlermeldungen und Diagnosen (wie Ping) eingesetzt?", options: ["ICMP","TCP als verbindungsorientiertes Transportprotokoll mit Empfangsbestätigungen","UDP als verbindungsloses Transportprotokoll ohne garantierte Zustellung","HTTP als Anwendungsprotokoll für die Übertragung klassischer Webseiten"], answer: "ICMP", exp: "ICMP (Internet Control Message Protocol) meldet Status- und Fehlerinformationen." },
            { type: "mc", q: "20. Warum sind VLANs allein keine vollständige Sicherheitsgrenze?", options: ["Da sie nur logisch trennen und für echten Schutz Firewall-Regeln nötig sind","Weil VLANs den elektrischen Energieverbrauch sämtlicher Switches erheblich und dauerhaft erhöhen","Weil VLANs die zulässige Länge jedes angeschlossenen Kupferkabels auf zehn Meter begrenzen","Weil VLANs ausschließlich zusammen mit technisch veralteten Hubs eingesetzt werden können"], answer: "Da sie nur logisch trennen und für echten Schutz Firewall-Regeln nötig sind", exp: "VLANs trennen Broadcast-Domänen, aber inter-VLAN Routing erfordert Firewall-Instanzen." }
        ]
    },
    {
        id: 6,
        title: "Tabelle 6: IHK Fachinformatiker AP1 / AP2 Szenario-Trainer",
        desc: "50 komplexe Praxis- und Prüfungsszenarien zu Netzwerken, Fehlersuche & Konfiguration.",
        questions: [
            { type: "mc", q: "1. Ein neuer Windows-Client zeigt nach dem Start die IP 169.254.12.34 und hat keinen Netzzugang. Was ist die wahrscheinlichste Ursache?", options: ["Der DHCP-Server ist nicht erreichbar, der Client hat sich eine APIPA-Adresse gegeben.", "Der Client hat eine feste IP im öffentlichen Internet-Bereich konfiguriert.", "Die Netzwerkkarte ist physisch beschädigt und defekt.", "Das Standardgateway blockiert den Zugriff auf den DHCP-Dienst."], answer: "Der DHCP-Server ist nicht erreichbar, der Client hat sich eine APIPA-Adresse gegeben.", exp: "169.254.x.x kennzeichnet den automatischen APIPA-Modus bei fehlendem DHCP." },
            { type: "mc", q: "2. Ein Admin tauscht ein beschädigtes Patchkabel aus. Welches Kabelpaar gehört nach TIA/568B standardmäßig auf Pin 1 und 2?", options: ["Weiß-Orange / Orange", "Weiß-Grün / Grün", "Weiß-Blau / Blau", "Weiß-Braun / Braun"], answer: "Weiß-Orange / Orange", exp: "Nach TIA/568B ist Pin 1/2 das orangefarbene Aderpaar." },
            { type: "mc", q: "3. Ein Webserver in der DMZ soll aus dem Internet erreichbar sein. Welche Ports müssen an Firewall 1 geöffnet werden?", options: ["80 (HTTP) und 443 (HTTPS)", "22 (SSH) und 3389 (RDP)", "67 und 68 (DHCP)", "53 (DNS) ausschließlich"], answer: "80 (HTTP) und 443 (HTTPS)", exp: "Webserverkommunikation läuft standardmäßig über Port 80 und 443." },
            { type: "mc", q: "4. Ein Client kann die IP-Adresse 8.8.8.8 erfolgreich anpingen, aber der Aufruf von 'www.heise.de' schlägt fehl. Welches Bauteil oder welcher Dienst ist gestört?", options: ["Der DNS-Server", "Das Standardgateway", "Der physische Switchport", "Die MAC-Adresse der Netzwerkkarte"], answer: "Der DNS-Server", exp: "Da IP-Pings funktionieren, ist die Routing-Verbindung intakt; es fehlt die Namensauflösung (DNS)." },
            { type: "mc", q: "5. In einem Unternehmen klagen mehrere Mitarbeiter über extrem langsames Netzwerk und Verbindungsabbrüche. Im Serverraum blinken alle LED-Anzeigen eines unmanaged Switches in rasender Eile im Kreis. Was ist passiert?", options: ["Es liegt eine Netzwerkschleife (Loop) ohne aktives STP vor.", "Der DHCP-Pool ist vollständig erschöpft.", "Die Festplatte des Routers ist voll.", "Ein Administrator führt einen normalen Port-Scan durch."], answer: "Es liegt eine Netzwerkschleife (Loop) ohne aktives STP vor.", exp: "Ohne STP erzeugen geschlossene Kabel-Schleifen einen Broadcast-Sturm, der das Netz lahmlegt." },
            { type: "mc", q: "6. Ein Techniker misst die Länge eines Permanent-Verlegekabels im Büro mit 115 Metern. Warum ist das problematisch?", options: ["Die maximale Channel-Link-Länge nach Norm beträgt 100 Meter.", "Das Kabel wandelt sich dadurch automatisch in Glasfaser um.", "Die IP-Adresse des Clients wird ungültig.", "Der PoE-Strom verdoppelt sich gefährlich."], answer: "Die maximale Channel-Link-Länge nach Norm beträgt 100 Meter.", exp: "Nach ISO/IEC 11801 beträgt die Maximallänge 90m Verlegekabel + 10m Patchkabel = 100m." },
            { type: "mc", q: "7. Welcher Befehl zeigt in der Windows-Eingabeaufforderung die aktive ARP-Tabelle an?", options: ["arp -a", "ipconfig /all", "route print", "netstat -r"], answer: "arp -a", exp: "'arp -a' listet alle bekannten IP-zu-MAC-Zuordnungen des lokalen Systems auf." },
            { type: "mc", q: "8. Ein IP-Paket mit einer TTL von 1 läuft über drei Router-Hops. Was passiert am ersten Router?", options: ["Die TTL sinkt auf 0, der Router verwirft das Paket und sendet ICMP Time Exceeded.", "Der Router erhöht die TTL eigenmächtig auf 128.", "Das Paket wird direkt als Broadcast an alle Clients verteilt.", "Der Router wandelt das Paket in ein Layer-2-Frame um."], answer: "Die TTL sinkt auf 0, der Router verwirft das Paket und sendet ICMP Time Exceeded.", exp: "Jeder Router dekrementiert die TTL um 1. Erreicht sie 0, wird das Paket verworfen." },
            { type: "mc", q: "9. Ein Switch-Port ist als 802.1Q-Trunk konfiguriert. Welche Hauptaufgabe hat dieser Port?", options: ["Er überträgt Datenverkehr für mehrere verschiedene VLANs gleichzeitig.", "Er schaltet die Stromversorgung (PoE) für IP-Telefone ab.", "Er verbindet einen einzelnen PC direkt mit dem Internet.", "Er filtert sämtlichen Broadcast-Verkehr im gesamten Netzwerk."], answer: "Er überträgt Datenverkehr für mehrere verschiedene VLANs gleichzeitig.", exp: "Trunk-Ports nutzen VLAN-Tags, um Frames verschiedener VLANs über eine Leitung zu leiten." },
            { type: "mc", q: "10. Ein Administrator möchte die Netzwerkkarten-Treiber auf einem Server aktualisieren, ohne den Server physisch zu berühren. Welches Protokoll und welcher Port bieten sich für eine sichere Fernwartung unter Linux an?", options: ["SSH auf Port 22", "Telnet auf Port 23", "FTP auf Port 21", "HTTP auf Port 80"], answer: "SSH auf Port 22", exp: "SSH (Secure Shell) ermöglicht verschlüsselte Remote-Konsolenzugriffe auf Port 22." },
            { type: "mc", q: "11. Wie groß ist die maximale Nutzlast (MTU) eines Standard-Ethernet-Frames ohne Jumboframes?", options: ["1500 Byte", "512 Byte", "9000 Byte", "64 Byte"], answer: "1500 Byte", exp: "Die Standard-MTU (Maximum Transmission Unit) im Ethernet beträgt 1500 Bytes." },
            { type: "mc", q: "12. Welcher Standard beschreibt Power over Ethernet mit bis zu 30 W Leistung am PSE-Port?", options: ["IEEE 802.3at (PoE+)", "IEEE 802.3af", "IEEE 802.3bt", "IEEE 802.1Q"], answer: "IEEE 802.3at (PoE+)", exp: "802.3af liefert ca. 15.4W, während PoE+ (802.3at) bis zu 30W bereitstellt." },
            { type: "mc", q: "13. Welcher Befehl eignet sich am besten, um zu prüfen, welche IP- und Port-Verbindungen ein Windows-PC aktuell aktiv hält?", options: ["netstat -ano", "ping 127.0.0.1", "arp -d", "hostname"], answer: "netstat -ano", exp: "'netstat -ano' zeigt alle aktiven TCP/UDP-Verbindungen inklusive Prozess-IDs." },
            { type: "mc", q: "14. Was ist ein klassisches Merkmal einer DoS-Attacke (Denial of Service)?", options: ["Überlastung eines Dienstes durch massenhafte künstliche Anfragen", "Verschlüsselung aller Festplatten gegen Lösegeld", "Unbemerktes Abhören von Passwörtern im WLAN", "Physikalische Zerstörung von Glasfaserkabeln"], answer: "Überlastung eines Dienstes durch massenhafte künstliche Anfragen", exp: "DoS-Angriffe zielen darauf ab, Server oder Netzwerke durch Ressourcenüberlastung lahmzulegen." },
            { type: "mc", q: "15. Ein Client im Subnetz 192.168.1.0/24 möchte Daten an 192.168.2.5 senden. Was macht der Client?", options: ["Er schickt das Paket an sein Standardgateway.", "Er sendet einen ARP-Request direkt an die Ziel-IP.", "Er leitet das Paket über den lokalen Access Point ohne Router weiter.", "Er verwirft das Paket sofort als ungültig."], answer: "Er schickt das Paket an sein Standardgateway.", exp: "Da sich das Ziel in einem anderen Subnetz befindet, ist ein Router (Gateway) zwingend erforderlich." },
            { type: "mc", q: "16. Welcher Dienst übersetzt private IP-Adressen in eine öffentliche IP-Adresse am Router?", options: ["NAT (Network Address Translation)", "DHCP (Dynamic Host Configuration Protocol)", "DNS (Domain Name System)", "ARP (Address Resolution Protocol)"], answer: "NAT (Network Address Translation)", exp: "NAT ermöglicht die Mehrfachnutzung privater IPs im Internet über offizielle Router-Adressen." },
            { type: "mc", q: "17. Was bewirkt der Befehl 'ipconfig /flushdns' unter Windows?", options: ["Er leert den lokalen DNS-Zwischenspeicher des Betriebssystems.", "Er löscht alle gespeicherten MAC-Adressen aus dem ARP-Cache.", "Er gibt die aktuelle DHCP-Lease beim Server frei.", "Er startet den Netzwerkadapter komplett neu."], answer: "Er leert den lokalen DNS-Zwischenspeicher des Betriebssystems.", exp: "Mit /flushdns werden veraltete oder fehlerhafte DNS-Einträge im Cache gelöscht." },
            { type: "mc", q: "18. Warum wird bei strukturierten Verkabelungen Twisted-Pair-Kabel verdrillt?", options: ["Zur Reduzierung elektromagnetischer Störungen und Übersprechen", "Um die maximale Kabellänge auf 500 Meter zu erhöhen", "Damit das Kabel flexibler um enge Ecken verlegt werden kann", "Um die Übertragungsgeschwindigkeit auf exakt 10 Gbit/s zu fixieren"], answer: "Zur Reduzierung elektromagnetischer Störungen und Übersprechen", exp: "Das Verdrillen neutralisiert äußere Einstreuungen durch die differentielle Auswertung." },
            { type: "mc", q: "19. Ein Administrator konfiguriert ein WLAN mit 802.1X und einem RADIUS-Server. Welche Vorteile hat das?", options: ["Jeder Nutzer authentifiziert sich mit eigener Kennung statt eines gemeinsamen Schlüssels.", "Es wird überhaupt kein Passwort mehr im gesamten Netzwerk benötigt.", "Der Access Point benötigt keinen Stromanschluss mehr.", "Die Datenübertragung wird auf Schicht 1 verschlüsselt."], answer: "Jeder Nutzer authentifiziert sich mit eigener Kennung statt eines gemeinsamen Schlüssels.", exp: "Enterprise-WLAN über 802.1X bietet individuelle Konten und höchste Sicherheit." },
            { type: "mc", q: "20. Welche Aufgabe hat die Präambel in einem Ethernet-Frame?", options: ["Synchronisation des Takts zwischen Sender und Empfänger", "Bestimmung des zuständigen VLANs im Switch", "Verschlüsselung der Nutzdaten gegen Mitlesen", "Prüfung des Frames auf CRC-Fehler"], answer: "Synchronisation des Takts zwischen Sender und Empfänger", exp: "Die 7 Byte lange Präambel bereitet den Empfänger auf den ankommenden Datenstrom vor." },
            { type: "mc", q: "21. Was ist ein wesentliches Kennzeichen eines Hubs im Vergleich zu einem Switch?", options: ["Ein Hub sendet empfangene Signale blind an alle Ports weiter.", "Ein Hub speichert MAC-Adressen in einer eigenen Tabelle.", "Ein Hub arbeitet auf Schicht 3 des OSI-Modells.", "Ein Hub unterstützt VLANs und Port-Security."], answer: "Ein Hub sendet empfangene Signale blind an alle Ports weiter.", exp: "Ein Hub ist ein reiner Layer-1-Repeater ohne intelligente Weiterleitung." },
            { type: "mc", q: "22. Welches Schutzziel wird verletzt, wenn ein Angreifer vertrauliche Firmendaten unbemerkt kopiert?", options: ["Vertraulichkeit", "Verfügbarkeit", "Safety", "Integrität"], answer: "Vertraulichkeit", exp: "Unberechtigter Zugriff auf Daten verletzt primär das Schutzziel der Vertraulichkeit." },
            { type: "mc", q: "23. Ein Techniker verbindet zwei Access-Switches direkt über ein normales Patchkabel, aber es kommt kein Link zustande (und die Kabelbelegung ist gerade). Woran kann es liegen?", options: ["Der Switch unterstützt kein Auto-MDI/MDI-X und es wäre ein Crossover-Kabel nötig.", "Die IP-Adresse des Switches ist falsch konfiguriert.", "Der DNS-Server antwortet nicht auf Port 53.", "Die Festplatte des Switches ist voll."], answer: "Der Switch unterstützt kein Auto-MDI/MDI-X und es wäre ein Crossover-Kabel nötig.", exp: "Ältere Geräte ohne Auto-MDI/MDI-X erfordern gekreuzte Kabel (Crossover) bei Switch-zu-Switch-Kopplung." },
            { type: "mc", q: "24. Was geschieht bei einem DHCP Discover?", options: ["Ein neuer Client sucht im lokalen Netz nach verfügbaren DHCP-Servern.", "Ein Server bestätigt die endgültige Vergabe der IP-Adresse.", "Der Client gibt seine alte IP-Adresse beim Server frei.", "Der Router übersetzt private IPs in öffentliche Adressen."], answer: "Ein neuer Client sucht im lokalen Netz nach verfügbaren DHCP-Servern.", exp: "Discover ist der erste Schritt (D) im vierphasigen DORA-Prozess." },
            { type: "mc", q: "25. Welches Protokoll wird für die sichere Übertragung von Webseiten per Browser verwendet?", options: ["HTTPS", "FTP", "SNMP", "SMTP"], answer: "HTTPS", exp: "HTTPS nutzt Verschlüsselung (TLS) auf Port 443." },
            { type: "mc", q: "26. Warum ist eine USV (Unterbrechungsfreie Stromversorgung) im Serverraum wichtig?", options: ["Sie schützt vor Datenverlust bei Stromausfall und puffert kurzzeitig Spitzen ab.", "Sie erhöht die Bandbreite der Glasfaseranbindung ins Internet.", "Sie ersetzt vollständig die Notwendigkeit von Firewall-Regeln.", "Sie kühlt die Server-Racks bei Überhitzung."], answer: "Sie schützt vor Datenverlust bei Stromausfall und puffert kurzzeitig Spitzen ab.", exp: "USV-Anlagen sichern die Verfügbarkeit bei Stromstörungen." },
            { type: "mc", q: "27. Was ist ein FQDN (Fully Qualified Domain Name)?", options: ["Der vollständige absolute Hostname inklusive Domain und Top-Level-Domain", "Die eindeutige 48-Bit-MAC-Adresse der Netzwerkkarte", "Die IP-Adresse des Standardgateways im lokalen Netz", "Eine Portnummer für ausgehende Webverbindungen"], answer: "Der vollständige absolute Hostname inklusive Domain und Top-Level-Domain", exp: "Beispiel: `server01.it.firma.de` ist ein FQDN." },
            { type: "mc", q: "28. Welcher Bereich beschreibt den Tertiärbereich in der strukturierten Verkabelung?", options: ["Die horizontale Verkabelung vom Etagenverteiler zur Arbeitsplatzdose", "Die Campus-Verbindung zwischen verschiedenen Gebäuden", "Die Steigleitung zwischen Hauptverteiler und Etagenverteiler", "Die direkte interne Verkabelung im Rechenzentrum"], answer: "Die horizontale Verkabelung vom Etagenverteiler zur Arbeitsplatzdose", exp: "Primär = Campus, Sekundär = Gebäude/Vertikal, Tertiär = Etage/Horizontal." },
            { type: "mc", q: "29. Ein Administrator möchte die MAC-Adresstabelle eines Cisco-Switches einsehen. Auf welcher OSI-Schicht arbeitet dieses Gerät primär?", options: ["Schicht 2", "Schicht 1", "Schicht 3", "Schicht 7"], answer: "Schicht 2", exp: "Switches operieren als Layer-2-Geräte auf Basis von MAC-Adressen." },
            { type: "mc", q: "30. Was ist der Zweck von Port Security auf einem Managed Switch?", options: ["Das Begrenzen erlaubter MAC-Adressen an einem Port zur Abwehr fremder Geräte", "Das automatische Erhöhen der PoE-Leistung für angeschlossene Kameras", "Das Verschlüsseln aller Ethernet-Frames mit AES-256", "Das automatische Umschalten auf Glasfaser bei Kabelbruch"], answer: "Das Begrenzen erlaubter MAC-Adressen an einem Port zur Abwehr fremder Geräte", exp: "Port Security verhindert das unautorisierte Anschließen fremder Hardware an Switchports." },
            { type: "mc", q: "31. Welche Aufgabe hat das Default Gateway in einem Rechnernetz?", options: ["Weiterleiten von Paketen in andere, fremde IP-Netze", "Auflösen von IP-Adressen in MAC-Adressen", "Verteilen von IP-Konfigurationen an Clients", "Verschlüsseln des internen Datenverkehrs"], answer: "Weiterleiten von Paketen in andere, fremde IP-Netze", exp: "Das Gateway fungiert als Ausgangstor für den netzwerkübergreifenden Verkehr." },
            { type: "mc", q: "32. Was versteht man unter dem Begriff 'Crosstalk' bei Kupferkabeln?", options: ["Elektromagnetisches Übersprechen von Signalen benachbarter Aderpaare", "Eine Störung durch direkte Sonneneinstrahlung auf das Kabel", "Den totalen Abriss der Datenverbindung durch Kabelbruch", "Die automatische Verdopplung der Übertragungsrate"], answer: "Elektromagnetisches Übersprechen von Signalen benachbarter Aderpaare", exp: "Crosstalk entsteht, wenn Signale eines Paares in benachbarte Adern induziert werden." },
            { type: "mc", q: "33. Warum wird in modernen WLANs WPA3 gegenüber WPA2 bevorzugt?", options: ["SAE erschwert Brute-Force-Angriffe auf aufgezeichnete Handshakes.", "WPA3 benötigt im Gegensatz zu WPA2 überhaupt keinen Strom.", "WPA3 funktioniert ausschließlich über alte Hubs.", "WPA3 verdoppelt die Reichweite von Funksignalen."], answer: "SAE erschwert Brute-Force-Angriffe auf aufgezeichnete Handshakes.", exp: "WPA3 bietet durch das Simultaneous Authentication of Equals (SAE) Protokoll starken Schutz gegen Offline-Passwort-Cracking." },
            { type: "mc", q: "34. Was passiert, wenn ein Switch keine passende Ziel-MAC in seiner Adresstabelle findet?", options: ["Er flutet das Frame an alle Ports im selben VLAN.", "Er verwirft das Paket sofort ohne Rückmeldung.", "Er sendet eine Fehlermeldung per ICMP an den Absender.", "Er leitet das Paket automatisch an den Standardrouter weiter."], answer: "Er flutet das Frame an alle Ports im selben VLAN.", exp: "Unbekannte Unicast-Frames werden per Flooding an alle Ports des VLANs verteilt." },
            { type: "mc", q: "35. Welches OSI-Modell-Layer ist für die logische Adressierung und das Routing zuständig?", options: ["Schicht 3 (Netzwerkschicht)", "Schicht 2 (Sicherungsschicht)", "Schicht 4 (Transportschicht)", "Schicht 1 (Bitübertragungsschicht)"], answer: "Schicht 3 (Netzwerkschicht)", exp: "Schicht 3 verarbeitet IP-Adressen und Routing-Entscheidungen." },
            { type: "mc", q: "36. Ein Techniker konfiguriert eine Firewall-Regel. Was ist für eine ordnungsgemäße Dokumentation zwingend erforderlich?", options: ["Eine klare Begründung, warum die Regel benötigt wird und wer sie nutzt", "Die private Handynummer des Herstellers", "Die exakte Seriennummer des angeschlossenen Switches", "Die Raumtemperatur im Serverraum"], answer: "Eine klare Begründung, warum die Regel benötigt wird und wer sie nutzt", exp: "Regeldokumentation erfordert Zonen, Dienste, Richtungen und fachliche Begründungen." },
            { type: "mc", q: "37. Was beschreibt der Durchsatz (Throughput) im Vergleich zur Bandbreite?", options: ["Die real gemessene Netto-Übertragungsrate unter Berücksichtigung von Last und Overhead", "Die theoretische maximale Brutto-Kapazität des Kabels", "Die maximale physikalische Länge der Leitung in Metern", "Die Anzahl der angeschlossenen Endgeräte am Switch"], answer: "Die real gemessene Netto-Übertragungsrate unter Berücksichtigung von Last und Overhead", exp: "Der Durchsatz ist stets niedriger als die theoretische Bandbreite." },
            { type: "mc", q: "38. Was ist die Hauptfunktion eines DNS-Servers?", options: ["Auflösen von Domainnamen in IP-Adressen und umgekehrt", "Verteilen von IP-Adressen an neue Clients im Netz", "Verschlüsseln des gesamten Webverkehrs", "Steuern des Datenverkehrs zwischen verschiedenen VLANs"], answer: "Auflösen von Domainnamen in IP-Adressen und umgekehrt", exp: "DNS (Domain Name System) übersetzt lesbare Namen in IP-Adressen." },
            { type: "mc", q: "39. Welches Transportprotokoll arbeitet verbindungslos und ohne Empfangsbestätigung?", options: ["UDP", "TCP", "HTTP", "SSH"], answer: "UDP", exp: "UDP verzichtet auf Handshake und Bestätigungen, was es schnell für Echtzeitanwendungen macht." },
            { type: "mc", q: "40. Ein Rechner zeigt nach Eingabe von 'ipconfig' eine Subnetzmaske von '255.255.255.0'. Wie viele Host-IPs stehen in diesem Subnetz theoretisch zur Verfügung?", options: ["254", "256", "512", "1024"], answer: "254", exp: "Bei einem 24-Bit-Präfix bleiben 8 Host-Bits übrig (2^8 = 256 minus Netz- und Broadcast-Adresse = 254)." },
            { type: "mc", q: "41. Was ist ein Patchpanel im Schrank?", options: ["Ein passives Verteilerfeld zum Auflegen von Verlegekabeln", "Ein aktiver Router mit integrierter Firewall", "Ein zentraler Server für die Benutzerverwaltung", "Ein spezielles Netzzteil für USV-Anlagen"], answer: "Ein passives Verteilerfeld zum Auflegen von Verlegekabeln", exp: "Patchpanels sind passive Komponenten zur strukturierten Rangierung." },
            { type: "mc", q: "42. Welcher Befehl testet unter Windows die Verbindung zu einem Zielhost und zeigt gleichzeitig alle passierten Router-Hops?", options: ["tracert", "ipconfig /all", "ping -t", "arp -a"], answer: "tracert", exp: "Tracert kombiniert ICMP/TTL-Mechanismen zur Wegverfolgung." },
            { type: "mc", q: "43. Was ist eine Schwachstelle (Vulnerability) im Kontext der IT-Sicherheit?", options: ["Eine ausnutzbare Lücke oder ein Fehler in einem System oder Prozess", "Ein wertvolles Betriebsmittel des Unternehmens", "Ein gezielter Cyberangriff von außen", "Die Wahrscheinlichkeit eines Schadens"], answer: "Eine ausnutzbare Lücke oder ein Fehler in einem System oder Prozess", exp: "Schwachstellen bieten Angreifern den Einstiegspunkt für Exploits." },
            { type: "mc", q: "44. Warum ist die Verwendung von Standard-Passwörtern auf Routern und Switches ein hohes Sicherheitsrisiko?", options: ["Da diese Passwörter öffentlich bekannt sind und Angreifer sofort Zugriff erhalten", "Weil der Router dadurch zu viel Strom verbraucht", "Weil das Gerät dadurch automatisch auf Werkseinstellungen zurücksetzt", "Weil der Zugriff auf den DNS-Dienst blockiert wird"], answer: "Da diese Passwörter öffentlich bekannt sind und Angreifer sofort Zugriff erhalten", exp: "Hardcoded Standard-Credentials sind das häufigste Einfallstor für Botnets und Angreifer." },
            { type: "mc", q: "45. Welche Aufgabe erfüllt das Address Resolution Protocol (ARP)?", options: ["Ermitteln der MAC-Adresse zu einer bekannten lokalen IP-Adresse", "Übersetzen von IP-Adressen in externe Domainnamen", "Verteilen automatischer IP-Konfigurationen an Notebooks", "Steuern des Spanning Tree Protocols zur Schleifenvermeidung"], answer: "Ermitteln der MAC-Adresse zu einer bekannten lokalen IP-Adresse", exp: "ARP schlägt die Brücke zwischen Netzwerkschicht (IP) und Sicherungsschicht (MAC)." },
            { type: "mc", q: "46. Was ist ein wesentlicher Vorteil von LWL (Glasfaser) gegenüber Kupferkabeln?",options: ["Unempfindlichkeit gegenüber elektromagnetischen Störungen (EMI) und hohe Reichweiten", "Geringerer Anschaffungspreis bei Patchkabeln", "Einfacheres Crimpen von RJ45-Steckern vor Ort", "Automatische Stromversorgung von Endgeräten ohne PoE"], answer: "Unempfindlichkeit gegenüber elektromagnetischen Störungen (EMI) und hohe Reichweiten", exp: "LWL leitet Licht statt Strom, ist immun gegen EMI und verlustfrei über Kilometer." },
            { type: "mc", q: "47. Was versteht man unter Port Forwarding (Portweiterleitung) am Router?", options: ["Das gezielte Weiterleiten eingehender Anfragen an einen internen Serverdienst", "Das Sperren sämtlicher Internetports für alle Mitarbeiter", "Das automatische Bündeln von vier Switchports für mehr Speed", "Das Spiegeln von Datenverkehr für Analyse-Tools"], answer: "Das gezielte Weiterleiten eingehender Anfragen an einen internen Serverdienst", exp: "Port Forwarding leitet bestimmte externe Port-Anfragen an eine interne IP weiter." },
            { type: "mc", q: "48. Welcher Zustand beschreibt eine vollvermaschte (Full Mesh) Topologie bei 5 Geräten?", options: ["Jedes Gerät ist direkt mit jedem anderen Gerät verbunden.", "Alle Geräte hängen an einem gemeinsamen Buskabel.", "Es existiert exakt ein zentraler Core-Switch.", "Die Geräte sind ringförmig miteinander verkettet."], answer: "Jedes Gerät ist direkt mit jedem anderen Gerät verbunden.", exp: "Vollvermaschung bedeutet direkte Verbindungen zwischen allen Knotenpunkten." },
            { type: "mc", q: "49. Was ist ein Indiz für einen erfolgreichen Loop in einem ungesicherten Netzwerk?", options: ["Kompletter Stillstand des Netzwerks und extrem hohe CPU-Auslastung der Switches", "Eine plötzliche Verdopplung der Internetbandbreite", "Die automatische Vergabe von APIPA-Adressen an alle Server", "Das Aufleuchten der Power-LED am Netzteil"], answer: "Kompletter Stillstand des Netzwerks und extrem hohe CPU-Auslastung der Switches", exp: "Loops erzeugen endlose Broadcast-Stürme, die Netzwerke sofort überlasten." },
            { type: "mc", q: "50. Welches Schutzziel wird durch digitale Signaturen und Protokollierungen unterstützt?", options: ["Verbindlichkeit (Nichtabstreitbarkeit)", "Ausschließlich die Vertraulichkeit", "Die physische Gerätesicherheit", "Die rein elektrische Absicherung"], answer: "Verbindlichkeit (Nichtabstreitbarkeit)", exp: "Digitale Signaturen und Audit-Logs stellen sicher, dass Aktionen nachweisbar sind." }
        ]
    }

if (ihkTrainer) {
